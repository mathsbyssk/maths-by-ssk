<style>
:root{
  --ink:#1b1f3b; --ink2:#3b4160; --muted:#6b7183; --bg:#f4f5fb; --card:#fff; --line:#e4e7f0;
  --brand1:#1e3a8a; --brand2:#4338ca; --accent:#fbbf24;
  --blue:#2b7bd6; --orange:#e8693a; --green:#1cb07a; --amber:#eba200; --pink:#e87aa4; --gray:#c9c7c1; --purple:#7c3aed;
  --sblue:#eef2fd; --sgreen:#e5f5ec; --sgray:#f2f2ef; --sorange:#fdf3ea; --slav:#f1effd; --syellow:#fdf8e4; --sred:#fdeaea;
  --red:#d93a3a; --ok:#14935f;
  --r:16px; --shadow:0 1px 2px rgba(20,24,60,.06),0 4px 14px rgba(20,24,60,.06);
  --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
h1,h2,h3,h4{font-family:var(--head);margin:0 0 .4em;line-height:1.25}
h2{font-size:1.25rem} h3{font-size:1.05rem}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.center{text-align:center} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.sp{height:12px}

/* ---------- app shell ---------- */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--brand1),var(--brand2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(30,40,120,.25)}
.topbar h1{font-size:1.08rem;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:.75rem;opacity:.85}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.page{max-width:860px;margin:0 auto;padding:16px 14px 110px}
.page.wide{max-width:1180px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 0;cursor:pointer}
.bottomnav button svg{width:23px;height:23px}
.bottomnav button.on{color:var(--brand2);font-weight:600}

/* ---------- cards & controls ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid #edf0f6}
.card+.card{margin-top:12px}
.card.flat{box-shadow:none}
.card h3{margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--brand2);color:#fff;font-size:.95rem;min-height:44px;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.btn.sec{background:#eef0fb;color:var(--brand2)}
.btn.ghost{background:transparent;color:var(--brand2);padding:8px 10px}
.btn.danger{background:#fde8e8;color:var(--red)}
.btn.green{background:var(--green)}
.btn.wa{background:#25d366;color:#08331a}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;color:var(--ink2)}
.input,select.input,textarea.input{width:100%;border:1.5px solid #d9dceb;border-radius:12px;padding:11px 12px;background:#fff;font-size:1rem;outline:none}
.input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(67,56,202,.12)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#eef0fb;color:var(--brand2);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.g{background:var(--sgreen);color:var(--ok)} .chip.r{background:var(--sred);color:var(--red)} .chip.a{background:var(--syellow);color:#8a5a00} .chip.p{background:var(--slav);color:var(--purple)} .chip.n{background:#f0f1f5;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toggle{border:1.5px solid #d9dceb;background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.toggle.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.sectiontitle{font-family:var(--head);font-weight:600;font-size:1rem;margin:22px 4px 10px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;border:1px solid #edf0f6;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi b{display:block;font-family:var(--head);font-size:1.5rem;color:var(--brand2)}
.kpi span{font-size:.85rem;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden}
.avatar svg{width:100%;height:100%}
.avatar.lg{width:72px;height:72px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:600;background:#fafbfe;position:sticky;top:0}
.tblwrap{overflow:auto;max-width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover{background:#f7f8fd}

/* ---------- toast / modal / loading ---------- */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2140;color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.modalbg{position:fixed;inset:0;background:rgba(15,18,40,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modalbg{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.modal{border-radius:20px}}
.modal h3{font-size:1.1rem}
.spinner{width:34px;height:34px;border:4px solid #dfe2f2;border-top-color:var(--brand2);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
.loginwrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;background:linear-gradient(160deg,var(--brand1),var(--brand2) 60%,#5b4de0)}
.logincard{background:#fff;border-radius:22px;padding:24px 20px;max-width:420px;width:100%;margin:0 auto;box-shadow:0 18px 50px rgba(10,10,60,.35)}
.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brandmark .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--brand1),var(--brand2));display:grid;place-items:center;color:var(--accent);font-family:var(--head);font-weight:700;font-size:1.35rem}
.pill{display:inline-block;background:var(--accent);color:#1d2140;border-radius:999px;padding:3px 12px;font-family:var(--head);font-weight:700;font-size:.72rem;letter-spacing:.02em}
.err{background:var(--sred);color:#9b1c1c;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
.info{background:var(--sblue);color:#1e3a8a;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}

/* ---------- maths content ---------- */
.qtext{font-size:1.02rem;line-height:1.6;overflow-wrap:anywhere}
.qtext p{margin:0 0 .55em}
.qtext .katex{font-size:1.04em}
.qtext .katex .mfrac{margin:0 .08em}
.qtext .katex-display{margin:.3em 0}
.qimg{display:block;max-width:min(100%,360px);height:auto;margin:8px auto;border-radius:8px;background:#fff}
.qimgph{display:block;width:240px;height:140px;margin:8px auto;border-radius:8px;background:#f0f1f6}
.dtable{border-collapse:collapse;margin:8px 0;font-size:.9rem;display:block;overflow-x:auto;max-width:100%}
.dtable td{border:1px solid #cfd3e3;padding:5px 9px;text-align:center;white-space:nowrap}
.dtable tr:first-child td{background:#eef1fb;font-weight:600}
.ansbox{background:var(--sgreen);border-left:4px solid var(--green);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600;color:#0d5c3d}
.parts{margin:6px 0 0;padding:0;list-style:none}
.parts li{margin:4px 0}
.parts .pm{color:var(--muted);font-size:.85rem;white-space:nowrap}

/* ---------- test runner ---------- */
.runner{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.runhead{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--brand1),var(--brand2));color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.timer{font-family:var(--head);font-weight:700;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.timer.low{background:#fde2e2;color:var(--red)}
.runbody{flex:1;padding:14px 12px 150px;max-width:760px;margin:0 auto;width:100%}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid #e1e4ef;border-radius:14px;padding:12px 12px;margin:9px 0;cursor:pointer;font-size:1rem}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #c8cce0;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--ink2)}
.opt.sel{border-color:var(--brand2);background:#f3f2ff}
.opt.sel .L{background:var(--brand2);border-color:var(--brand2);color:#fff}
.opt.right{border-color:var(--green);background:var(--sgreen)} .opt.right .L{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--sred)} .opt.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.opt .ot{flex:1;padding-top:3px;overflow-wrap:anywhere}
.runfoot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.runfoot .in{max-width:760px;margin:0 auto}
.runfoot .row{gap:8px}
.runfoot .btn{flex:1;padding:10px 8px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pal{height:46px;border-radius:12px;border:2px solid transparent;font-weight:700;cursor:pointer;background:#eceef4;color:var(--ink2);position:relative}
.pal.ans{background:var(--green);color:#fff}
.pal.skip{background:#fde3d6;color:#b4471d}
.pal.rev{background:var(--purple);color:#fff}
.pal.revans{background:var(--purple);color:#fff}
.pal.revans::after{content:'';position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#6ee7b7}
.pal.cur{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:5px;vertical-align:-2px}

/* ---------- results ---------- */
.scorehero{background:linear-gradient(120deg,var(--brand1),var(--brand2));color:#fff;border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.scorehero .sv{font-family:var(--head);font-size:1.6rem;font-weight:700}
.scorehero .sl{font-size:.8rem;opacity:.85}
.rq{background:#fff;border-radius:16px;padding:14px;border:1px solid #edf0f6;margin:10px 0}
.rq .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
details.sol summary{cursor:pointer;color:var(--brand2);font-weight:600;padding:6px 0;list-style:none}
details.sol summary::-webkit-details-marker{display:none}
details.sol[open] summary{margin-bottom:6px}
.solbody{border-top:1px dashed var(--line);padding-top:8px}
.solbody p{margin:0 0 .45em}
.mine{background:#f7f7fb;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.95rem}

/* ---------- announcements ---------- */
.ann{background:#fff;border-radius:14px;border:1px solid #edf0f6;padding:12px 14px;margin:8px 0;cursor:pointer}
.ann.pin{border:2px solid var(--accent);background:#fffcf0}
.ann .at{font-weight:700;display:flex;gap:8px;align-items:center}
.ann .ab{white-space:pre-wrap;margin-top:6px;color:var(--ink2)}
.newdot{background:var(--red);color:#fff;border-radius:999px;font-size:.68rem;padding:2px 8px;font-weight:700}

/* ---------- hero (student home) ---------- */
.hero{background:linear-gradient(120deg,var(--brand1),var(--brand2));color:#fff;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.hero .avatar{background:rgba(255,255,255,.2)}

/* ---------- exam guide ---------- */
.gtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.gtabs button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:#fff;border:1.5px solid #dfe2f0;font-weight:600;font-size:.85rem;cursor:pointer}
.gtabs button.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.gbanner{background:linear-gradient(110deg,#25388f,#4338ca);color:#fff;border-radius:20px;padding:16px 16px 18px;position:relative;margin-bottom:12px}
.gbanner .pg{position:absolute;right:16px;top:14px;font-family:var(--head);font-weight:700;font-size:1.4rem}
.gbanner h2{color:#fff;font-size:1.45rem;margin:10px 0 0}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gstats .s{background:var(--sblue);border-radius:16px;padding:12px;text-align:center}
.gstats .s:last-child:nth-child(odd){grid-column:1/-1}
.gstats b{display:block;font-family:var(--head);color:#2c35a0;font-size:1.45rem}
.gstats span{color:var(--ink2);font-size:.88rem}
.gnotes{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){.gnotes{grid-template-columns:1fr 2fr}.gstats{grid-template-columns:repeat(5,1fr)}.gstats .s:last-child:nth-child(odd){grid-column:auto}}
.gnote{border-radius:16px;padding:12px 14px}
.gnote b{font-family:var(--head);display:block;margin-bottom:2px}
.tone-gray{background:var(--sgray)} .tone-green{background:var(--sgreen)} .tone-blue{background:var(--sblue);border:1.5px solid #c8d6f6}
.tone-orange{background:var(--sorange);border:1.5px solid #f6cfa8} .tone-lavender{background:var(--slav);border:1.5px solid #d6cff6} .tone-yellow{background:var(--syellow);border:1.5px solid #f3e3a1} .tone-white{background:#fff;border:1.5px solid #e6e8f0}
.gcard{border-radius:18px;padding:14px;margin-top:12px}
.gcard h3{font-size:1.02rem}
.callout{border-radius:18px;padding:14px 16px;margin-top:12px;font-size:1rem;line-height:1.6}
.callout.tone-blue strong{color:#2c35a0} .callout.tone-orange strong{color:#b4471d} .callout.tone-lavender strong{color:#6a2fd0}
.hbar{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px;align-items:center;margin:9px 0}
.hbar .lb{font-weight:600;font-size:.92rem;line-height:1.2}
.hbar .lb small{display:block;color:var(--muted);font-weight:400;font-size:.76rem}
.hbar .tr{position:relative;height:24px;display:flex;align-items:center;gap:6px}
.hbar .b1{height:22px;background:var(--blue);border-radius:0 6px 6px 0}
.hbar .b2{height:22px;background:#a9c8f2;border-radius:0 6px 6px 0}
.hbar .v{font-weight:700;font-size:.88rem;white-space:nowrap}
.tag{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag-High{background:#fde3e3;color:#b42323} .tag-Medium{background:#dff3e7;color:#18794e} .tag-Easy{background:#fdf1d3;color:#8a5a00}
.glegend{display:flex;gap:14px;font-size:.85rem;margin-top:8px;flex-wrap:wrap}
.glegend i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.foot{color:var(--muted);font-size:.84rem;margin-top:6px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.secc{background:#fff;border:1.5px solid #e6e8f0;border-radius:16px;padding:12px;border-top-width:6px}
.secc .nm{font-family:var(--head);font-weight:700}
.secc .qq{color:var(--muted);font-size:.85rem}
.secc .fx{font-family:var(--head);font-weight:700;font-size:1.6rem;margin:2px 0}
.secc .tm{display:inline-block;background:#f2f2f5;border-radius:8px;padding:2px 8px;font-weight:700;font-size:.85rem;margin-top:6px}
.c-blue{--c:var(--blue)} .c-orange{--c:var(--orange)} .c-green{--c:var(--green)} .c-amber{--c:var(--amber)} .c-pink{--c:var(--pink)} .c-gray{--c:var(--gray)} .c-purple{--c:var(--purple)}
.secc{border-top-color:var(--c)}
.sbar{display:flex;gap:3px;margin:8px 0 2px}
.sbar .sg{background:var(--c);color:#1d2140;border-radius:8px;height:40px;display:grid;place-items:center;font-weight:700;font-size:.85rem;min-width:22px}
.sbar.cap .sg{color:#1d2140}
.scap{display:flex;gap:3px}
.scap div{text-align:center;font-size:.72rem;color:var(--muted);min-width:22px}
.clockt{display:flex;gap:3px;font-size:.66rem;color:var(--muted);margin-top:8px}
.phase{border-radius:16px;overflow:hidden;border:1.5px solid #e6e8f0;background:#fff}
.phase .ph{background:var(--c);color:#14183a;padding:8px 12px;font-weight:600}
.phase .ph b{font-family:var(--head)}
.phase .pb{padding:10px 12px;font-size:.92rem;color:var(--ink2)}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.phases{grid-template-columns:repeat(4,1fr)}}
.gcards{display:grid;gap:10px;margin-top:12px}
@media (min-width:700px){.gcards.two{grid-template-columns:1fr 1fr}.gcards.three{grid-template-columns:1fr 1fr 1fr}}
.gcards .gcard{margin-top:0}
.gcard ul{margin:6px 0 0;padding-left:20px}
.gcard li{margin:5px 0}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 4px 0;border-bottom:1.5px solid #d7dbe8}
.cols .cl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cols .cb{width:100%;max-width:38px;background:var(--blue);border-radius:6px 6px 0 0}
.cols .cv{font-weight:700;font-size:.8rem;margin-bottom:3px}
.colx{display:flex;gap:8px;padding:4px 4px 0}
.colx div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}

/* ---------- admin ---------- */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(15,18,40,.4)}
.drawer .panel{position:absolute;left:0;top:0;bottom:0;width:min(300px,84vw);background:#fff;padding:14px 10px;overflow:auto;box-shadow:4px 0 30px rgba(0,0,0,.2)}
.drawer .panel button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px 12px;border-radius:12px;font-size:.98rem;cursor:pointer;text-align:left}
.drawer .panel button.on{background:#eef0fb;color:var(--brand2);font-weight:600}
.drawer .panel button svg{width:21px;height:21px;flex:none}
.qrow{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.qrow .qx{flex:1;min-width:0;font-size:.92rem}
.qrow .qx .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview{border:1.5px dashed #cfd3e6;border-radius:14px;padding:12px;background:#fcfcff}
.counts{display:grid;grid-template-columns:auto 80px 80px auto;gap:6px 10px;align-items:center}
.counts .h{font-size:.78rem;color:var(--muted);font-weight:600}
.counts input{padding:8px 8px}
.jf fieldset{border:1.5px solid #e4e7f0;border-radius:14px;padding:10px 12px;margin:10px 0}
.jf legend{font-weight:700;font-size:.88rem;padding:0 6px;color:var(--brand2)}
.jf .arritem{border-left:3px solid #e1e4f2;padding-left:10px;margin:10px 0}
.gradebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gradebox input{width:84px}
.bar{height:10px;border-radius:6px;background:#eceef6;overflow:hidden}
.bar>div{height:100%;background:var(--blue)}
@media (min-width:900px){.page{padding-left:22px;padding-right:22px}}

/* ---------- v3: chat, revise, confidence ---------- */
.tbav{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid rgba(255,255,255,.7);padding:0;cursor:pointer;flex:none}
.tbav svg{width:100%;height:100%;display:block}
.bottomnav button{position:relative}
.bottomnav button.dot::after,.iconbtn.dot::after{content:'';position:absolute;top:3px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:#e5484d;border:2px solid #fff}
.iconbtn{position:relative}
.iconbtn.dot::after{top:4px;left:auto;right:4px;border-color:var(--brand2)}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:#e5484d;color:#fff;font-size:.72rem;font-weight:700;text-align:center;margin-left:auto}
.drawer .badge{margin-left:auto}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:82%;padding:8px 12px 6px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;font-size:.95rem;box-shadow:0 1px 2px rgba(20,30,80,.06)}
.bubble.me{align-self:flex-end;background:var(--brand2);color:#fff;border-bottom-right-radius:5px}
.bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.req.me{background:#e8e6fb;color:var(--ink);border:1px solid #cfcaf5}
.bubble.req.them{background:var(--syellow);border-color:#f3e3a1}
.bubble .tm{font-size:.66rem;opacity:.7;margin-top:3px;text-align:right}
.daysep{align-self:center;font-size:.72rem;color:var(--muted);background:#eceef4;border-radius:999px;padding:2px 10px;margin:8px 0 4px}
.chatbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:8px 10px}
.chatbar.admin{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.chatbar .in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.chatbar textarea{flex:1;min-height:44px;max-height:120px;resize:none;line-height:1.35}
.chatbar .btn{min-height:44px;padding:10px 14px}
.chatbar .btn svg{width:20px;height:20px}
.stars{display:inline-flex;gap:1px;color:#d5d8e2;font-size:1.05rem;letter-spacing:-1px;white-space:nowrap}
.stars.sm{font-size:.9rem}
.stars i{font-style:normal}
.stars i.on{color:#f5a524}
.conf{text-align:center}
.starin{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.starin button{background:none;border:0;font-size:2.3rem;line-height:1;color:#d5d8e2;cursor:pointer;padding:2px;transition:transform .1s}
.starin button.on{color:#f5a524}
.starin button:active{transform:scale(1.2)}
.seg{display:flex;background:#eceef6;border-radius:12px;padding:4px;gap:4px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand2);box-shadow:0 1px 3px rgba(20,30,80,.12)}
.fgrid{display:flex;flex-direction:column;gap:14px}
h4.bh{margin:12px 0 4px;color:var(--brand2);font-size:.95rem}
.btn.wrapbtn{white-space:normal;text-align:left;line-height:1.3}
.btn.wrapbtn svg{flex:none}
.fcard .dtable{font-size:.92rem}
.fcard .dtable td{padding:6px 5px}
/* v4: reminders, practice mocks, chapter videos */
.remind{border-color:#f3d9a0;background:var(--syellow)}
.ricon{width:40px;height:40px;border-radius:12px;background:#fff3cf;color:#a86b00;display:grid;place-items:center;flex:none}
.ricon svg{width:22px;height:22px}
.ricon.sm{width:34px;height:34px;border-radius:10px;background:var(--sblue);color:var(--brand2)}
.ricon.sm svg{width:18px;height:18px}
.pcard{cursor:pointer;border-color:#c9cdf6;background:linear-gradient(135deg,#eef2fd,#f4f0ff)}
.pcard .ricon{background:#e3e7ff;color:var(--brand2)}
.pchk input{width:20px;height:20px;flex:none;accent-color:var(--brand2)}
.vbtn{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:999px;background:#ffe5e5;color:#c4302b;font-weight:700;font-size:.75rem;padding:6px 10px 6px 8px;cursor:pointer;flex:none}
.vbtn svg{width:14px;height:14px}
.vbox{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#111}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;border:1px solid #edf0f6}
.vrow{padding:12px 4px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vitem{display:flex;align-items:center;gap:10px;margin-top:8px;padding:6px;border-radius:12px;background:#f7f8fc;cursor:pointer;min-width:0}
.vitem img,.vitem .vth{width:96px;height:54px;border-radius:8px;object-fit:cover;flex:none;background:#ffe5e5;display:grid;place-items:center;color:#c4302b}
.vitem .vth svg{width:22px;height:22px}
.vitem .clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.seg{overflow-x:auto}
.seg button{white-space:nowrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600}
@media (max-width:420px){.qtext .dtable td{padding:5px 6px}}
/* v5: photos, question doubts, home videos & notes */
.avatar img.ph,.tbav img.ph{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}

const PHOTO_MAX = 20000;            // bytes
function photoBytes(d) { const i = String(d || '').indexOf(','); return i < 0 ? 0 : Math.floor((d.length - i - 1) * 3 / 4); }
async function photoFromFile(file) {

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('This picture could not be opened. Try a JPG or PNG photo.')); i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
    if (!side) throw new Error('This picture could not be opened.');
    const sx = (w - side) / 2, sy = (h - side) / 3;          // square crop, a little above centre for faces
    for (const size of [256, 200, 160, 128]) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      for (const q of [0.85, 0.75, 0.65, 0.55, 0.45]) { const d = c.toDataURL('image/jpeg', q); if (d.startsWith('data:image/jpeg') && photoBytes(d) <= PHOTO_MAX - 500) return d; }
    }

  } finally { URL.revokeObjectURL(url); }
}

// ================= RICH TEXT + MATHS =================
function tex(t, display = false) {
  // \displaystyle keeps fractions full-size inside sentences, which reads better on small phones
  if (window.katex) { try { return window.katex.renderToString('\\displaystyle ' + t, { throwOnError: false, displayMode: display }); } catch { } }
  return `<code>${esc(t)}</code>`;
}
function inlineRich(s) {
  const parts = String(s ?? '').split(/(\$[^$]+\$)/g);
  return parts.map(p => {
    if (p.length > 2 && p.startsWith('$') && p.endsWith('$')) return tex(p.slice(1, -1));
    return esc(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  }).join('');
}
function renderBlocks(blocks) {
  return (blocks || []).map(b => {
    if (b.t === 'p') return `<p>${inlineRich(b.x)}</p>`;
    if (b.t === 'h') return `<h4 class="bh">${inlineRich(b.x)}</h4>`;
    if (b.t === 'ans') return `<div class="ansbox">${inlineRich(b.x)}</div>`;
    if (b.t === 'img') return `<img class="qimg qimgph" data-img="${esc(b.id)}" alt="Figure">`;
    if (b.t === 'fig') return figHtml(b.id);
    if (b.t === 'table') return `<table class="dtable">${(b.rows || []).map(r => `<tr>${(r.c || []).map(c => `<td>${inlineRich(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    return '';
  }).join('');
}
// text format used in the admin editor  <->  blocks
function blocksToText(blocks) {
  return (blocks || []).map(b => {
    if (b.t === 'p') return b.x;
    if (b.t === 'h') return '# ' + b.x;
    if (b.t === 'ans') return '>> ' + b.x;
    if (b.t === 'img') return `[img:${b.id}]`;
    if (b.t === 'fig') return `[fig:${b.id}]`;
    if (b.t === 'table') return (b.rows || []).map(r => '| ' + (r.c || []).join(' | ') + ' |').join('\n');
    return '';
  }).join('\n');
}
function textToBlocks(text) {
  const out = []; let table = null;
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    if (line.startsWith('|')) {
      const cells = line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      if (!table) { table = { t: 'table', rows: [] }; out.push(table); }
      table.rows.push({ c: cells }); continue;
    }
    table = null;
    if (!line) continue;
    const m = line.match(/^\[img:([A-Za-z0-9_-]+)\]$/);
    const f = line.match(/^\[fig:([a-z0-9_]+)\]$/);
    if (m) out.push({ t: 'img', id: m[1] });
    else if (f) out.push({ t: 'fig', id: f[1] });
    else if (line.startsWith('>>')) out.push({ t: 'ans', x: line.replace(/^>>\s*/, '') });
    else if (/^#\s+\S/.test(line)) out.push({ t: 'h', x: line.replace(/^#\s+/, '') });
    else out.push({ t: 'p', x: line });
  }
  return out;
}
function plainText(blocks, n = 140) {
  const s = (blocks || []).filter(b => b.t === 'p').map(b => b.x).join(' ').replace(/\$([^$]+)\$/g, '$1').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '($1)/($2)').replace(/\\[a-zA-Z]+/g, '').replace(/[{}*]/g, '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

// test items snapshot lives in the attempt; key = testKeys/{tid}.items (MCQ answers only)
function scoreAttempt(att, key) {
  const r = { mcq: 0, mcqMax: 0, wr: 0, wrMax: 0, pending: 0, writtenCount: 0, perCh: {}, correct: 0, wrong: 0, blank: 0 };
  for (const it of att.items || []) {
    const ch = it.chapter; r.perCh[ch] = r.perCh[ch] || { got: 0, max: 0 };
    if (it.type === 'MCQ') {
      r.mcqMax += it.marks;
      const resp = att.responses && att.responses[it.qid];
      const ans = key && key[it.qid] ? key[it.qid].answer : null;
      if (!resp || resp.o == null) r.blank++;
      else if (resp.o === ans) { r.mcq += it.marks; r.correct++; } else r.wrong++;
      if (ans != null) { r.perCh[ch].max += it.marks; if (resp && resp.o === ans) r.perCh[ch].got += it.marks; }
    } else {
      r.wrMax += it.marks; r.writtenCount++;
      const g = att.grades ? att.grades[it.qid] : undefined;
      if (g == null) r.pending++; else { r.wr += Number(g); r.perCh[ch].got += Number(g); r.perCh[ch].max += it.marks; }
    }
  }
  r.total = r.mcq + r.wr; r.max = r.mcqMax + r.wrMax;
  return r;
}

function ytParse(url) {
  let u; try { u = new URL(String(url || '').trim()); } catch { return null; }
  const host = u.hostname.replace(/^(www\.|m\.|music\.)/, '');
  if (!['youtube.com', 'youtu.be', 'youtube-nocookie.com'].includes(host)) return null;
  const okId = s => /^[A-Za-z0-9_-]{11}$/.test(s || '') ? s : null;
  let id = null;
  if (host === 'youtu.be') id = okId(u.pathname.split('/')[1]);
  else if (u.searchParams.get('v')) id = okId(u.searchParams.get('v'));
  else { const m = u.pathname.match(/^\/(shorts|live|embed|v)\/([^/?#]+)/); if (m) id = okId(m[2]); }
  const t = u.searchParams.get('t') || u.searchParams.get('start') || '';
  const tm = String(t).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
  const start = tm ? (Number(tm[1] || 0) * 3600 + Number(tm[2] || 0) * 60 + Number(tm[3] || 0)) : 0;
  const list = u.searchParams.get('list');
  if (id) return { id, start };
  if (list && /^[A-Za-z0-9_-]{10,64}$/.test(list)) return { list };
  return null;
}

// ================= EXAM GUIDE: renderer =================
function gText(s) { return inlineRich(s || ''); }

function clockMin(t) {
  const [h, m] = String(t).split(':').map(Number);
  const hh = h < 8 ? h + 12 : h;
  return hh * 60 + (m || 0);
}

function renderGuideBlock(b) {
  switch (b.type) {
    case 'stats':
      return `<div class="gstats">${(b.items || []).map(i => `<div class="s"><b>${esc(i.big)}</b><span>${esc(i.small)}</span></div>`).join('')}</div>`;
    case 'notes':
      return `<div class="gnotes">${(b.items || []).map(i => `<div class="gnote tone-${esc(i.tone || 'gray')}"><b>${esc(i.title)}</b>${gText(i.text)}</div>`).join('')}</div>`;
    case 'bars': {
      const max = Number(b.max) || Math.max(...(b.items || []).map(i => Number(i.value) || 0), 1);
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>${(b.items || []).map(i => `
        <div class="hbar"><div class="lb">${esc(i.label)}<small>${esc(i.sub || '')}</small></div>
        <div class="tr"><div class="b1" style="width:${Math.min(100, (Number(i.value) || 0) / max * 85)}%"></div><span class="v">${esc(i.value)}</span></div></div>`).join('')}
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    case 'rangebars': {
      const max = Number(b.max) || 10;
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>${(b.items || []).map(i => {
        const lo = Number(i.low) || 0, hi = Math.max(Number(i.high) || 0, lo);
        const tagKey = String(i.tag || '').split(' ')[0];
        return `<div class="hbar"><div class="lb">${esc(i.label)}</div>
        <div class="tr"><div style="display:flex;width:${hi / max * 70}%"><div class="b1" style="width:${hi ? lo / hi * 100 : 0}%;border-radius:${hi > lo ? '0' : '0 6px 6px 0'}"></div>${hi > lo ? `<div class="b2" style="width:${(hi - lo) / hi * 100}%"></div>` : ''}</div>
        <span class="v">${esc(i.text || (lo === hi ? lo : lo + '–' + hi))}</span>${i.tag ? `<span class="tag tag-${esc(tagKey)}">${esc(i.tag)}</span>` : ''}</div></div>`;
      }).join('')}
        <div class="glegend"><span><i style="background:var(--blue)"></i>${esc(b.legendUsual || 'usual marks')}</span><span><i style="background:#a9c8f2"></i>${esc(b.legendUpto || 'can go up to')}</span></div>
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    case 'callout':
      return `<div class="callout tone-${esc(b.tone || 'blue')}">${gText(b.text)}</div>`;
    case 'text':
      return `<p class="foot" style="font-size:.92rem">${gText(b.text)}</p>`;
    case 'sections':
      return `<div class="secgrid">${(b.items || []).map(i => `<div class="secc c-${esc(i.color || 'blue')}">
        <div class="nm">${esc(i.name)}</div><div class="qq">${esc(i.qs)}</div><div class="fx">${esc(i.formula)}</div>
        <div class="small">${gText(i.desc)}</div><span class="tm">${esc(i.time)}</span></div>`).join('')}</div>`;
    case 'stackbar': {
      const items = b.items || [];
      const tot = items.reduce((s, i) => s + (Number(i.value) || 0), 0) || 1;
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="sbar">${items.map(i => `<div class="sg c-${esc(i.color || 'blue')}" style="flex:${Number(i.value) || 0}">${esc(i.label)}</div>`).join('')}</div>
        <div class="scap">${items.map(i => `<div style="flex:${Number(i.value) || 0}">${esc(i.caption || i.value)}</div>`).join('')}</div></div>`;
    }
    case 'clock': {
      const items = b.items || [];
      const segs = items.map(i => ({ ...i, d: Math.max(1, clockMin(i.end) - clockMin(i.start)) }));
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="clockt">${segs.map(s => `<div style="flex:${s.d}">${esc(s.start)}</div>`).join('')}<div style="flex:0 0 auto">${esc(segs.length ? segs[segs.length - 1].end : '')}</div></div>
        <div class="sbar">${segs.map(s => `<div class="sg c-${esc(s.color || 'blue')}" style="flex:${s.d}">${esc(s.label)}</div>`).join('')}</div>
        <div class="tiny muted">${segs.map(s => `${esc(s.label)} ${esc(s.start)}–${esc(s.end)}`).join(' · ')}</div></div>`;
    }
    case 'cards': {
      const cols = Number(b.columns) || 1;
      return `<div class="gcards ${cols === 3 ? 'three' : cols === 2 ? 'two' : ''}">${(b.items || []).map(i => `
        <div class="card gcard tone-${esc(i.tone || 'white')}"><h3>${esc(i.icon || '')} ${esc(i.title)}</h3>
        <ul>${(i.bullets || []).map(x => `<li>${gText(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    }
    case 'phases':
      return `<div class="phases">${(b.items || []).map(i => `<div class="phase c-${esc(i.color || 'blue')}">
        <div class="ph"><b>${esc(i.head)}</b> · ${esc(i.sub)}</div><div class="pb">${gText(i.text)}</div></div>`).join('')}</div>`;
    case 'columns': {
      const items = b.items || [];
      const max = Number(b.max) || Math.max(1, ...items.map(i => Number(i.value) || 0));
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="cols">${items.map(i => `<div class="cl">${Number(i.value) ? `<div class="cv">${esc(i.value)}</div>` : ''}<div class="cb" style="height:${(Number(i.value) || 0) / max * 82}%"></div></div>`).join('')}</div>
        <div class="colx">${items.map(i => `<div>${esc(i.label)}</div>`).join('')}</div>
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    default:
      return '';
  }
}

function renderGuidePart(g, idx) {
  const p = g.parts[idx];
  const n = g.parts.length;
  return `<div class="gbanner"><span class="pill">${esc(g.badge)}</span><span class="pg">${idx + 1}/${n}</span><h2>${esc(p.title)}</h2></div>
    ${(p.blocks || []).map(renderGuideBlock).join('')}
    <p class="center tiny muted" style="margin-top:18px">${esc(g.footer)} · Part ${idx + 1} of ${n}</p>`;
}

101: {
  f: String.raw`# Balancing an equation
A balanced equation has the same number of atoms of every element on both sides (matter is never destroyed)
Balance by changing only the numbers in front, never the formulas themselves
States: $\ce{(s)}$ solid, $\ce{(l)}$ liquid, $\ce{(g)}$ gas, $\ce{(aq)}$ dissolved in water
$\ce{^}$ means a gas is given off, $\ce{v}$ means a solid settles out
# Combination and decomposition
Combination: $\ce{CaO + H2O -> Ca(OH)2}$
Thermal decomposition: $\ce{CaCO3 ->[heat] CaO + CO2}$
Thermal decomposition: $\ce{2FeSO4 ->[heat] Fe2O3 + SO2 + SO3}$
Electrolysis of water: $\ce{2H2O ->[electricity] 2H2 + O2}$
Decomposition by light: $\ce{2AgCl ->[sunlight] 2Ag + Cl2}$
# Displacement and double displacement
Displacement: $\ce{Fe + CuSO4 -> FeSO4 + Cu}$
Double displacement: $\ce{Na2SO4 + BaCl2 -> BaSO4 v + 2NaCl}$
Neutralisation: $\ce{NaOH + HCl -> NaCl + H2O}$
# Oxidation and reduction
Oxidation = gain of oxygen or loss of hydrogen
Reduction = loss of oxygen or gain of hydrogen
Redox: $\ce{CuO + H2 -> Cu + H2O}$
In that reaction $\ce{CuO}$ is reduced and $\ce{H2}$ is oxidised, so both happen together
# Heat in a reaction
Exothermic: heat is **given out** — burning, respiration, $\ce{CaO + H2O}$
Endothermic: heat is **taken in** — $\ce{CaCO3 ->[heat] CaO + CO2}$, photosynthesis
# Effects you can see
Corrosion: iron slowly turns into brown rust in damp air
Rancidity: oil and fat are oxidised and smell bad; stop it with antioxidants, nitrogen gas or airtight packing`,
  s: String.raw`A chemical equation is only correct when it is balanced; count the atoms element by element.
Balance by hit and trial: start with the formula having the most atoms and leave hydrogen and oxygen for the end.
Combination = two or more things make one. Decomposition = one thing breaks into two or more.
Decomposition always needs energy: heat (thermal), electricity (electrolysis) or light (photolysis).
In a displacement reaction the more reactive metal pushes the less reactive one out of its salt.
In a double displacement reaction the two solutions swap partners; an insoluble solid that forms is called a precipitate.
Oxidation and reduction always happen together, so such a reaction is called a redox reaction.
A white silver chloride turning grey in sunlight, and a silver article turning black, are both oxidation you can see.
>> Respiration is an exothermic reaction: it is a slow burning of food inside our cells.
Rust is hydrated iron(III) oxide. Rusting needs both air and water, so a painted or oiled surface stays safe.
Chips are packed in nitrogen gas because nitrogen does not let the oil oxidise.`
},

102: {
  f: String.raw`# What makes an acid or a base
An acid gives $\ce{H+}$ ions in water (really $\ce{H3O+}$)
A base gives $\ce{OH-}$ ions in water; a base that dissolves is called an alkali
Acids and bases show their nature only in water, because the ions are free only then
# Reactions to remember
Acid + metal: $\ce{Zn + 2HCl -> ZnCl2 + H2 ^}$
Acid + carbonate: $\ce{Na2CO3 + 2HCl -> 2NaCl + H2O + CO2 ^}$
Acid + hydrogencarbonate: $\ce{NaHCO3 + HCl -> NaCl + H2O + CO2 ^}$
Acid + metal oxide: $\ce{CuO + 2HCl -> CuCl2 + H2O}$
Base + non-metal oxide: $\ce{CO2 + 2NaOH -> Na2CO3 + H2O}$
Test for $\ce{CO2}$: $\ce{Ca(OH)2 + CO2 -> CaCO3 v + H2O}$ (lime water turns milky)
Neutralisation: acid + base $\rightarrow$ salt + water
# The pH scale
[fig:ph_scale]
pH below 7 = acidic · pH 7 = neutral · pH above 7 = basic
A change of one pH step means ten times as many $\ce{H+}$ ions
A strong acid gives many more $\ce{H+}$ ions than a weak acid of the same strength of solution
Always add acid to water slowly while stirring, never water to acid (the heat can throw the acid out)
# Chemicals from common salt
[fig:chlor_alkali]
Chlor-alkali: $\ce{2NaCl + 2H2O ->[electricity] 2NaOH + Cl2 + H2}$
Bleaching powder: $\ce{Ca(OH)2 + Cl2 -> CaOCl2 + H2O}$
Baking soda: $\ce{NaCl + H2O + CO2 + NH3 -> NH4Cl + NaHCO3}$
On heating baking soda: $\ce{2NaHCO3 ->[heat] Na2CO3 + H2O + CO2}$
Washing soda: $\ce{Na2CO3 * 10H2O}$
Plaster of Paris: $\ce{CaSO4 * 1/2 H2O}$
Setting of P.O.P.: $\ce{CaSO4 * 1/2 H2O + 3/2 H2O -> CaSO4 * 2H2O}$
# Where each one is used
| Chemical | Formula | Used for |
| Baking soda | $\ce{NaHCO3}$ | baking, antacid, fire extinguisher |
| Washing soda | $\ce{Na2CO3 * 10H2O}$ | cleaning, softening hard water |
| Bleaching powder | $\ce{CaOCl2}$ | bleaching cloth, cleaning drinking water |
| Plaster of Paris | $\ce{CaSO4 * 1/2 H2O}$ | plaster for a fracture, toys, ceilings |`,
  s: String.raw`Acids taste sour and turn blue litmus red; bases taste bitter, feel soapy and turn red litmus blue.
Indicators tell us acid from base: litmus, methyl orange, phenolphthalein, and smelling ones like onion and vanilla.
The hydrogen gas given off by an acid and a metal burns with a pop sound — that is the test for it.
Metal oxides are basic and non-metal oxides are acidic; $\ce{Al2O3}$ and $\ce{ZnO}$ are amphoteric and behave both ways.
pH decides a lot of everyday life: our body works near pH 7.4, and tooth decay starts when the mouth falls below pH 5.5.
>> Acid rain has a pH below 5.6. When it runs into a river, fish find it hard to survive.
A bee sting is acidic, so baking soda helps; a nettle sting is also acidic and dock leaves help.
Our stomach makes hydrochloric acid to digest food; too much of it is treated with an antacid such as milk of magnesia.
Salts can be neutral (NaCl), acidic ($\ce{NH4Cl}$) or basic ($\ce{Na2CO3}$), depending on the acid and base that made them.
Washing soda has ten water molecules joined to it — this water of crystallisation is why the crystals look dry but are not.
Plaster of Paris must be kept in a dry airtight tin, otherwise the damp air sets it into hard gypsum.`
},

103: {
  f: String.raw`# How metals and non-metals differ
| Property | Metals | Non-metals |
| Look | shiny (lustre) | dull (except iodine) |
| Beating | malleable, ductile | brittle |
| Heat and electricity | good conductors | poor (except graphite) |
| Oxide formed | basic | acidic |
| Electrons | lose them, form $+$ ions | gain them, form $-$ ions |
# Reactions of metals
Metal + oxygen: $\ce{4Na + O2 -> 2Na2O}$
Amphoteric oxides ($\ce{Al2O3}$, $\ce{ZnO}$) react with **both** acids and bases
Metal + water: $\ce{2Na + 2H2O -> 2NaOH + H2 + heat}$
Metal + steam: $\ce{3Fe + 4H2O ->[steam] Fe3O4 + 4H2}$
Metal + dilute acid: $\ce{Fe + 2HCl -> FeCl2 + H2 ^}$
Displacement: $\ce{Fe + CuSO4 -> FeSO4 + Cu}$
# The reactivity series
[fig:reactivity_series]
# Ionic compounds
Made by **giving and taking** electrons: $\ce{Na -> Na+ + e-}$, $\ce{Cl + e- -> Cl-}$
They are solid and hard, melt at high temperature, dissolve in water and conduct electricity when molten or dissolved
# Getting a metal out of its ore
[fig:metallurgy]
Roasting (sulphide ore, in air): $\ce{2ZnS + 3O2 ->[heat] 2ZnO + 2SO2}$
Calcination (carbonate ore): $\ce{ZnCO3 ->[heat] ZnO + CO2}$
Reduction with carbon: $\ce{ZnO + C -> Zn + CO}$
Thermite reaction: $\ce{Fe2O3 + 2Al -> 2Fe + Al2O3 + heat}$
Very reactive metals (K, Na, Ca, Mg, Al) are got by **electrolysis** of their molten salts
[fig:electrolytic_refining]
# Corrosion and alloys
Rusting needs **both** air and water
Stop it by: painting, oiling, greasing, galvanising (a zinc coat), chrome plating, anodising, making an alloy
| Alloy | Made of |
| Brass | copper + zinc |
| Bronze | copper + tin |
| Solder | lead + tin (low melting point) |
| Stainless steel | iron + nickel + chromium |
| Amalgam | any metal + mercury |`,
  s: String.raw`Sodium and potassium are so reactive that they are kept under kerosene, or they would catch fire in air.
Aluminium and zinc look unreactive because a thin oxide layer on the surface protects the metal underneath.
Metals above hydrogen in the reactivity series give out hydrogen with dilute acids; copper, silver and gold do not.
Nitric acid is the exception: it is a strong oxidising agent, so it usually gives nitrogen oxides instead of hydrogen.
>> Aqua regia (3 parts conc. HCl + 1 part conc. HNO₃) can dissolve even gold and platinum.
A more reactive metal always displaces a less reactive one from its salt solution — that is how the series is tested.
Ionic compounds conduct electricity only when molten or dissolved, because only then can the ions move.
Which method is used to get a metal depends on where it sits in the reactivity series: electrolysis at the top, carbon reduction in the middle, simple heating at the bottom.
Galvanising protects iron even if the zinc coat is scratched, because zinc is more reactive and is eaten away first.
Alloys are made to improve a metal: harder, less liable to rust, or with a lower melting point.`
},

104: {
  f: String.raw`# Why carbon makes so many compounds
Carbon has **4** valence electrons, so it shares them and forms 4 covalent bonds (tetravalency)
Catenation: carbon joins to carbon in long chains, branches and rings
Covalent compounds have low melting points and do not conduct electricity (no free ions)
[fig:carbon_structures]
# Saturated and unsaturated
Alkane (single bonds): $C_nH_{2n+2}$
Alkene (one double bond): $C_nH_{2n}$
Alkyne (one triple bond): $C_nH_{2n-2}$
A saturated compound burns with a clean blue flame; an unsaturated one gives a yellow sooty flame
# Homologous series
Each member differs from the next by $\ce{-CH2-}$, that is by **14 u**
Members have the same functional group and almost the same chemical properties
Melting point, boiling point and density rise step by step along the series
# Functional groups
| Group | Formula | Name ends with |
| Alcohol | $\ce{-OH}$ | -ol |
| Aldehyde | $\ce{-CHO}$ | -al |
| Ketone | $\ce{-CO-}$ | -one |
| Carboxylic acid | $\ce{-COOH}$ | -oic acid |
| Halo- | $\ce{-Cl}$, $\ce{-Br}$ | chloro-, bromo- |
# Chemical properties
Combustion: $\ce{CH4 + 2O2 -> CO2 + 2H2O + heat}$
Addition (hardening of oils): $\ce{CH2=CH2 + H2 ->[Ni] CH3CH3}$
Substitution: $\ce{CH4 + Cl2 ->[sunlight] CH3Cl + HCl}$
Oxidation: $\ce{CH3CH2OH ->[alkaline KMnO4] CH3COOH}$
# Ethanol and ethanoic acid
Ethanol with sodium: $\ce{2Na + 2C2H5OH -> 2CH3CH2ONa + H2 ^}$
Dehydration at 443 K: $\ce{C2H5OH ->[hot conc. H2SO4] CH2=CH2 + H2O}$
Esterification: $\ce{CH3COOH + C2H5OH ->[acid] CH3COOC2H5 + H2O}$
Ethanoic acid with carbonate: $\ce{2CH3COOH + Na2CO3 -> 2CH3COONa + H2O + CO2 ^}$
Only the acid, not ethanol, gives $\ce{CO2}$ with baking soda — that is how to tell them apart
# Soaps and detergents
[fig:soap_micelle]
Soap = the sodium salt of a long-chain fatty acid
Hard water has $\ce{Ca^2+}$ and $\ce{Mg^2+}$ ions, which turn soap into scum, so detergents are used instead`,
  s: String.raw`Carbon neither gives away four electrons nor takes four, so it shares them: every bond in an organic compound is covalent.
The same formula can be written in more than one way: $\ce{C4H10}$ is n-butane or iso-butane. These are isomers.
A functional group decides how a compound behaves, so the whole homologous series behaves alike.
To name a compound: count the carbons (meth, eth, prop, but, pent), then add the ending of the functional group.
>> Ethanol is the alcohol in drinks; methanol is poisonous and can cause blindness or death even in small amounts.
Ethanol used in industry is made unfit to drink by adding methanol and a dye — that is denatured spirit.
Ethanoic acid (5–8% in water) is vinegar; pure ethanoic acid freezes in winter and is called glacial acetic acid.
Esters smell sweet, so they are used in scents and flavours. Heated with NaOH an ester gives soap back — saponification.
A soap molecule has two ends: an ionic head that loves water and a long tail that loves oil. That is how it cleans.
Detergents work in hard water as well, but many of them break down slowly and pollute rivers.`
},

105: {
  f: String.raw`# Photosynthesis
Equation: $\ce{6CO2 + 6H2O ->[sunlight][chlorophyll] C6H12O6 + 6O2}$
Steps: chlorophyll takes in light $\rightarrow$ light energy becomes chemical energy and water splits $\rightarrow$ carbon dioxide is turned into carbohydrate
Raw materials: carbon dioxide (through stomata), water (from the soil), sunlight, chlorophyll
[fig:stomata]
# Nutrition in humans
[fig:digestive]
| Place | Juice | Works on |
| Mouth | saliva (amylase) | starch $\rightarrow$ sugar |
| Stomach | HCl, pepsin, mucus | protein |
| Small intestine | bile, pancreatic juice, intestinal juice | all three foods |
Bile does not digest; it makes the fat into small drops (emulsifies) so that lipase can act
Absorption happens through **villi**, tiny fingers that give the small intestine a huge surface
# Respiration
Aerobic (in the mitochondria): glucose $\rightarrow$ pyruvate $\rightarrow$ $\ce{CO2} + \ce{H2O}$ + **a lot** of energy
In yeast (anaerobic): glucose $\rightarrow$ ethanol + $\ce{CO2}$ + a little energy
In our muscles (anaerobic): glucose $\rightarrow$ lactic acid + a little energy — this is what causes cramp
[fig:respiratory]
# Transport in humans
[fig:heart]
Blood = plasma + red cells (haemoglobin) + white cells + platelets
Double circulation: the blood passes through the heart **twice** in one round of the body
Lymph carries digested fat and brings the extra fluid back to the blood
# Transport in plants
Xylem carries water and minerals **upwards**, pulled by transpiration
Phloem carries food **both ways** (translocation), using energy from ATP
# Excretion
[fig:nephron]
The filtering unit of the kidney is the **nephron**
Filtration happens in the glomerulus; useful things are taken back along the tubule
Plants get rid of waste by dropping leaves, and as gum, resin and latex`,
  s: String.raw`Life processes are the jobs a body must do even when it is resting: nutrition, respiration, transport and excretion.
Autotrophs make their own food; heterotrophs take it ready-made, as parasites, saprophytes or holozoic feeders.
Stomata open when the guard cells swell with water, and close when they lose it, which also saves water.
Our teeth and saliva begin digestion, but most of it finishes in the small intestine, which is the longest part of the canal.
>> The small intestine is long and folded, with villi, because a large surface is needed to absorb all the food.
Energy from food is stored in ATP, the energy currency of the cell.
Aerobic respiration gives far more energy than anaerobic, because the glucose is broken down completely.
Breathing is only the taking in and giving out of air; respiration is the chemical release of energy inside the cell.
Arteries carry blood away from the heart under pressure and have thick walls; veins carry it back and have valves.
The left ventricle has the thickest wall of all four chambers, because it pumps blood to the whole body.
>> Double circulation keeps oxygen-rich and oxygen-poor blood apart, which warm-blooded animals need for their high energy use.
A kidney makes urine; how much water goes out depends on how much the body has spare and on the waste to be removed.
If the kidneys fail, an artificial kidney (dialysis) does the filtering, but it cannot reabsorb like a real nephron.`
},

106: {
  f: String.raw`# The nerve cell
[fig:neuron]
The message runs: dendrite $\rightarrow$ cell body $\rightarrow$ axon $\rightarrow$ nerve ending
At the gap between two neurons (the **synapse**) the message crosses as a chemical, which is why it goes only one way
# Reflex action
[fig:reflex_arc]
A reflex is a quick, automatic answer; the spinal cord gives the order, so the brain is told only afterwards
# The brain
| Part | Looks after |
| Cerebrum | thinking, memory, decisions, the senses |
| Cerebellum | balance, posture, smooth movement |
| Medulla | breathing, heartbeat, blood pressure, vomiting |
The brain is protected by the skull and by fluid; the spinal cord by the backbone
# Hormones in animals
| Gland | Hormone | Job |
| Pituitary | growth hormone | growth of the body |
| Thyroid | thyroxine (needs iodine) | how fast food is used |
| Pancreas | insulin | keeps blood sugar in check |
| Adrenal | adrenaline | the fight-or-flight feeling |
| Testes | testosterone | changes in boys at puberty |
| Ovaries | oestrogen | changes in girls at puberty |
# Control in plants
Tropic movement (towards or away from something): phototropism (light), geotropism (gravity), hydrotropism (water), chemotropism (chemicals)
Nastic movement (no direction): the touch-me-not plant folding its leaves
| Hormone | What it does |
| Auxin | makes the shoot grow and bend towards light |
| Gibberellin | makes the stem grow |
| Cytokinin | makes cells divide |
| Abscisic acid | stops growth, makes leaves wilt and fall |`,
  s: String.raw`Control and coordination in animals is done by the nervous system and by hormones working together.
Receptors in the eye, ear, nose, tongue and skin pick up changes and pass them to the brain as electrical messages.
A reflex arc saves time: the spinal cord answers at once, so your hand leaves the hot plate before it hurts.
Nervous messages are fast but do not reach every cell; hormones are slower but reach the whole body through the blood.
>> Iodine is needed to make thyroxine, so iodised salt prevents goitre.
Too little insulin raises the blood sugar — this is diabetes, treated with insulin injections.
Adrenaline makes the heart beat faster and sends more blood to the muscles, which gets the body ready to act.
In plants there is no nervous system; growth itself is the movement, caused by hormones made in one part and moving to another.
Auxin gathers on the shady side of a shoot, so that side grows longer and the shoot bends towards the light.
A touch-me-not folds its leaves by changing the water in its cells, not by growing — that is why it is so quick.`
},

107: {
  f: String.raw`# Asexual reproduction (one parent)
| Way | Example |
| Binary fission | Amoeba, Leishmania |
| Multiple fission | Plasmodium |
| Fragmentation | Spirogyra |
| Regeneration | Planaria, Hydra |
| Budding | Hydra, yeast |
| Spore formation | Rhizopus (bread mould) |
| Vegetative propagation | potato eyes, sugarcane, rose cuttings, Bryophyllum leaf buds |
The new plant from vegetative propagation is exactly like the parent, and it flowers sooner
# Sexual reproduction in a flower
[fig:flower]
Stamen (male) = anther + filament · Carpel (female) = stigma + style + ovary
Pollination = pollen reaching the stigma; self-pollination (same flower) or cross-pollination (another flower, by wind, water or insects)
Fertilisation: the male cell travels down the style and joins the egg in the ovule
After fertilisation: ovary $\rightarrow$ fruit, ovule $\rightarrow$ seed, zygote $\rightarrow$ embryo
# In human beings
[fig:male_repro]
[fig:female_repro]
Puberty is when the body becomes able to reproduce, and it brings its own changes in boys and girls
The egg is released about every 28 days; if it is not fertilised the lining of the uterus is shed as a period
The **placenta** joins the embryo to the mother, bringing food and oxygen and taking away waste
# Keeping reproductive health
| Way | How it works |
| Condom | a barrier; also stops infections |
| Oral pills | change the hormones so no egg is released |
| Copper-T / loop | placed in the uterus |
| Surgery (vasectomy, tubectomy) | the tubes are blocked |
HIV/AIDS, gonorrhoea and syphilis spread through sexual contact; a condom is the one method that also prevents them
Finding out and choosing the sex of an unborn child is a crime in India`,
  s: String.raw`Reproduction is not needed to keep one body alive, but it is needed to keep the species alive.
DNA copying is never perfect, and those small changes are what make the members of a species a little different.
Asexual reproduction needs one parent and gives copies; sexual reproduction needs two and gives variety.
Variation is useful: if the surroundings change suddenly, some members with a useful difference will survive.
>> A banana has no seeds, so it is grown only by vegetative propagation.
In humans the sperm has to travel to the egg, so it is small and has a tail, while the egg carries food and stays still.
The embryo is fixed in the lining of the uterus and grows there for about nine months.
Puberty brings hair, voice and body changes, and in girls the start of the monthly cycle — all of them normal.
Family planning lets a couple choose when to have a child; the healthiest methods are the ones that also prevent infection.
A healthy reproductive life needs correct information, hygiene and respect, not secrecy.`
},

108: {
  f: String.raw`# Mendel's work
[fig:monohybrid]
Mendel used the garden pea because it grows fast and has clear pairs of traits
Dominant trait: the one that shows in $F_1$ · Recessive: the one that stays hidden
Genotype = the genes present (TT, Tt, tt) · Phenotype = what you can see (tall, dwarf)
Monohybrid $F_2$: **3 : 1** by looks, **1 : 2 : 1** by genes
Dihybrid $F_2$: **9 : 3 : 3 : 1**, which shows that two traits are passed on independently
# Sex determination in humans
[fig:sex_determination]
Human cells have **23 pairs** of chromosomes; one pair decides the sex
Mother: XX, so every egg carries X · Father: XY, so half the sperms carry X and half carry Y
X sperm $\rightarrow$ girl (XX) · Y sperm $\rightarrow$ boy (XY)
# Genes and traits
Genes sit on chromosomes; a child gets one set from each parent
A trait a person gains during life (a scar, learnt skill, dieting) is **not** passed on, because the germ cells do not change
Only a change in the germ cells (egg or sperm) reaches the next generation`,
  s: String.raw`Heredity is the passing of features from parents to their children through genes.
Mendel crossed tall and dwarf pea plants: the whole F₁ was tall, but a quarter of the F₂ came out dwarf again.
That hidden dwarf trait proves that a plant carries two copies of each gene, one from each parent.
A Punnett square is the quickest way to work out the F₂ ratio — write the gametes outside and fill the boxes.
>> A tall plant can be TT or Tt; a dwarf plant can only be tt, because the recessive trait shows only when both copies are recessive.
In a dihybrid cross the two traits sort out independently, which is why 9 : 3 : 3 : 1 comes out.
It is the father who decides the sex of the child, since the mother can give only an X chromosome.
Blaming a woman for the sex of her baby has no scientific basis at all.`
},

109: {
  f: String.raw`# Reflection by a mirror
Laws of reflection: $\angle i = \angle r$, and the incident ray, the normal and the reflected ray lie in one plane
Focal length: $f = \dfrac{R}{2}$
Mirror formula: $\dfrac{1}{v} + \dfrac{1}{u} = \dfrac{1}{f}$
Magnification: $m = \dfrac{h'}{h} = -\dfrac{v}{u}$
[fig:mirror_concave]
# Sign convention (New Cartesian)
Everything is measured from the pole; the incident light goes left to right
Distances along the light are $+$, against it are $-$; so $u$ is always $-$ for a real object
Heights above the axis are $+$, below are $-$
Concave mirror: $f$ is $-$ · Convex mirror: $f$ is $+$
A positive $m$ means an erect virtual image; a negative $m$ means an inverted real image
# Images in a concave mirror
| Object at | Image | Size |
| Infinity | at F, real, inverted | a point |
| Beyond C | between F and C, real, inverted | smaller |
| At C | at C, real, inverted | same size |
| Between C and F | beyond C, real, inverted | bigger |
| At F | at infinity, real, inverted | very big |
| Between P and F | behind the mirror, virtual, erect | bigger |
A convex mirror always gives a small, erect, virtual image, so it shows a wide view as a rear-view mirror
# Refraction
Light bends towards the normal going into a denser medium, and away from it coming out
Snell's law: $\dfrac{\sin i}{\sin r} = n_{21}$
Refractive index: $n = \dfrac{c}{v}$
[fig:refraction_slab]
# Lenses
Lens formula: $\dfrac{1}{v} - \dfrac{1}{u} = \dfrac{1}{f}$
Magnification: $m = \dfrac{h'}{h} = \dfrac{v}{u}$
Power: $P = \dfrac{1}{f \text{ (in metres)}}$, measured in dioptre (D)
Lenses touching each other: $P = P_1 + P_2 + \dots$
Convex lens: $f$ and $P$ are $+$ · Concave lens: $f$ and $P$ are $-$
[fig:lens_convex]`,
  s: String.raw`A real image can be caught on a screen and is always inverted; a virtual image cannot, and is always erect.
Put every number into the mirror or lens formula with its sign, and let the answer's sign tell you what kind of image it is.
In a concave mirror the image moves out as the object comes in — learn the table by picture, not by heart.
A concave mirror is used as a shaving mirror, by dentists, and in torches and headlights to send out a parallel beam.
A convex mirror is used as a rear-view mirror because it always gives a small erect image of a wide area.
>> If the answer for $v$ comes out positive for a mirror, the image is behind the mirror and therefore virtual.
Light slows down in a denser medium, and that change of speed is the real reason it bends.
The refractive index of water is 1.33 and of glass about 1.5, so glass bends light more than water does.
A rectangular glass slab shifts the ray sideways but does not turn it, since the two faces are parallel.
The power of a lens tells how strongly it bends light: a short focal length means a high power.
A convex lens can give a real image or a virtual one; a concave lens always gives a small, erect, virtual image.`
},

110: {
  f: String.raw`# The eye
[fig:eye]
The cornea does most of the bending; the lens only fine-tunes it
**Accommodation**: the ciliary muscles change the shape of the lens to focus near or far
Least distance of distinct vision = **25 cm** for a normal eye · far point = infinity
The iris controls how much light enters by changing the size of the pupil
# Defects of vision
[fig:myopia]
Myopia: the eyeball is too long or the lens too strong, so the image falls **in front of** the retina — corrected with a **concave** lens
[fig:hypermetropia]
Hypermetropia: the eyeball is too short or the lens too weak, so the image falls **behind** the retina — corrected with a **convex** lens
Presbyopia: with age the ciliary muscles weaken, so near vision goes — corrected with a bifocal lens
Power needed: $P = \dfrac{1}{f}$, where $f$ is in metres
# A prism and the colours
[fig:prism]
The light bends twice in a prism, and the angle between the incoming and the outgoing ray is the angle of deviation
Dispersion: the colours bend by different amounts, violet most and red least
A second prism placed the other way joins the colours back into white light
A rainbow is made of refraction, internal reflection and dispersion in water drops
# Scattering of light
The sky looks blue because the tiny air molecules scatter blue light much more than red
The sun looks red at sunrise and sunset because the light travels a long way through air and most of the blue is scattered away

// ---------- TEST RUNNER ----------
let runTimer = null;
// mode.practice: a student's own practice mock (saved in practice/, scored at once, solutions shown straight away)
function runTest(t, n, mode = {}) {
  const practice = !!mode.practice;
  const key = progKey(t.id, n);
  let st = lsGet(key);
  if (!st) {
    st = { tid: t.id, title: t.title, n, startedAt: now(), deadline: t.timer ? now() + t.timer * 60000 : null, responses: {}, review: [], visited: [], cur: 0 };
    if (practice) { st.practice = true; st.mock = { title: t.title, timer: t.timer || 0, chapters: mode.chapters || [], items: t.items }; }
    lsSet(key, st);
  }
  const items = t.items || [];
  const save = () => lsSet(key, st);
  S.view = 'runner';
  let submitting = false;

  function status(i) {
    const q = items[i].qid, r = st.responses[q];
    const answered = r && (r.o != null || (r.t && r.t.trim()));
    const rev = st.review.includes(q);
    if (rev) return answered ? 'revans' : 'rev';
    if (answered) return 'ans';
    if (st.visited.includes(q)) return 'skip';
    return '';
  }
  function counts() { const c = { ans: 0, skip: 0, rev: 0, nv: 0 }; items.forEach((_, i) => { const s = status(i); if (s === 'ans' || s === 'revans') c.ans++; if (s === 'rev' || s === 'revans') c.rev++; if (!s) c.nv++; if (s === 'skip' || s === 'rev') c.skip++; }); return c; }

  function render() {
    const i = st.cur, it = items[i];
    if (!st.visited.includes(it.qid)) { st.visited.push(it.qid); save(); }
    const r = st.responses[it.qid] || {};
    const order = it.type === 'MCQ' ? optOrder(it, S.sid, t.id) : null;
    $('#app').innerHTML = `<div class="runner"><div class="runhead">
      <button class="iconbtn" id="rx">${ICON.back}</button>
      <div class="grow" style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</div><div style="font-size:.75rem;opacity:.85">Question ${i + 1} of ${items.length}</div></div>
      ${st.deadline ? `<div class="timer" id="tm">--:--</div>` : ''}
      <button class="iconbtn" id="pal">${ICON.grid}</button></div>
      <div class="runbody">
        <div class="chips" style="margin-bottom:10px"><span class="chip">Section ${TYPE_SECTION[it.type] || ''}</span><span class="chip n">${TYPE_NAME[it.type]}</span><span class="chip n">${it.marks} mark${it.marks > 1 ? 's' : ''}</span>${st.review.includes(it.qid) ? '<span class="chip p">Marked for review</span>' : ''}</div>
        <div class="card">${questionHtml(it, { order, chosen: r.o })}
        ${it.type !== 'MCQ' ? `<label class="field" style="margin-top:12px"><span>Your final answer (a number or one line)</span>
          <input class="input" id="wa" maxlength="200" value="${esc(r.t || '')}" placeholder="${subjOf(it.chapter) === 'science' ? 'e.g. 12 Ω, or one line' : 'e.g. 2520 cm, or x = 2, y = 3'}"></label>
          <p class="tiny muted" style="margin:0">Write the full working on paper. You'll send a photo of it to your teacher after submitting.</p>` : ''}
        </div>
        ${it.type === 'MCQ' && r.o != null ? '<div class="center"><button class="btn ghost sm" id="clr">Clear my answer</button></div>' : ''}
      </div>
      <div class="runfoot"><div class="in">
        <div class="row"><button class="btn sec" id="prev" ${i === 0 ? 'disabled' : ''}>‹ Prev</button>
        <button class="btn sec" id="rev">${st.review.includes(it.qid) ? 'Unmark' : 'Mark for review'}</button>
        ${i < items.length - 1 ? `<button class="btn" id="next">Next ›</button>` : `<button class="btn green" id="sub">Submit</button>`}</div>
      </div></div></div>`;
    fillImages($('#app'));
    $$('[data-opt]').forEach(b => b.onclick = () => { st.responses[it.qid] = { o: Number(b.dataset.opt) }; save(); render(); });
    const wa = $('#wa'); if (wa) wa.oninput = () => { st.responses[it.qid] = { t: wa.value.slice(0, 200) }; save(); };
    if ($('#clr')) $('#clr').onclick = () => { delete st.responses[it.qid]; save(); render(); };
    $('#prev').onclick = () => { st.cur = Math.max(0, i - 1); save(); render(); };
    if ($('#next')) $('#next').onclick = () => { st.cur = i + 1; save(); render(); };
    if ($('#sub')) $('#sub').onclick = () => askSubmit();
    $('#rev').onclick = () => { const k = st.review.indexOf(it.qid); if (k >= 0) st.review.splice(k, 1); else st.review.push(it.qid); save(); render(); };
    $('#pal').onclick = openPalette;
    $('#rx').onclick = async () => { if (await confirmBox('Leave the test?', `Your answers stay saved on this phone and you can resume from the ${practice ? 'Home' : 'Tests'} page.` + (st.deadline ? ' The timer keeps running.' : ''), 'Leave')) { stopTimer(); S.view = 'tests'; sTestsView(); } };
    tick();
  }
  function openPalette() {
    const c = counts();
    modal(`<h3>All questions</h3>
      <div class="legend"><span><i style="background:var(--green)"></i>Answered ${c.ans}</span><span><i style="background:#fde3d6"></i>Not answered ${c.skip}</span><span><i style="background:var(--purple)"></i>For review ${c.rev}</span><span><i style="background:#eceef4"></i>Not seen ${c.nv}</span></div>
      <div class="palette">${items.map((it, k) => `<button class="pal ${status(k)} ${k === st.cur ? 'cur' : ''}" data-j="${k}">${k + 1}</button>`).join('')}</div>
      <div class="sp"></div><button class="btn green block" id="psub">Submit test</button>`,
      (m, close) => {
        $$('[data-j]', m).forEach(b => b.onclick = () => { st.cur = Number(b.dataset.j); save(); close(); render(); });
        $('#psub', m).onclick = () => { close(); askSubmit(); };
      });
  }
  async function askSubmit() {
    const c = counts();
    const ok = await confirmBox('Submit test?', `Answered: <b>${c.ans}</b> of ${items.length}${c.rev ? ` · Marked for review: <b>${c.rev}</b>` : ''}${items.length - c.ans ? `<br>Unanswered questions get 0.` : ''}<br>You can't change answers after submitting.`, 'Submit');
    if (ok) submit(false);
  }
  async function submit(auto) {
    if (submitting) return; submitting = true; stopTimer();
    $('#app').innerHTML = `<div class="runner"><div class="runbody center">${spinner()}<p>${auto ? "Time's up! " : ''}Submitting your answers…</p></div></div>`;
    if (practice) return submitPractice(auto);
    const aid = `${S.sid}_${t.id}_${n}`;
    const att = clean({
      sid: S.sid, uid: S.user.uid, tid: t.id, n, title: t.title, kind: t.kind || 'custom', grade: myGrade(),
      startedAt: st.startedAt, submittedAt: now(), timeTaken: Math.round((now() - st.startedAt) / 1000), autoSubmitted: !!auto,
      items: items.map(it => ({ qid: it.qid, type: it.type, marks: it.marks, chapter: it.chapter })),
      responses: Object.fromEntries(Object.entries(st.responses).filter(([, v]) => v.o != null || (v.t && v.t.trim())).map(([k, v]) => [k, v.o != null ? { o: v.o } : { t: v.t.trim() }])),
      review: st.review

      await setDoc(D('attempts/' + aid), att);
      lsDel(key); SC.attempts = undefined;
      toast('Submitted!');

    } catch (e) {
      // already submitted from another device or an earlier tap? then just show it
      const existing = await getD('attempts/' + aid).catch(() => null);
      if (existing) { lsDel(key); SC.attempts = undefined; return showResult(existing, t); }
      submitting = false; console.error(e);
      $('#app').innerHTML = `<div class="runner"><div class="runbody"><div class="card"><h3>Could not submit</h3><p class="muted">${esc(errMsg(e))}</p>
        <p class="small">Your answers are still saved on this phone. Check your internet and try again.</p><button class="btn block" id="retry">Try again</button></div></div></div>`;
      $('#retry').onclick = () => submit(auto);

  }
  async function submitPractice(auto) {
    const pid = `${S.sid}_${t.id}`;
    const g = myGrade();
    const chs = [...new Set(items.map(i => Number(i.chapter)))].sort((a, b) => a - b);
    try {
      const keyDocs = await Promise.all(chs.map(c => getD('poolKeys/' + poolId(g, c)).catch(() => null)));
      const keyItems = {}; keyDocs.forEach(d => d && Object.assign(keyItems, d.items || {}));
      const responses = Object.fromEntries(Object.entries(st.responses).filter(([, v]) => v.o != null).map(([k, v]) => [k, { o: v.o }]));
      const sc = practiceScore(items, responses, keyItems);
      const rec = clean({ sid: S.sid, uid: S.user.uid, mid: t.id, grade: g, title: t.title, chapters: chs, qids: items.map(i => i.qid), responses,
        score: sc.score, max: sc.max, correct: sc.correct, wrong: sc.wrong, blank: sc.blank, timer: t.timer || 0,
        startedAt: st.startedAt, submittedAt: now(), timeTaken: Math.round((now() - st.startedAt) / 1000), autoSubmitted: !!auto });
      await setDoc(D('practice/' + pid), rec);
      lsDel(key); SC.practice = undefined;
      toast('Submitted!');
      showPracticeResult({ id: pid, ...rec }, items, keyItems);
    } catch (e) {
      const existing = await getD('practice/' + pid).catch(() => null);
      if (existing) { lsDel(key); SC.practice = undefined; return showPracticeResult(existing); }
      submitting = false; console.error(e);
      const off = e && e.code === 'permission-denied';
      $('#app').innerHTML = `<div class="runner"><div class="runbody"><div class="card"><h3>Could not submit</h3>
        <p class="muted">${off ? 'Practice mocks may have been switched off by your teacher.' : esc(errMsg(e))}</p>
        <p class="small">Your answers are still saved on this phone. Check your internet and try again.</p><button class="btn block" id="retry">Try again</button>
        <div class="sp"></div><button class="btn ghost block" id="discard">Discard this practice mock</button></div></div></div>`;
      $('#retry').onclick = () => submit(auto);
      $('#discard').onclick = async () => { if (await confirmBox('Discard this practice mock?', 'Your answers on this phone will be deleted.', 'Discard', true)) { lsDel(key); S.view = 'tests'; sTestsView(); } };
    }
  }
  function tick() {
    stopTimer();
    if (!st.deadline) return;
    const upd = () => {
      const left = Math.round((st.deadline - now()) / 1000);
      const el = $('#tm'); if (el) { el.textContent = fmtDur(left); el.classList.toggle('low', left <= 300); }
      if (left <= 0) submit(true);
    };
    upd(); runTimer = setInterval(upd, 1000);
  }
  if (st.deadline && st.deadline <= now()) return submit(true);
  render();
}
function stopTimer() { if (runTimer) { clearInterval(runTimer); runTimer = null; } }

    <label class="field"><span>Your doubt (optional)</span><textarea class="input" id="aqt" maxlength="800" style="min-height:70px" placeholder="e.g. I don't understand how to find the common difference."></textarea></label>

      const qx = it ? (plainText(it.stem || [], 400) + opts).slice(0, 600) : '';
      try {
        await sendStudentMsg(doubt, { kind: 'qref', tid: ctx.tid, title: ctx.title, qid: ctx.qid, qn: ctx.qn, qx, aid: ctx.aid, src: ctx.src, last: `❓ Q${ctx.qn} · ${ctx.title}: ${doubt}` });
      } catch (e) { if (e && e.code === 'permission-denied') { close(); return toast(`Sending questions isn't switched on yet. Please tell ${teacherWord()}.`, 4000); } throw e; }
      close();
      toast(`Sent to ${teacherWord()} ✓ The reply will come in Chat.`, 3500);
      if (btn) { btn.outerHTML = `<div class="small" style="margin-top:10px;color:var(--green);font-weight:600">✓ Sent to ${esc(teacherWord())}. Check Chat for the reply.</div>`; }
    });

}
