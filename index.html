// ---------- PRACTICE MOCKS (made by the student; MCQs from the practice pool the teacher publishes) ----------
// pool/{gGGcCC}: questions without answers · poolKeys/{gGGcCC}: answers + solutions · practice/{sid}_{mid}: the student's result
function practiceScore(items, responses, keyItems) {
  const r = { score: 0, max: 0, correct: 0, wrong: 0, blank: 0 };
  items.forEach(it => {
    const m = Number(it.marks) || 1; r.max += m;
    const resp = responses[it.qid]; const k = keyItems[it.qid];
    if (!resp || resp.o == null) r.blank++;
    else if (k && resp.o === k.answer) { r.correct++; r.score += m; } else r.wrong++;
  });
  return r;
}
function resumeSaved(tid, n) {
  const v = lsGet(progKey(tid, n));
  if (v && v.practice && v.mock) return runTest({ id: tid, title: v.mock.title, kind: 'practice', timer: v.mock.timer, items: v.mock.items }, 1, { practice: true, chapters: v.mock.chapters });
  return openTestIntro(tid);
}
const PACES = [[0, 'No timer'], [1, '1 min per question'], [2, '2 min per question']];
async function sPracticeBuilder(preCh) {
  const g = myGrade();
  const pg = sShell('tests', 'Practice mock', spinner(), { back: () => sTestsView(), sub: `Class ${g} · make your own` });
  if (!practiceOn()) { pg.innerHTML = '<div class="card empty">Practice mocks are switched off at the moment.</div>'; return; }
  let pool;
  try { pool = await sPool(true); } catch (e) { pg.innerHTML = `<div class="card">${esc(errMsg(e))}</div>`; return; }
  if (preCh) setSubj(subjOf(preCh));
  const sj = curSubj();
  const anyPool = pool.some(p => (p.items || []).length);
  pool = pool.filter(p => (p.items || []).length && subjOf(p.chapter) === sj);
  if (!pool.length) { pg.innerHTML = `${anyPool ? subjBarHtml() : ''}<div class="card empty">Your teacher hasn't added${subjWord()} practice questions for Class ${g} yet.</div>`; bindSubjBar(pg, () => sPracticeBuilder()); return; }
  const past = await sPractice();
  const seenQ = new Set(past.flatMap(p => p.qids || []));
  const going = inProgressList().filter(v => v.practice);
  const sel = new Set(preCh && pool.some(p => p.chapter === preCh) ? [preCh] : []);
  let count = 10, pace = 1;
  const draw = () => {
    const avail = pool.filter(p => sel.has(p.chapter)).reduce((s, p) => s + p.items.length, 0);
    const n = Math.min(count, avail);
    const fresh = pool.filter(p => sel.has(p.chapter)).reduce((s, p) => s + p.items.filter(i => !seenQ.has(i.qid)).length, 0);
    pg.innerHTML = `${subjBarHtml()}${going.length ? going.map(v => `<div class="card row" style="cursor:pointer" data-resume="${esc(v.tid)}"><div class="grow"><b>${esc(v.title)}</b><div class="small muted">Practice mock in progress</div></div><span class="btn sm">Resume</span></div>`).join('') : ''}
      <div class="info small">🎯 Practice mocks are for you. They don't count in your results, and you see the answers and full solutions as soon as you submit.</div>
      <div class="card"><div class="row"><h3 class="grow">1. Choose chapters</h3><button class="btn ghost sm" id="pall">${sel.size === pool.length ? 'Clear' : 'All chapters'}</button></div>
        <p class="tiny muted" style="margin:0 0 6px">Pick one chapter, or several for a mixed mock.</p>
        ${pool.map(p => `<label class="li pchk" style="cursor:pointer"><input type="checkbox" data-pc="${p.chapter}" ${sel.has(p.chapter) ? 'checked' : ''}>
          <div class="grow"><div class="t">${chNo(p.chapter)}. ${esc(chName(g, p.chapter))}${partTag(g, p.chapter)}</div><div class="tiny muted">${p.items.length} question${p.items.length === 1 ? '' : 's'}</div></div></label>`).join('')}</div>
      <div class="card"><h3>2. How many questions?</h3><div class="chips">${[5, 10, 15, 20, 30, 50].map(k => `<button class="toggle ${count === k ? 'on' : ''}" data-cnt="${k}" ${avail && k > avail && k !== 5 ? 'disabled' : ''}>${k}</button>`).join('')}</div>
        <p class="tiny muted" style="margin:8px 0 0">${sel.size ? `${avail} question${avail === 1 ? '' : 's'} in the chosen chapter${sel.size > 1 ? 's' : ''}${fresh < avail ? ` · ${fresh} you haven't practised yet (these come first)` : ''}.` : 'Choose at least one chapter.'}</p></div>
      <div class="card"><h3>3. Timer</h3><div class="chips">${PACES.map(([k, l]) => `<button class="toggle ${pace === k ? 'on' : ''}" data-pace="${k}">${l}</button>`).join('')}</div></div>
      <button class="btn block" id="pgo" ${n ? '' : 'disabled'}>${n ? `Start: ${n} questions${pace ? ` · ${n * pace} min` : ''}` : 'Choose a chapter'}</button>`;
    $$('[data-resume]', pg).forEach(b => b.onclick = () => resumeSaved(b.dataset.resume, 1));
    bindSubjBar(pg, () => sPracticeBuilder());
    $$('[data-pc]', pg).forEach(cb => cb.onchange = () => { const c = Number(cb.dataset.pc); cb.checked ? sel.add(c) : sel.delete(c); draw(); });
    $('#pall').onclick = () => { if (sel.size === pool.length) sel.clear(); else pool.forEach(p => sel.add(p.chapter)); draw(); };
    $$('[data-cnt]', pg).forEach(b => b.onclick = () => { count = Number(b.dataset.cnt); draw(); });
    $$('[data-pace]', pg).forEach(b => b.onclick = () => { pace = Number(b.dataset.pace); draw(); });
    $('#pgo').onclick = () => {
      const chosen = pool.filter(p => sel.has(p.chapter));
      const seed = Math.floor(Math.random() * 1e9);
      // questions you haven't practised come first; spread evenly over the chosen chapters
      const lists = chosen.map((p, i) => [...shuffled(p.items.filter(x => !seenQ.has(x.qid)), seed + i), ...shuffled(p.items.filter(x => seenQ.has(x.qid)), seed + 99 + i)]);
      const picked = [];
      while (picked.length < n && lists.some(l => l.length)) for (const l of lists) { if (l.length && picked.length < n) picked.push(l.shift()); }
      picked.sort((a, b) => a.chapter - b.chapter);
      const chs = chosen.map(p => p.chapter);
      const sw = sj === 'science' ? 'Science ' : '';
      const title = chs.length === 1 ? `Practice · ${sw}Ch ${chNo(chs[0])} ${chName(g, chs[0])}` : chs.length === pool.length && pool.length > 2 ? `Practice · All ${sw}chapters` : `Practice · ${sw}Mixed (Ch ${chs.map(chNo).join(', ')})`;
      const mid = 'pm' + now().toString(36);
      runTest({ id: mid, title, kind: 'practice', timer: pace * picked.length, items: picked.map(x => ({ ...x, marks: Number(x.marks) || 1 })) }, 1, { practice: true, chapters: chs });
    };
  };
  draw();
}
async function loadPracticeQuestions(grade, chapters) {
  const itemById = {}, keyItems = {};
  await Promise.all((chapters || []).map(async c => {
    const [p, k] = await Promise.all([getD('pool/' + poolId(grade, c)).catch(() => null), getD('poolKeys/' + poolId(grade, c)).catch(() => null)]);
    ((p && p.items) || []).forEach(i => itemById[i.qid] = i);
    Object.assign(keyItems, (k && k.items) || {});
  }));
  return { itemById, keyItems };
}
// review of a practice mock: shared by the student (Tests tab) and the teacher (Practice mocks page)
function practiceReviewHtml(rec, itemById, keyItems, sid, askable) {
  const resp = rec.responses || {};
  return (rec.qids || []).map((qid, idx) => {
    const it = itemById[qid]; const k = keyItems[qid]; const r = resp[qid];
    if (!it) return `<div class="rq all"><div class="hd"><b>Q${idx + 1}</b></div><p class="muted small">This question is no longer in the practice questions.</p></div>`;
    let cls = 'all', badge;
    if (!r || r.o == null) { cls += ' blank'; badge = '<span class="chip n">Not answered</span>'; }
    else if (k && r.o === k.answer) badge = `<span class="chip g">Correct · +${Number(it.marks) || 1}</span>`;
    else { cls += ' wrong'; badge = '<span class="chip r">Wrong · 0</span>'; }
    const order = optOrder(it, sid, rec.mid);
    const sol = ((k && k.solution) || []).map(b => b.x ? { ...b, x: remapOptionLetters(b.x, order) } : b);
    return `<div class="rq ${cls}"><div class="hd"><b>Q${idx + 1}</b><span class="chip n">${chTag(it.chapter)}</span>${badge}</div>
      ${questionHtml(it, { order, chosen: r && r.o, reveal: !!k, answer: k && k.answer, locked: !k })}
      ${sol.length ? `<details class="sol" ${cls.includes('wrong') ? 'open' : ''}><summary>Show full solution ▾</summary><div class="solbody qtext">${renderBlocks(sol)}</div></details>` : ''}
      ${askable ? `<button class="btn ghost sm askq" data-askq="${esc(qid)}" data-qn="${idx + 1}">${ICON.chat} Ask ${esc(teacherWord())} about Q${idx + 1}</button>` : ''}</div>`;
  }).join('');
}

// deleting messages, shared by the student Chat and the teacher's Messages
async function removeMessages(sid, ids, admin) {
  if (!ids.length) return;
  await deleteDocs(ids.map(id => `chats/${sid}/messages/${id}`), admin ? 15 : 5);
  const s = await threadSummary(sid);
  const upd = { lastAt: s.lastAt, lastText: s.lastText, lastFrom: s.lastFrom, sAt: s.sAt };
  try {
    if (!admin) await updateDoc(D('chats/' + sid), upd);
    else if (s.any) await updateDoc(D('chats/' + sid), { ...upd, aAt: s.aAt });
    else await deleteDoc(D('chats/' + sid));
  } catch (e) { console.warn('thread', e && e.code); }
}
// "choose messages" mode: tap bubbles, then Delete. ctx: {sid, admin, can(m), set(pick|null), done(deletedMsgs)}
function startPick(ctx) {
  const sel = new Set(); const pick = { sel, can: ctx.can };
  const box = $('#msgs'); const bar = document.createElement('div'); bar.className = 'pickbar';
  const draw = () => {
    bar.innerHTML = `<div class="in"><button class="btn sec" id="pkx">Cancel</button><span class="grow small center">${sel.size ? `${sel.size} chosen` : 'Tap the messages to delete'}</span><button class="btn danger" id="pkgo" ${sel.size ? '' : 'disabled'}>Delete${sel.size ? ` (${sel.size})` : ''}</button></div>`;
    $('#pkx', bar).onclick = stop; $('#pkgo', bar).onclick = go;
  };
  const onTap = e => { const b = e.target.closest('.bubble'); if (!b) return; e.preventDefault(); e.stopPropagation(); if (!b.classList.contains('pickable')) return; const id = b.dataset.mid; sel.has(id) ? sel.delete(id) : sel.add(id); b.classList.toggle('picked', sel.has(id)); draw(); };
  function stop() { box.removeEventListener('click', onTap, true); bar.remove(); ctx.set(null); }
  async function go() {
    const n = sel.size;
    if (!(await confirmBox(`Delete ${n} message${n === 1 ? '' : 's'}?`, "Deleted messages are removed for both of you and can't be brought back.", 'Delete', true))) return;
    await busy($('#pkgo', bar), async () => {
      const gone = (ctx.msgs ? ctx.msgs() : []).filter(m => sel.has(m.id));
      try { await removeMessages(ctx.sid, [...sel], ctx.admin); toast(`${n} message${n === 1 ? '' : 's'} deleted`); if (ctx.done) ctx.done(gone); }
      catch (e) { if (e && e.code === 'permission-denied' && !ctx.admin) toast(`Deleting is switched off. Ask ${teacherWord()}.`, 4000); else throw e; }
    });
    stop();
  }
  box.addEventListener('click', onTap, true);
  $('#app').appendChild(bar); draw(); ctx.set(pick);
}

// ---------- REVISE (formulas, summary, notes, confidence) ----------
async function sRevise() {
  const g = myGrade(), sj = curSubj();
  const pg = sShell('rev', 'Revise', spinner(), { sub: `Class ${g}${subjWord()} · ${sj === 'science' ? 'notes, summaries, videos' : 'formulas, summaries, notes'}` });
  try {
    const [rev, res, conf] = await Promise.all([sRev(), sRes(), sConf()]);
    const used = [...Object.keys(rev).map(Number), ...res.map(r => Number(r.chapter))].filter(n => subjOf(n) === sj);
    const nums = chaptersOf(g, sj).length ? chapterNums(g, used, sj) : [...new Set(used)].sort((a, b) => a - b);
    if (!nums.length) { pg.innerHTML = `${subjBarHtml()}<div class="card empty">Your teacher hasn't added${subjWord()} revision notes for Class ${g} yet.</div>`; bindSubjBar(pg, () => sRevise()); return; }
    const rated = nums.map(n => conf[confKey(g, n)]).filter(Boolean);
    const avg = rated.length ? rated.reduce((a, c) => a + c.s, 0) / rated.length : 0;
    const files = sFiles(res), vids = sVideos(res);
    const rowHtml = n => {
      const r = rev[n]; const nr = files.filter(x => Number(x.chapter) === n).length; const nv = vids.filter(x => Number(x.chapter) === n).length; const c = conf[confKey(g, n)];
      const nd = r ? [...(r.formulas || []), ...(r.summary || [])].filter(b => b.t === 'fig').length : 0;
      const info = [r && (r.formulas || []).length ? (sj === 'science' ? 'Key points' : 'Formulas') : '', r && (r.summary || []).length ? 'Summary' : '',
        nd ? `${nd} diagram${nd > 1 ? 's' : ''}` : '', nr ? `${nr} file${nr > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');
      return `<div class="li" data-ch="${n}"><div class="grow"><div class="t">${chNo(n)}. ${esc(chName(g, n))}</div><div class="small muted">${info || (nv ? 'Video' : 'Nothing added yet')}</div></div>
        ${nv ? `<button class="vbtn" data-vch="${n}" aria-label="Watch the video for chapter ${chNo(n)}">${ICON.play}<span>Video</span></button>` : ''}
        <div class="right">${c ? starsHtml(c.s, 'sm') : '<span class="tiny muted">Not rated</span>'}</div><span class="muted">›</span></div>`;
    };
    // Science chapters are grouped under Physics, Chemistry and Biology
    const groups = sj === 'science' ? [...PARTS.map(([k, l]) => [k, l, nums.filter(n => partOf(g, n) === k)]), ['', 'More chapters', nums.filter(n => !partOf(g, n))]].filter(x => x[2].length) : [['', '', nums]];
    pg.innerHTML = `${subjBarHtml()}<div class="card row"><div class="grow"><b>Your confidence</b><div class="small muted">${rated.length ? `${rated.length} of ${nums.length} chapters rated · average ${avg.toFixed(1)} ★` : 'Open a chapter and tap the stars to show how confident you feel.'}</div></div>${rated.length ? starsHtml(avg) : ''}</div>
      <div class="card" style="padding:4px 14px">${groups.map(([k, l, list]) => `${l ? `<div class="parthead ${k}"><i></i>${l}</div>` : ''}${list.map(rowHtml).join('')}`).join('')}</div>`;
    bindSubjBar(pg, () => sRevise());
    $$('[data-ch]', pg).forEach(el => el.onclick = () => sChapter(Number(el.dataset.ch)));
    $$('[data-vch]', pg).forEach(b => b.onclick = e => { e.stopPropagation(); sChapter(Number(b.dataset.vch), 'v'); });
  } catch (e) { pg.innerHTML = `<div class="card">${esc(errMsg(e))}</div>`; }
}
async function sChapter(n, tab, back) {

  try {
    const [rev, res, conf, tests, pool] = await Promise.all([sRev(), sRes(), sConf(), sTests().catch(() => []), practiceOn() ? sPool().catch(() => []) : []]);
    const r = rev[n] || {};
    const files = sFiles(res).filter(x => Number(x.chapter) === n).sort((a, b) => resTypeOrder(a.type) - resTypeOrder(b.type) || (a.order || 0) - (b.order || 0) || String(a.title).localeCompare(b.title));
    const vids = sVideos(res).filter(x => Number(x.chapter) === n);

function resTypeOrder(t) { const i = RES_TYPES.indexOf(t); return i < 0 ? 10 : i; }

    const mine = list.filter(r => Number(r.chapter) === ch);
    const types = [...new Set([...RES_TYPES, ...mine.map(r => r.type)])].sort((a, b) => resTypeOrder(a) - resTypeOrder(b) || a.localeCompare(b));

      <div class="grow"><div class="t">${chNo(ch)}. ${esc(chName(g, ch))}${partTag(g, ch)}</div><div class="small muted">${mine.length} item${mine.length === 1 ? '' : 's'}</div></div><span class="muted">▾</span></button>

        const rs = mine.filter(r => r.type === tp).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.title).localeCompare(b.title));

          ${rs.length ? `<div class="row wrap">${rs.map(r => admin
            ? `<span class="chip" style="padding:6px 10px">${esc(r.title)} <button class="btn ghost sm" data-edit-res="${esc(r.id)}" style="min-height:0;padding:0 4px">Edit</button></span>`

      }).join('')}</div></div>`;

// Admin saves are split into small batches so each stays inside Firestore's rules lookup limit.
async function commitOps(ops, size = 15) {
  for (let i = 0; i < ops.length; i += size) {
    const b = writeBatch(db);
    ops.slice(i, i + size).forEach(([k, p, d]) => k === 'delete' ? b.delete(D(p)) : k === 'update' ? b.update(D(p), d) : b.set(D(p), d));
    await b.commit();
  }
}

// One-time update: classes on every record, and answers split from solutions so solutions can stay locked.
async function migrateV2() {
  const close = modal(`<h3>Updating your app…</h3><p class="muted" id="mpr">One-time update for Classes 6–12 and locked solutions.</p>${spinner()}<p class="tiny muted">Keep this page open. It takes about a minute.</p>`);
  const say = t => { const el = $('#mpr'); if (el) el.textContent = t; };
  try {
    const ops = [];
    if (!(await getD('config/grades'))) ops.push(['set', 'config/grades', { chapters: { 10: CH10 }, updatedAt: now() }]);
    (await listC('questions')).filter(q => q.grade == null).forEach(q => ops.push(['update', 'questions/' + q.id, { grade: 10 }]));
    (await listC('students')).forEach(s => {
      const g = gradeOf(s);
      if (s.grade == null) ops.push(['update', 'students/' + s.id, { grade: g }]);
      if (s.uid) ops.push(['set', 'users/' + s.uid, { role: 'student', sid: s.id, grade: g }]);
    });
    (await listC('resources')).filter(r => r.grade == null).forEach(r => ops.push(['update', 'resources/' + r.id, { grade: 10 }]));
    say('Adding classes to questions, students and resources…');
    await commitOps(ops);
    AC.q = undefined; await aQ(true);
    say('Locking solutions in every test…');
    const tests = await listC('tests');
    await saveTests(tests.map(t => ({ ...t, grade: t.grade ?? 10, solutionsOpen: t.solutionsOpen === true })));
    await setDoc(D('config/settings'), { ...S.settings, schema: 2, updatedAt: now() });
    S.settings.schema = 2; await loadGrades();
    close(); toast('Update complete ✓');
  } catch (e) { close(); throw e; }
}

function resetStudentPassword(s) {

    <label class="field"><span>New password (min 6)</span><input class="input" id="npw"></label><div id="rerr"></div>

      // so we create a fresh login for the same student ID and retire the old one.

      ops.push(['set', 'users/' + uid, { role: 'student', sid: s.id, grade: studentGrade(s) }], ['update', 'students/' + s.id, { uid, updatedAt: now() }], ['set', 'logins/' + s.id, { email }]);
      await commitOps(ops);
      AC.students = undefined; close();
      modal(`<h3>Password reset ✓</h3><div class="card flat" style="background:var(--sblue)">ID: <b>${esc(s.id)}</b><br>New password: <b>${esc(pw)}</b></div><button class="btn block" data-c>Done</button>`, (m2, c2) => m2.querySelector('[data-c]').onclick = c2);

async function deleteStudent(s) {
  if (!(await confirmBox(`Delete ${s.name}?`, 'They will no longer be able to sign in. Their past results stay in your exports and backups.', 'Delete', true))) return;
  await busy(null, async () => {
    const inbox = await listC(`students/${s.id}/inbox`).catch(() => []);
    const msgs = await listC(`chats/${s.id}/messages`).catch(() => []);
    const rems = await listC(`students/${s.id}/reminders`).catch(() => []);
    const lcs = await listC(`students/${s.id}/liveClasses`).catch(() => []);
    const ops = [['delete', 'students/' + s.id], ['delete', 'logins/' + s.id], ['delete', `students/${s.id}/private/seen`], ['delete', 'chats/' + s.id], ['delete', 'confidence/' + s.id], ['delete', 'photos/' + s.id]];
    msgs.forEach(m => ops.push(['delete', `chats/${s.id}/messages/${m.id}`]));
    rems.forEach(r => ops.push(['delete', `students/${s.id}/reminders/${r.id}`]));
    lcs.forEach(r => ops.push(['delete', `students/${s.id}/liveClasses/${r.id}`]));
    if (s.uid) ops.push(['delete', 'users/' + s.uid]);
    inbox.forEach(x => ops.push(['delete', `students/${s.id}/inbox/${x.id}`]));

}

const CONF_BG = ['', '#fde6e6', '#fdeedd', '#fdf3d8', '#e9f6e2', '#d8f1e4'];
function confChapters(g, cs, confAll, subj = 'maths') {
  const used = new Set(); cs.forEach(s => Object.keys(confAll[s.id] || {}).forEach(k => { const [gg, c] = k.split('_'); if (Number(gg) === g && subjOf(c) === subj) used.add(Number(c)); }));
  return chapterNums(g, [...used], subj).filter(c => used.has(c) || chNo(c) <= chaptersOf(g, subj).length);
}
const sjFile = subj => subj === 'science' ? '-science' : '';
function exportConfidence(studs, confAll, g, subj = 'maths') {
  const cs = studs.filter(s => studentGrade(s) === g && hasSubj(s, subj));
  const chs = confChapters(g, cs, confAll, subj);
  const rows = [['Student ID', 'Name', ...chs.map(c => `Ch ${chNo(c)} ${chName(g, c)} (stars)`), 'Average']];
  cs.forEach(s => { const r = confAll[s.id] || {}; const v = chs.map(c => (r[confKey(g, c)] || {}).s || '');
    const got = v.filter(x => x !== ''); rows.push([s.id, s.name, ...v, got.length ? (got.reduce((a, b) => a + b, 0) / got.length).toFixed(1) : '']); });
  download(`confidence-class${g}${sjFile(subj)}-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Confidence exported');
}
function chapterWise(atts, keys) {
  const out = {};
  atts.forEach(a => { const r = scoreAttempt(a, keys[a.tid]); for (const [c, v] of Object.entries(r.perCh)) { out[c] = out[c] || { got: 0, max: 0 }; out[c].got += v.got; out[c].max += v.max; } });
  return out;
}
function stamp() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

// tests/{id}: questions without answers · testKeys/{id}: MCQ answers only (opens after submitting) · testSolutions/{id}: locked until the teacher opens it
function buildTestDocs(t, qmap) {
  const tm = { ...TYPE_MARKS, ...(t.typeMarks || {}) };
  const qids = t.qids.filter(id => qmap[id]);
  const items = qids.map(id => { const q = qmap[id]; return { qid: id, chapter: q.chapter, type: q.type, marks: Number(tm[q.type] ?? q.marks), stem: q.stem || [], options: q.options || null, parts: q.parts || null, fixed: q.fixed === true ? true : undefined }; });
  const key = {}, sol = {};
  qids.forEach(id => { const q = qmap[id]; key[id] = { answer: q.type === 'MCQ' ? (q.answer ?? null) : null }; sol[id] = { solution: q.solution || [], finalAnswer: q.finalAnswer || '' }; });
  return {
    test: clean({ title: t.title, kind: t.kind || 'custom', chapter: t.chapter ?? null, grade: Number(t.grade) || 10, subject: t.subject || (items[0] ? subjOf(items[0].chapter) : tSubj(t)), timer: Number(t.timer) || 0, order: t.order ?? 500, typeMarks: tm,
      qids, items, count: items.length, totalMarks: items.reduce((s, i) => s + i.marks, 0), published: t.published !== false, solutionsOpen: t.solutionsOpen === true, updatedAt: now() }),
    key: clean({ items: key, updatedAt: now() }),
    sol: clean({ items: sol, updatedAt: now() })
  };
}
async function saveTests(list) {     // list of test definitions with ids

        <select class="input" id="fc" ${f.g === 'all' ? 'disabled' : ''}><option value="">All chapters</option>${chs.map(c => `<option value="${c}" ${String(f.ch) === String(c) ? 'selected' : ''}>${chNo(c)}. ${esc(chName(f.g, c))}</option>`).join('')}</select>

          .sort((a, b) => gradeOf(a) - gradeOf(b) || a.chapter - b.chapter || (a.num || 0) - (b.num || 0));

          <div class="tiny muted">Class ${gradeOf(q)} · Ch ${chNo(q.chapter)} · Q${q.num || '–'} · ${q.marks} mark${q.marks > 1 ? 's' : ''} · ${esc(q.difficulty || '')}</div><div class="clip">${esc(plainText(q.stem, 160))}</div></div></div>`).join('')

          : `<div class="empty">${sj === 'science' && !inG.length ? 'No Science questions here yet. Tap “+ Add”, or “Bulk add from Excel” (write Science in the Subject column).' : all.length ? 'No questions match.' : 'The bank is empty. Tap “Import bank file” and choose question-bank.json, or “Bulk add from Excel”.'}</div>`;

      $('#imp').onchange = e => { const file = e.target.files[0]; if (file) importBank(file); };
      $('#bulk').onclick = () => bulkImport();

async function importBank(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('That file could not be read.'); }
  if (!data || data.format !== 'maths-by-ssk-question-bank') return toast('This is not a question bank file.');
  // a file may give Science questions as subject: 'science' with the plain chapter number (11) or the code (111)
  const fixCh = x => { const s = x.subject === 'science' || Number(x.chapter) > SCI ? 'science' : 'maths';
    return clean({ ...x, subject: s, chapter: s === 'science' && Number(x.chapter) <= 40 ? chCode('science', x.chapter) : Number(x.chapter) }); };
  data.questions = (data.questions || []).map(fixCh);
  data.tests = (data.tests || []).map(t => t.chapter == null ? { ...t, subject: t.subject || 'maths' } : fixCh(t));
  const existing = await aQ();
  const clash = data.questions.filter(q => existing[q.id]).length;
  if (!(await confirmBox('Import question bank?', `${data.questions.length} questions, ${Object.keys(data.images || {}).length} figures and ${(data.tests || []).length} tests.${clash ? `<br><b>${clash} questions with the same IDs will be replaced</b> by the file's version.` : ''}`, 'Import'))) return;
  const close = modal(`<h3>Importing…</h3><p class="muted" id="ipr">Starting</p>${spinner()}<p class="tiny muted">Keep this page open.</p>`);
  const say = t => { const el = $('#ipr'); if (el) el.textContent = t; };
  try {
    const imgs = Object.entries(data.images || {});
    for (let i = 0; i < imgs.length; i += 6) {
      await commitOps(imgs.slice(i, i + 6).map(([id, src]) => ['set', 'images/' + id, { data: src }]));
      say(`Figures ${Math.min(i + 6, imgs.length)}/${imgs.length}`);
    }
    for (let i = 0; i < data.questions.length; i += 15) {
      await commitOps(data.questions.slice(i, i + 15).map(q => { const { id, ...rest } = q; return ['set', 'questions/' + id, clean({ ...rest, grade: Number(rest.grade) || 10, updatedAt: now() })]; }));
      say(`Questions ${Math.min(i + 15, data.questions.length)}/${data.questions.length}`);
    }
    AC.q = undefined; await aQ(true);
    say('Tests…');
    await saveTests((data.tests || []).map(t => ({ ...t, grade: Number(t.grade) || 10, published: true, solutionsOpen: false })));
    if (S.settings.practiceOn) { say('Practice questions…'); await syncPool(data.questions.map(q => Number(q.grade) || 10)); }
    close();
    modal(`<h3>Import complete ✓</h3><p>${data.questions.length} questions and ${(data.tests || []).length} tests are ready. Students can see the tests now; solutions stay locked until you open them.</p><p class="small muted">Keep the file safe on your computer. Don't upload it to your website: it contains the answers.</p><button class="btn block" data-c>OK</button>`, (m, c) => m.querySelector('[data-c]').onclick = () => { c(); aQuestionsView(); });
  } catch (e) { close(); console.error(e); toast('Import stopped: ' + errMsg(e), 6000); }
}

const XLSX_URLS = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function getXLSX() {
  for (const u of XLSX_URLS) { if (window.XLSX) break; try { await loadScript(u); } catch { } }
  if (!window.XLSX) throw new Error('Could not load the Excel reader. Check your internet and try again.');
  return window.XLSX;
}
const BULK_COLS = ['Class', 'Subject', 'Chapter', 'Type', 'Marks', 'Difficulty', 'Question', 'Option A', 'Option B', 'Option C', 'Option D', 'Correct option', 'Part 1', 'Part 2', 'Part 3', 'Part 4', 'Part marks', 'Solution', 'Final answer'];

function normType(v) {
  const s = String(v || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (['mcq', 'objective', 'multiplechoice', '1', '1mark'].includes(s)) return 'MCQ';
  if (['vsa', 'veryshort', 'veryshortanswer', 'sa1', 'shortanswer1', '2', '2marks', '2mark'].includes(s)) return 'VSA';
  if (['sa', 'short', 'shortanswer', 'sa2', 'shortanswer2', '3', '3marks', '3mark'].includes(s)) return 'SA';
  if (['la', 'long', 'longanswer', '5', '5marks', '5mark'].includes(s)) return 'LA';
  if (['case', 'casebased', 'casestudy', 'cs', '4', '4marks', '4mark'].includes(s)) return 'CASE';
  return null;
}
function parseBulkRows(table, qmap, dateCells = {}) {
  const head = (table[0] || []).map(h => String(h).trim().toLowerCase().replace(/\s+/g, ' '));
  const col = name => { const n = name.toLowerCase(); const alias = { class: ['class', 'grade'], 'correct option': ['correct option', 'correct', 'answer', 'key'] }[n] || [n]; return head.findIndex(h => alias.includes(h)); };
  const idx = Object.fromEntries(BULK_COLS.map(c => [c, col(c)]));
  const missing = ['Class', 'Chapter', 'Type', 'Question'].filter(c => idx[c] < 0);
  if (missing.length) return { fatal: `The first row must be the header row. Missing column${missing.length > 1 ? 's' : ''}: ${missing.join(', ')}. Download the template and copy your questions into it.` };
  const get = (r, c) => idx[c] < 0 ? '' : String(r[idx[c]] ?? '').replace(/\r/g, '').trim();
  const ok = [], bad = [], dup = [];
  const nextNum = {};
  Object.values(qmap).forEach(q => { const k = gradeOf(q) + '_' + q.chapter; nextNum[k] = Math.max(nextNum[k] || 0, q.num || 0); });
  // same class + chapter + type + question text = already in the bank (so a corrected file can be uploaded again)
  const sig = (g, ch, type, blocks) => [g, ch, type, blocksToText(blocks).toLowerCase().replace(/\s+/g, ' ').trim()].join('|');
  const seen = new Set(Object.values(qmap).map(q => sig(gradeOf(q), Number(q.chapter), q.type, q.stem)));
  table.slice(1).forEach((r, i) => {
    const rowNo = i + 2;
    if (!r || r.every(c => String(c ?? '').trim() === '')) return;
    const probs = [];
    if (dateCells[i + 1]) probs.push(`Excel changed ${dateCells[i + 1].join(', ')} into a date. Type it again with an apostrophe first, e.g. '3/4`);
    const g = Number(get(r, 'Class').replace(/[^0-9]/g, ''));
    if (!GRADES.includes(g)) probs.push('Class must be 6 to 12');
    const sRaw = get(r, 'Subject').toLowerCase();
    const subj = !sRaw || sRaw.startsWith('m') ? 'maths' : /^(s|p|c|b)/.test(sRaw) ? 'science' : null;
    if (!subj) probs.push('Subject must be Maths or Science');
    const chN = Number(get(r, 'Chapter').replace(/[^0-9]/g, ''));
    if (!(chN >= 1 && chN <= 40)) probs.push('Chapter must be a number');
    const ch = chCode(subj || 'maths', chN);
    const type = normType(get(r, 'Type'));
    if (!type) probs.push('Type must be MCQ, VSA, SA, LA or CASE');
    const qtext = get(r, 'Question');
    if (!qtext) probs.push('Question is empty');
    const marks = get(r, 'Marks') ? Number(get(r, 'Marks')) : (type ? TYPE_MARKS[type] : 1);
    if (!(marks > 0)) probs.push('Marks must be a number');
    const dRaw = get(r, 'Difficulty').toLowerCase();
    const difficulty = dRaw.startsWith('e') ? 'Easy' : dRaw.startsWith('m') ? 'Medium' : dRaw.startsWith('h') ? 'Hard' : '';
    let options = null, answer = null, parts = null;
    if (type === 'MCQ') {
      options = ['Option A', 'Option B', 'Option C', 'Option D'].map(c => get(r, c));
      if (options.some(o => !o)) probs.push('MCQ needs all four options');
      const a = get(r, 'Correct option').toLowerCase().replace(/[()\s.]/g, '').replace(/^option/, '');
      answer = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[a];
      if (answer == null) { probs.push('Correct option must be a, b, c or d'); answer = null; }
    }
    if (type === 'CASE') {
      const ps = ['Part 1', 'Part 2', 'Part 3', 'Part 4'].map(c => get(r, c)).filter(Boolean);
      if (!ps.length) probs.push('Case-based question needs at least Part 1');
      const pm = get(r, 'Part marks').split(/[,;/ ]+/).filter(Boolean).map(Number);
      const defaults = ps.length === 3 ? [1, 1, 2] : ps.map(() => Math.max(1, Math.round(marks / Math.max(1, ps.length))));
      parts = ps.map((x, k) => ({ label: ['i', 'ii', 'iii', 'iv'][k], x, marks: pm[k] > 0 ? pm[k] : defaults[k] }));
    }
    const solution = textToBlocks(get(r, 'Solution'));
    const fin = get(r, 'Final answer');
    if (fin && !solution.some(b => b.t === 'ans')) solution.push({ t: 'ans', x: fin });
    if (probs.length) { bad.push({ rowNo, probs, preview: qtext.slice(0, 70) }); return; }
    const sg = sig(g, ch, type, textToBlocks(qtext));
    if (seen.has(sg)) { dup.push(rowNo); return; }
    seen.add(sg);
    const k = g + '_' + ch; nextNum[k] = (nextNum[k] || 0) + 1;
    const num = nextNum[k];
    const id = `g${pad(g)}c${pad(ch)}q${pad(num)}`;
    ok.push({ id, grade: g, chapter: ch, subject: subj, num, type, marks, difficulty, stem: textToBlocks(qtext), options, answer: type === 'MCQ' ? answer : null, parts,
      solution, finalAnswer: type === 'MCQ' ? '' : solution.filter(b => b.t === 'ans').map(b => b.x).join(' · '), source: 'excel',
      fixed: type === 'MCQ' && looksFixed({ stem: textToBlocks(qtext), options }) ? true : undefined });
  });
  return { ok, bad, dup };
}
function bulkImport() {
  modal(`<h3>Bulk add questions from Excel</h3>
    <ol class="small" style="padding-left:18px;margin:6px 0 12px;color:var(--ink2)"><li>Download the template and fill one question per row (Class, Subject, Chapter, Type, Question, options, answer, solution).</li>
    <li>Save it, then choose the file below. The app checks every row before adding anything.</li></ol>
    <div class="row wrap"><button class="btn sec" id="tpl">⬇ Download Excel template</button><label class="btn" style="cursor:pointer">⬆ Choose filled file<input type="file" id="bf" accept=".xlsx,.xls,.csv" hidden></label></div>
    <div id="bres" style="margin-top:14px"></div><div class="sp"></div><button class="btn ghost block" data-c>Close</button>`, (m, close) => {
    m.querySelector('[data-c]').onclick = close;
    $('#tpl', m).onclick = () => busy($('#tpl', m), downloadTemplate);
    $('#bf', m).onchange = e => busy(null, async () => {
      const file = e.target.files[0]; if (!file) return;
      e.target.value = '';                                   // lets the same file be chosen again after fixing it
      const X = await getXLSX();
      const isCsv = /\.csv$/i.test(file.name);
      const wb = X.read(await file.arrayBuffer(), { type: 'array', raw: isCsv, cellNF: true, codepage: 65001 });
      const ws = wb.Sheets['Questions'] || wb.Sheets[wb.SheetNames[0]];
      const table = X.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });
      // cells Excel silently turned into dates (e.g. 3/4 -> 4-Mar), outside the Class/Chapter/Marks columns
      const dateCells = {};
      if (!isCsv && ws['!ref']) {
        const rg = X.utils.decode_range(ws['!ref']);
        for (let R = rg.s.r + 1; R <= rg.e.r; R++) for (let C = rg.s.c; C <= rg.e.c; C++) {
          const cell = ws[X.utils.encode_cell({ r: R, c: C })];
          if (cell && (cell.t === 'd' || (cell.t === 'n' && cell.z && X.SSF.is_date(cell.z)))) {
            const h = String((table[0] || [])[C] || X.utils.encode_col(C));
            (dateCells[R - rg.s.r] = dateCells[R - rg.s.r] || []).push(h);
          }
        }
      }
      const qmap = await aQ();
      const res = parseBulkRows(table, qmap, dateCells);
      const box = $('#bres', m);
      if (res.fatal) { box.innerHTML = `<div class="err">${esc(res.fatal)}</div>`; return; }
      const { ok, bad, dup } = res;
      const summary = {}; ok.forEach(q => { const k = `Class ${q.grade}${q.subject === 'science' ? ' Science' : ''} · Ch ${chNo(q.chapter)}`; summary[k] = summary[k] || {}; summary[k][q.type] = (summary[k][q.type] || 0) + 1; });
      box.innerHTML = `<div class="${ok.length ? 'info' : 'err'}"><b>${ok.length} question${ok.length === 1 ? '' : 's'} ready to add</b>${bad.length ? ` · <b>${bad.length} row${bad.length === 1 ? '' : 's'} with problems</b> (these will be skipped)` : ''}${dup.length ? `<br>${dup.length} row${dup.length === 1 ? ' is' : 's are'} already in the bank and will be skipped (row${dup.length === 1 ? '' : 's'} ${dup.slice(0, 12).join(', ')}${dup.length > 12 ? '…' : ''}).` : ''}</div>
        ${ok.length ? `<div class="tblwrap" style="max-height:24vh"><table class="tbl"><tr><th>Class / chapter</th>${TYPES.map(t => `<th class="num">${t}</th>`).join('')}</tr>${Object.entries(summary).map(([k, v]) => `<tr><td>${esc(k)}</td>${TYPES.map(t => `<td class="num">${v[t] || ''}</td>`).join('')}</tr>`).join('')}</table></div>` : ''}
        ${bad.length ? `<div class="sectiontitle" style="margin-top:12px">Rows to fix</div><div class="tblwrap" style="max-height:24vh"><table class="tbl"><tr><th>Row</th><th>Problem</th><th>Question</th></tr>${bad.map(b => `<tr><td>${b.rowNo}</td><td>${esc(b.probs.join('; '))}</td><td class="muted">${esc(b.preview)}</td></tr>`).join('')}</table></div>` : ''}
        ${ok.length ? `<div class="sp"></div><button class="btn green block" id="bgo">Add ${ok.length} question${ok.length === 1 ? '' : 's'}</button>` : ''}`;
      if ($('#bgo', m)) $('#bgo', m).onclick = () => busy($('#bgo', m), async () => {
        for (let i = 0; i < ok.length; i += 15) await commitOps(ok.slice(i, i + 15).map(q => { const { id, ...rest } = q; return ['set', 'questions/' + id, clean({ ...rest, updatedAt: now() })]; }));
        AC.q = undefined; await syncPool(ok.map(q => q.grade)); close();
        modal(`<h3>Added ${ok.length} questions ✓</h3><p class="small">To make a test from them: <b>Tests → + Create</b>, choose the class, then <b>Fill randomly</b> or <b>Pick by hand</b>.</p><button class="btn block" data-c>OK</button>`, (m2, c2) => m2.querySelector('[data-c]').onclick = () => { c2(); aQuestionsView(); });
      });
    });
  });
}

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const scale = Math.min(1, 900 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  let out = c.toDataURL('image/png');
  if (out.length > 350000) out = c.toDataURL('image/jpeg', 0.82);
  if (out.length > 700000) out = c.toDataURL('image/jpeg', 0.6);
  return out;
}

      $$('[data-pt]').forEach(i => Q.parts[i.dataset.pt].x = i.value.trim()); $$('[data-pm]').forEach(i => Q.parts[i.dataset.pm].marks = Number(i.value) || 0);

    $$('[data-prm]').forEach(b => b.onclick = () => { read(); Q.parts.splice(Number(b.dataset.prm), 1); Q.parts.forEach((p, i) => p.label = ['i', 'ii', 'iii', 'iv', 'v', 'vi'][i] || String(i + 1)); draw(); });

      if (Q.type === 'MCQ' && !fixTouched && !Q.fixed && looksFixed(Q)) Q.fixed = true;

      let id = q.id;
      if (!id) {
        const nums = Object.values(qmap).filter(x => gradeOf(x) === Q.grade && x.chapter === Q.chapter).map(x => x.num || 0);
        Q.num = Math.max(0, ...nums) + 1; id = `g${pad(Q.grade)}c${pad(Q.chapter)}q${pad(Q.num)}`;

      }

        grade: Q.grade, chapter: Q.chapter, subject: subjOf(Q.chapter), num: Q.num || null, type: Q.type, marks: Q.marks, difficulty: Q.difficulty || '', stem: Q.stem,
        options: Q.type === 'MCQ' ? Q.options : null, answer: Q.type === 'MCQ' ? Q.answer : null,

      aQuestionsView();
    });
    if ($('#qdel')) $('#qdel').onclick = async () => {
      const affected = (await aTests()).filter(t => (t.qids || []).includes(q.id));
      if (!(await confirmBox('Delete this question?', affected.length ? `It will also be removed from: ${affected.map(t => esc(t.title)).join(', ')}.` : 'This cannot be undone.', 'Delete', true))) return;
      await busy($('#qdel'), async () => {
        await deleteDoc(D('questions/' + q.id));
        const qmap = await aQ(); delete qmap[q.id];
        if (affected.length) await saveTests(affected.map(t => ({ ...t, qids: t.qids.filter(x => x !== q.id) })));
        await syncPool([gradeOf(q)], [q.chapter]);
        toast('Deleted'); aQuestionsView();
      });
    };
    preview();
  };
  draw();
}

    const [qmap, tests, studs] = await Promise.all([aQ(), aTests(), aStudents()]);

    const saveGrades = async () => { await setDoc(D('config/grades'), clean({ chapters: S.grades || {}, sci: S.sci || {}, updatedAt: now() })); };
    const draw = () => {
      const sj = aSubj();
      const list = chaptersOf(g, sj);
      const qs = Object.values(qmap).filter(q => gradeOf(q) === g && qSubj(q) === sj);
      const used = [...new Set(qs.map(q => chNo(q.chapter)))].sort((a, b) => a - b);
      const sci = sj === 'science' ? sciList(g).map(x => ({ ...x })) : null;
      const sciRows = () => sci.map((x, i) => `<div class="scirow"><b>${i + 1}</b><input class="input grow" data-sn="${i}" value="${esc(x.n)}" placeholder="Chapter name"><select class="input" data-sp="${i}">${PARTS.map(([k, l]) => `<option value="${k}" ${x.p === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`).join('');
      pg.innerHTML = `${gradeChips(g)}${subjChips(sj)}
        <div class="kpis"><div class="kpi"><b>${studs.filter(s => studentGrade(s) === g && hasSubj(s, sj)).length}</b><span>${SUBJ_NAME[sj]} students</span></div><div class="kpi"><b>${qs.length}</b><span>Questions</span></div><div class="kpi"><b>${tests.filter(t => gradeOf(t) === g && tSubj(t) === sj).length}</b><span>Tests</span></div></div>
        <div class="card" style="margin-top:12px"><h3>${SUBJ_NAME[sj]} chapters of Class ${g}</h3>
        ${sj === 'science' ? `<p class="small muted" style="margin:0 0 8px">Type each chapter's name and choose Physics, Chemistry or Biology. Row 1 is Chapter 1, row 2 is Chapter 2, as in the Science book. You can rename chapters any time. Add new ones at the end; don't change the order of chapters that already have questions.${g === 10 && !(S.sci && S.sci['10'] && S.sci['10'].length) ? ' The 13 CBSE Class 10 chapters are filled in for you.' : ''}</p>
          <div id="scil">${sciRows()}</div><div class="row" style="margin:8px 0 12px"><button class="btn sec sm" id="sadd">+ Add chapter</button>${sci.length ? '<button class="btn ghost sm" id="sdel">Remove the last one</button>' : ''}</div>`
        : `<p class="small muted" style="margin:0 0 8px">One chapter per line. Line 1 is Chapter 1, line 2 is Chapter 2, and so on. You can rename chapters any time. Add new ones at the end; don't change the order of chapters that already have questions.</p>
        <textarea class="input" id="chl" style="min-height:260px">${esc(list.join('\n'))}</textarea>`}
        ${used.length ? `<p class="tiny muted">Chapters used by questions: ${used.join(', ')}</p>` : ''}
        <div id="cherr"></div><button class="btn block" id="chs">Save chapters</button></div>`;
      bindGradeChips(pg, v => { g = AC.g = v; draw(); });
      bindSubjChips(pg, () => draw());
      const maxUsed = Math.max(0, ...used);
      if (sj === 'science') {
        const read = () => { $$('[data-sn]', pg).forEach(i => sci[i.dataset.sn].n = i.value.trim()); $$('[data-sp]', pg).forEach(i => sci[i.dataset.sp].p = i.value); };
        const redo = () => { $('#scil').innerHTML = sciRows(); };
        $('#sadd').onclick = () => { read(); sci.push({ n: '', p: sci.length ? sci[sci.length - 1].p : 'phy' }); redo(); const ins = $$('[data-sn]', pg); ins[ins.length - 1].focus(); };
        if ($('#sdel')) $('#sdel').onclick = () => { read(); sci.pop(); redo(); };
        $('#chs').onclick = () => busy($('#chs'), async () => {
          read();
          while (sci.length && !sci[sci.length - 1].n) sci.pop();
          if (sci.some(x => !x.n)) { $('#cherr').innerHTML = '<div class="err">Give every chapter a name (or remove the empty rows at the end).</div>'; return; }
          if (sci.length < maxUsed && !(await confirmBox('Some chapters have no name', `Questions use chapters up to ${maxUsed}, but you listed ${sci.length}. Chapters without a name show as “Chapter N”. Save anyway?`, 'Save'))) return;
          S.sci = { ...(S.sci || {}), [String(g)]: sci.map(x => ({ n: x.n, p: PART_NAME[x.p] ? x.p : 'phy' })) };
          await saveGrades(); toast(`Class ${g} Science chapters saved ✓`); draw();
        });
        return;
      }
      $('#chs').onclick = () => busy($('#chs'), async () => {
        const lines = $('#chl').value.split('\n').map(x => x.trim()).filter(Boolean);
        if (lines.length && lines.length < maxUsed && !(await confirmBox('Some chapters have no name', `Questions use chapters up to ${maxUsed}, but you listed ${lines.length}. Chapters without a name show as “Chapter N”. Save anyway?`, 'Save'))) return;
        const chapters = { ...(S.grades || {}) }; chapters[String(g)] = lines;
        S.grades = chapters; await saveGrades(); toast(`Class ${g} chapters saved ✓`); draw();
      });
    };
    draw();
  });
}

// "selected students" announcements are copied into each chosen student's private inbox, so other students can't read them
async function saveAnnouncement(id, data, old) {
  const all = await aAnns(true);
  const ops = [];
  if (data.pinned) all.filter(x => x.pinned && x.id !== id).forEach(x => {
    ops.push(['update', 'announcements/' + x.id, { pinned: false }]);
    (x.audience === 'some' ? x.targets || [] : []).forEach(s => ops.push(['set', `students/${s}/inbox/${x.id}`, clean({ ...x, id: undefined, targets: [], pinned: false })]));
  });
  ops.push(['set', 'announcements/' + id, data]);
  const oldT = old && old.audience === 'some' ? old.targets || [] : [];
  const newT = data.audience === 'some' ? data.targets : [];
  oldT.filter(s => !newT.includes(s)).forEach(s => ops.push(['delete', `students/${s}/inbox/${id}`]));
  newT.forEach(s => ops.push(['set', `students/${s}/inbox/${id}`, { ...data, targets: [] }]));   // copy without other students' IDs
  await commitOps(ops); AC.anns = undefined;
}
async function removeAnnouncement(a) {
  await commitOps([['delete', 'announcements/' + a.id], ...(a.audience === 'some' ? a.targets || [] : []).map(s => ['delete', `students/${s}/inbox/${a.id}`])]);
  AC.anns = undefined;
}

  bars: { type: 'bars', title: '', max: 20, items: [{ label: '', sub: '', value: 0 }], footnote: '' },
  rangebars: { type: 'rangebars', title: '', max: 10, legendUsual: 'usual marks', legendUpto: 'can go up to', items: [{ label: '', low: 0, high: 0, text: '', tag: 'High' }], footnote: '' },
  sections: { type: 'sections', items: [{ name: '', qs: '', formula: '', desc: '', time: '', color: 'blue' }] },
  stackbar: { type: 'stackbar', title: '', items: [{ label: '', value: 0, caption: '', color: 'blue' }] },

const blankGuide = (g, sj = 'maths') => ({ badge: `CLASS ${g} ${SUBJ_NAME[sj].toUpperCase()}`, footer: `Class ${g} ${SUBJ_NAME[sj]} guide`, parts: [{ tab: '1. Guide', title: 'Exam guide', blocks: [{ type: 'callout', tone: 'blue', text: '**Tip:** write your first tip here.' }] }] });
function getPath(o, p) { return p.reduce((a, k) => a[k], o); }
function setPath(o, p, v) { const last = p[p.length - 1]; getPath(o, p.slice(0, -1))[last] = v; }
function blankLike(x) { if (Array.isArray(x)) return x.length && typeof x[0] === 'string' ? [''] : []; if (x && typeof x === 'object') { const r = {}; for (const [k, v] of Object.entries(x)) r[k] = k === 'type' || k === 'color' || k === 'tone' ? v : blankLike(v); return r; } return typeof x === 'number' ? 0 : ''; }
function jf(v, path, key) {
  const P = esc(JSON.stringify(path));
  if (Array.isArray(v)) {
    return `<fieldset><legend>${esc(GLABEL[key] || key)}</legend>${v.map((x, i) => `<div class="arritem">${jf(x, [...path, i], key === 'bullets' ? 'Bullet' : '')}

      ${v.length ? `<button class="btn sec sm" data-add='${P}'>+ Add</button>` : ''}</fieldset>`;
  }
  if (v && typeof v === 'object') {
    return `${v.type ? `<div class="chip" style="margin:4px 0 8px">${esc(BLOCKNAME[v.type] || v.type)}</div>` : ''}${Object.entries(v).filter(([k]) => k !== 'type').map(([k, x]) => jf(x, [...path, k], k)).join('')}`;
  }
  const label = GLABEL[key] || key;
  if (key === 'color' || key === 'tone') return `<label class="field"><span>${esc(label)}</span><select class="input" data-p='${P}'>${(key === 'color' ? COLORS : TONES).map(c => `<option ${c === v ? 'selected' : ''}>${c}</option>`).join('')}</select></label>`;
  if (typeof v === 'number') return `<label class="field"><span>${esc(label)}</span><input class="input" type="number" step="any" data-p='${P}' data-num="1" value="${v}"></label>`;
  return `<label class="field">${label ? `<span>${esc(label)}</span>` : ''}${String(v).length > 60 ? `<textarea class="input" data-p='${P}' style="min-height:80px">${esc(v)}</textarea>` : `<input class="input" data-p='${P}' value="${esc(v)}">`}</label>`;
}

// who may delete their own chat messages: students/{sid}.chatDelete
function chatAccessForm(studs, done) {
  const sel = new Set(); let listG = 'all';
  modal(`<h3>Who can delete their own messages?</h3>
    <p class="small muted" style="margin-top:0">You can always delete any message or a whole chat. A student with access can delete only the messages <b>they</b> sent. A deleted message is removed for both of you and can't be brought back.</p>
    <div class="field"><span>Students</span><select class="input" id="cwho"><option value="all">All students (${studs.length})</option><option value="class">One class</option><option value="some">Only the students I pick</option></select></div>
    <label class="field hidden" id="ccls"><span>Class</span><select class="input" id="cg">${gradeOptions(AC.g || 10)}</select></label>
    <div id="csw" class="hidden"><select class="input" id="clf" style="margin-bottom:6px"><option value="all">Show all classes</option>${GRADES.map(gg => `<option value="${gg}">Show Class ${gg}</option>`).join('')}</select>
      <div id="csl" style="max-height:28vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:10px"></div></div>
    <div id="ccount" class="small" style="margin:0 0 10px;font-weight:600"></div><div id="cerr"></div>
    <div class="row wrap" style="justify-content:flex-end"><button class="btn sec" data-c>Close</button><button class="btn danger" id="crem">Remove access</button><button class="btn green" id="cgive">Give access</button></div>`, (m, close) => {
    let targets = [];
    const recount = () => {
      const who = $('#cwho', m).value, gg = Number($('#cg', m).value);
      targets = who === 'some' ? studs.filter(s => sel.has(s.id)) : who === 'class' ? studs.filter(s => studentGrade(s) === gg) : studs;
      $('#ccount', m).textContent = `${targets.length} student${targets.length === 1 ? '' : 's'} chosen · ${targets.filter(s => s.chatDelete === true).length} can delete now.`;
    };
    const drawList = () => { const box = $('#csl', m); box.innerHTML = pickerHtml(studs.filter(s => listG === 'all' || studentGrade(s) === listG), sel); bindPicker(box, sel, recount); };
    drawList(); recount();
    m.querySelector('[data-c]').onclick = close;
    $('#cwho', m).onchange = e => { $('#ccls', m).classList.toggle('hidden', e.target.value !== 'class'); $('#csw', m).classList.toggle('hidden', e.target.value !== 'some'); recount(); };
    $('#cg', m).onchange = recount;
    $('#clf', m).onchange = e => { listG = e.target.value === 'all' ? 'all' : Number(e.target.value); drawList(); };
    const run = v => busy($(v ? '#cgive' : '#crem', m), async () => {
      const ch = targets.filter(s => (s.chatDelete === true) !== v);
      if (!targets.length) { $('#cerr', m).innerHTML = '<div class="err">Choose at least one student.</div>'; return; }
      await commitOps(ch.map(s => ['update', 'students/' + s.id, { chatDelete: v }]));
      close(); toast(v ? `${targets.length} student${targets.length === 1 ? '' : 's'} can now delete their own messages` : 'Access removed'); done();
    });
    $('#cgive', m).onclick = () => run(true); $('#crem', m).onclick = () => run(false);
  });
}
async function deleteWholeChat(sid) {
  const msgs = await listC(`chats/${sid}/messages`);
  await commitOps(msgs.map(x => ['delete', `chats/${sid}/messages/${x.id}`]));
  await deleteDoc(D('chats/' + sid));
  return msgs.length;
}
async function deleteChats(list, label) {
  if (!(await confirmBox(`Delete ${label}?`, `<b>${list.length} chat${list.length === 1 ? '' : 's'}</b> and every message in ${list.length === 1 ? 'it' : 'them'} will be deleted for you and the students. This can't be undone.<br><br>Want a copy first? Cancel, then use Settings → Full backup (JSON).`, 'Delete', true))) return;
  const close = modal(`<h3>Deleting chats…</h3><p class="muted" id="dpr">Starting</p>${spinner()}<p class="tiny muted">Keep this page open.</p>`);
  try {
    let n = 0;
    for (const t of list) { await deleteWholeChat(t.id); n++; const el = $('#dpr'); if (el) el.textContent = `${n} of ${list.length} chats`; }
    close(); toast(`${n} chat${n === 1 ? '' : 's'} deleted`);
  } catch (e) { close(); console.error(e); toast('Stopped: ' + errMsg(e), 5000); }
  if (S.view === 'admin-messages') aMessages();
}
async function adminSend(sid, s, text, extra = {}) {
  const at = now();
  const b = writeBatch(db);
  b.set(D(`chats/${sid}/messages/${msgId()}`), clean({ from: 'a', text, at, kind: 'text', ...extra }));
  b.set(D('chats/' + sid), { sid, name: (s && s.name) || sid, grade: s ? studentGrade(s) : 10, lastAt: at, lastText: text.slice(0, 140), lastFrom: 'a', aAt: at, aRead: at }, { merge: true });
  await b.commit();
}
async function aThread(sid, back) {
  const studs = await aStudents();
  const s = studs.find(x => x.id === sid) || { id: sid, name: sid };
  const goBack = back || (() => aMessages());
  const pg = aShell('messages', s.name || sid, `<div class="chat" id="msgs">${spinner()}</div>`, { back: goBack, action: '<button class="tbbtn" id="tdel" aria-label="Delete messages">🗑 Delete</button>' });
  $('.topbar .sub').textContent = `Class ${studentGrade(s)} · ID: ${sid}`;
  const bar = document.createElement('div'); bar.className = 'chatbar admin';
  bar.innerHTML = `<div class="in"><textarea class="input" id="ctext" rows="1" maxlength="1000" placeholder="Reply to ${esc((s.name || sid).split(' ')[0])}…"></textarea><button class="btn" id="csend" aria-label="Send">${ICON.send}</button></div>`;
  $('#app').appendChild(bar);
  const place = () => { pg.style.paddingBottom = (bar.offsetHeight + 16) + 'px'; };
  const ta = $('#ctext'), box = $('#msgs');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; place(); };
  place();
  const [tests, qmap] = await Promise.all([aTests(), aQ().catch(() => ({}))]);
  const reqState = {};      // tid -> 'open' | 'locked' | 'none'
  const respCache = {};     // attempt/practice id -> responses
  // a student's "Ask Sir about Q…": the full question (with the answer), shown in the order the student saw the options
  const qrefCard = m => {
    const q = qmap[m.qid]; const r = (respCache[m.aid] || {})[m.qid];
    const order = q && q.type === 'MCQ' && q.options ? optOrder({ ...q, qid: m.qid }, sid, m.tid) : null;
    const extra = !q ? '' : q.type !== 'MCQ' ? `<div class="small" style="margin-top:6px"><span class="muted">Student's final answer:</span> ${r && r.t ? esc(r.t) : '<i>(blank)</i>'}</div>${q.finalAnswer ? `<div class="ansbox">${inlineRich(q.finalAnswer)}</div>` : ''}`
      : (!r || r.o == null) ? '<div class="tiny muted" style="margin-top:6px">The student left this blank.</div>' : '';
    return `❓ <b>Doubt on Q${esc(m.qn || '')}</b> · ${esc(m.title || '')}${m.src === 'practice' ? ' <span class="tiny">(practice mock)</span>' : ''}<div class="dq" style="margin-top:4px">${esc(m.text)}</div>${q ? `<div class="qcard qtext">${questionHtml(q, { order, chosen: r && r.o, reveal: q.type === 'MCQ', answer: q.answer })}${extra}<div class="tiny muted" style="margin-top:6px">${esc(m.qid)}${order ? ' · options in the order the student saw them' : ''}</div></div>`
        : m.qx ? `<div class="qx">${esc(m.qx)}</div>` : ''}`;
  };
  const reqCard = m => {
    const st = reqState[m.tid];
    const action = m.done || st === 'open' ? '<div class="tiny" style="margin-top:6px">✓ Solutions are open for this student</div>'
      : st === 'none' ? '<div class="tiny" style="margin-top:6px">No submitted attempt found for this test.</div>'
      : `<button class="btn green sm" style="margin-top:8px" data-opensol="${esc(m.tid)}" data-mid="${esc(m.id)}">🔓 Open solutions for ${esc((s.name || sid).split(' ')[0])}</button>`;
    return `🔓 <b>Asked to open solutions</b><br>${esc(m.title || m.tid)}${action}`;
  };
  let marked = 0, msgs = [], pick = null;
  $('#tdel').onclick = () => modal(`<h3>Delete messages</h3><p class="small muted" style="margin-top:0">Deleted messages are removed for you and ${esc(s.name || sid)}, and can't be brought back.</p>
    <button class="btn block" id="dpick">Choose messages to delete</button><div class="sp"></div><button class="btn danger block" id="dall">Delete the whole chat</button>
    <div class="row" style="margin-top:14px;padding:10px 12px;border-radius:12px;background:#f4f5fa"><div class="grow small">${s.chatDelete === true ? `🗑 <b>${esc((s.name || sid).split(' ')[0])} can delete their own messages.</b>` : `🔒 ${esc((s.name || sid).split(' ')[0])} can't delete messages.`}</div><button class="btn sec sm" id="dacc">${s.chatDelete === true ? 'Remove access' : 'Let the student delete'}</button></div>
    <div class="sp"></div><button class="btn ghost block" data-c>Cancel</button>`, (m, close) => {
    m.querySelector('[data-c]').onclick = close;
    $('#dpick', m).onclick = () => { close(); if (!msgs.length) return toast('There are no messages to delete.'); startPick({ sid, admin: true, can: () => true, msgs: () => msgs, set: p => { pick = p; paint(); } }); };
    $('#dall', m).onclick = async () => {
      close();
      if (!(await confirmBox('Delete the whole chat?', `Every message between you and <b>${esc(s.name || sid)}</b> will be deleted for both of you. This can't be undone.`, 'Delete chat', true))) return;
      await busy(null, async () => { stopView(); const n = await deleteWholeChat(sid); toast(`Chat deleted (${n} message${n === 1 ? '' : 's'})`); goBack(); });
    };
    $('#dacc', m).onclick = () => busy($('#dacc', m), async () => {
      if (!s.uid && !(await getD('students/' + sid))) return toast('This student no longer exists.');
      const v = s.chatDelete !== true; await updateDoc(D('students/' + sid), { chatDelete: v }); s.chatDelete = v; AC.students = undefined; close();
      toast(v ? 'The student can now delete their own messages' : 'Access removed');
    });
  });
  const paint = () => {
    box.innerHTML = msgs.length ? bubblesHtml(msgs, 'a', reqCard, qrefCard, pick) : '<div class="card empty" style="margin-top:20px">No messages yet. Write the first one below.</div>';
    fillImages(box);
    if (!pick) window.scrollTo(0, document.body.scrollHeight);
    $$('[data-opensol]', box).forEach(b => b.onclick = () => busy(b, async () => {
      const tid = b.dataset.opensol, t = tests.find(x => x.id === tid);
      await updateDoc(D(`attempts/${sid}_${tid}_1`), { solutionsOpen: true });
      await updateDoc(D(`chats/${sid}/messages/${b.dataset.mid}`), { done: true });
      reqState[tid] = 'open'; AC.atts = undefined;
      await adminSend(sid, s, `I've opened the solutions for “${t ? t.title : tid}”. Open the test to see them. ✓`);
      toast('Solutions opened and student told');
    }));
  };
  listen('view', query(C(`chats/${sid}/messages`), orderBy('at', 'desc'), limit(150)), async snap => {
    msgs = snapDocs(snap).reverse();
    for (const m of msgs.filter(x => x.kind === 'qref' && x.aid && !(x.aid in respCache))) {
      const d = await getD((m.src === 'practice' ? 'practice/' : 'attempts/') + m.aid).catch(() => null);
      respCache[m.aid] = (d && d.responses) || {};
    }
    const pending = [...new Set(msgs.filter(m => m.kind === 'solreq' && !m.done && !reqState[m.tid]).map(m => m.tid))];
    for (const tid of pending) {
      const a = await getD(`attempts/${sid}_${tid}_1`).catch(() => null); const t = tests.find(x => x.id === tid);
      reqState[tid] = !a ? 'none' : (a.solutionsOpen === true || (t && t.solutionsOpen === true)) ? 'open' : 'locked';
    }
    paint();
    const th = (AC.chats || []).find(x => x.id === sid);
    const last = msgs.filter(m => m.from === 's').pop();
    if (last && th && (th.aRead || 0) < last.at && marked !== last.at) { marked = last.at; updateDoc(D('chats/' + sid), { aRead: now() }).catch(e => console.warn(e)); }
  }, () => { box.innerHTML = '<div class="card">Messages need the new Firestore rules. Paste and publish firestore-rules.txt, then reload.</div>'; });
  const send = () => busy($('#csend'), async () => { const text = ta.value.trim(); if (!text) return; await adminSend(sid, s, text.slice(0, 1000)); ta.value = ''; ta.oninput(); });

// ---------- PRACTICE MOCKS ----------
// Only MCQs that are in none of the tests go into the pool, so practising never gives away test answers.
function poolEligible(qmap, tests, g) {
  const inTests = new Set(tests.flatMap(t => t.qids || []));
  return Object.values(qmap).filter(q => gradeOf(q) === g && q.type === 'MCQ' && Array.isArray(q.options) && q.options.length === 4 && q.options.every(o => String(o || '').trim())
    && q.answer != null && !inTests.has(q.id));
}
async function buildPools(grades, onlyCh) {
  const [qmap, tests] = await Promise.all([aQ(), aTests()]);
  const ops = [];
  for (const g of [...new Set(grades.map(Number))]) {
    const byCh = {}; poolEligible(qmap, tests, g).forEach(q => (byCh[q.chapter] = byCh[q.chapter] || []).push(q));
    const existing = await listC('pool', where('grade', '==', g));
    const chs = [...new Set([...Object.keys(byCh).map(Number), ...existing.map(d => Number(d.chapter))])].filter(c => !onlyCh || onlyCh.map(Number).includes(c));
    for (const c of chs) {
      const id = poolId(g, c);
      let list = (byCh[c] || []).sort(qSort);
      if (!list.length) { if (existing.some(d => Number(d.chapter) === c)) ops.push(['delete', 'pool/' + id], ['delete', 'poolKeys/' + id]); continue; }
      const mk = l => [clean({ grade: g, chapter: c, count: l.length, updatedAt: now(),
          items: l.map(q => ({ qid: q.id, chapter: c, type: 'MCQ', marks: Number(q.marks) || 1, stem: q.stem || [], options: q.options, fixed: q.fixed === true ? true : undefined })) }),
        clean({ grade: g, chapter: c, updatedAt: now(), items: Object.fromEntries(l.map(q => [q.id, { answer: q.answer, solution: q.solution || [] }])) })];
      let [p, k] = mk(list);
      while (list.length > 1 && (JSON.stringify(p).length > 900000 || JSON.stringify(k).length > 900000)) { list = list.slice(0, Math.floor(list.length * 0.8)); [p, k] = mk(list); }   // stay under Firestore's 1 MB per document
      ops.push(['set', 'pool/' + id, p], ['set', 'poolKeys/' + id, k]);
    }
  }
  await commitOps(ops, 8);
}

async function saveLive(id, data, old) {

    m.querySelector('[data-c]').onclick = close;
    $('#lrep', m).onchange = e => $('#lunw', m).classList.toggle('hidden', !e.target.checked);
    $('#la', m).onchange = e => { $('#lcls', m).classList.toggle('hidden', e.target.value !== 'class'); $('#lsw', m).classList.toggle('hidden', e.target.value !== 'some'); };
    $('#llf', m).onchange = e => { listG = e.target.value === 'all' ? 'all' : Number(e.target.value); drawList(); };
    $('#lsave', m).onclick = () => busy($('#lsave', m), async () => {
      const err = x => { $('#lerr', m).innerHTML = `<div class="err">${esc(x)}</div>`; };
      const mode = $('#la', m).value, link = $('#ll', m).value.trim();
      const startAt = new Date(`${$('#ld', m).value}T${$('#ltm', m).value}`).getTime();
      const rep = $('#lrep', m).checked; const un = rep && $('#lun', m).value ? new Date($('#lun', m).value + 'T23:59:59').getTime() : null;
      const data = clean({ title: $('#lt', m).value.trim(), subject: $('#lsj', m).value, audience: mode === 'all' ? 'all' : mode === 'class' ? 'g' + $('#lg', m).value : 'some', targets: mode === 'some' ? [...sel] : [],
        startAt, mins: Number($('#lm', m).value) || 60, link, note: $('#ln', m).value.trim(), repeat: rep ? 'weekly' : '', until: un, createdAt: c.createdAt || now(), updatedAt: now() });
      if (!data.title) return err('Give the class a title.');
      if (!/^https:\/\/\S+$/i.test(link)) return err('Paste the class link. It must start with https://');
      if (!startAt) return err('Choose the date and the start time.');
      if (!lcNext(data)) return err(rep ? 'The “repeat until” date is before the next class.' : 'This date and time has already passed.');
      if (mode === 'some' && !data.targets.length) return err('Select at least one student.');
      try { await saveLive(c.id || 'lc_' + now().toString(36), data, isNew ? null : c); }
      catch (e) { if (e && e.code === 'permission-denied') return err('Live classes need the new Firestore rules. Paste and publish firestore-rules.txt first.'); throw e; }
      close(); toast(isNew ? 'Class scheduled ✓ Students see it on Home' : 'Saved ✓'); aLive();
    });
    if (!isNew) $('#ldel', m).onclick = async () => { close(); if (await confirmBox('Delete this class?', 'Students will no longer see it.', 'Delete', true)) await busy(null, async () => { await removeLive(c); toast('Deleted'); aLive(); }); };
  });
}

</script>
</body>
</html>
