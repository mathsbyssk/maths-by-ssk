<style>
:root{
  --ink:#1b1f3b; --ink2:#3b4160; --muted:#6b7183; --bg:#f4f5fb; --card:#fff; --line:#e4e7f0;
  --brand1:#1e3a8a; --brand2:#4338ca; --accent:#fbbf24;
  --blue:#2b7bd6; --orange:#e8693a; --green:#1cb07a; --amber:#eba200; --pink:#e87aa4; --gray:#c9c7c1; --purple:#7c3aed;
  --sblue:#eef2fd; --sgreen:#e5f5ec; --sgray:#f2f2ef; --sorange:#fdf3ea; --slav:#f1effd; --syellow:#fdf8e4; --sred:#fdeaea;
  --red:#d93a3a; --ok:#14935f;
  --r:16px; --shadow:0 1px 2px rgba(20,24,60,.06),0 4px 14px rgba(20,24,60,.06);
  --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
h1,h2,h3,h4{font-family:var(--head);margin:0 0 .4em;line-height:1.25}
h2{font-size:1.25rem} h3{font-size:1.05rem}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.center{text-align:center} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.sp{height:12px}

/* ---------- app shell ---------- */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--brand1),var(--brand2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(30,40,120,.25)}
.topbar h1{font-size:1.08rem;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:.75rem;opacity:.85}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.page{max-width:860px;margin:0 auto;padding:16px 14px 110px}
.page.wide{max-width:1180px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 0;cursor:pointer}
.bottomnav button svg{width:23px;height:23px}
.bottomnav button.on{color:var(--brand2);font-weight:600}

/* ---------- cards & controls ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid #edf0f6}
.card+.card{margin-top:12px}
.card.flat{box-shadow:none}
.card h3{margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--brand2);color:#fff;font-size:.95rem;min-height:44px;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.btn.sec{background:#eef0fb;color:var(--brand2)}
.btn.ghost{background:transparent;color:var(--brand2);padding:8px 10px}
.btn.danger{background:#fde8e8;color:var(--red)}
.btn.green{background:var(--green)}
.btn.wa{background:#25d366;color:#08331a}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;color:var(--ink2)}
.input,select.input,textarea.input{width:100%;border:1.5px solid #d9dceb;border-radius:12px;padding:11px 12px;background:#fff;font-size:1rem;outline:none}
.input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(67,56,202,.12)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#eef0fb;color:var(--brand2);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.g{background:var(--sgreen);color:var(--ok)} .chip.r{background:var(--sred);color:var(--red)} .chip.a{background:var(--syellow);color:#8a5a00} .chip.p{background:var(--slav);color:var(--purple)} .chip.n{background:#f0f1f5;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toggle{border:1.5px solid #d9dceb;background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.toggle.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.sectiontitle{font-family:var(--head);font-weight:600;font-size:1rem;margin:22px 4px 10px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;border:1px solid #edf0f6;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi b{display:block;font-family:var(--head);font-size:1.5rem;color:var(--brand2)}
.kpi span{font-size:.85rem;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden}
.avatar svg{width:100%;height:100%}
.avatar.lg{width:72px;height:72px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:600;background:#fafbfe;position:sticky;top:0}
.tblwrap{overflow:auto;max-width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}

function errMsg(e) {
  const c = e && e.code || '';
  const map = {
    'auth/invalid-credential': 'Wrong ID or password.', 'auth/wrong-password': 'Wrong ID or password.', 'auth/user-not-found': 'Wrong ID or password.',
    'auth/invalid-login-credentials': 'Wrong ID or password.', 'auth/too-many-requests': 'Too many tries. Please wait a few minutes and try again.',
    'auth/network-request-failed': 'No internet connection. Please check and try again.', 'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/email-already-in-use': 'This ID is already taken.', 'auth/invalid-email': 'That ID has characters that are not allowed.',

    'permission-denied': 'Not allowed. Check that the Firestore rules were pasted and published.', 'unavailable': 'No internet connection. Please try again.'
  };
  return map[c] || (e && e.message) || String(e);
}

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
function modal(html, onMount) {
  const bg = document.createElement('div'); bg.className = 'modalbg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  if (onMount) onMount(bg.firstElementChild, close);
  return close;
}
function confirmBox(title, text, okLabel = 'OK', danger = false) {
  return new Promise(res => {
    modal(`<h3>${esc(title)}</h3><p class="muted">${text}</p><div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn sec" data-x="no">Cancel</button><button class="btn ${danger ? 'danger' : ''}" data-x="ok">${esc(okLabel)}</button></div>`,
      (m, close) => { m.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; close(); res(x.dataset.x === 'ok'); }); });
  });
}
function spinner() { return '<div class="spinner"></div>'; }
function download(name, text, type = 'text/plain') {
  const blob = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv(rows) { return '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
async function busy(btn, fn) {
  if (btn) { btn.disabled = true; btn.dataset.l = btn.innerHTML; btn.innerHTML = 'Please wait…'; }
  try { return await fn(); } catch (e) { console.error(e); toast(errMsg(e), 4200); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = btn.dataset.l; } }
}

// ================= RICH TEXT + MATHS =================
function tex(t, display = false) {
  // \displaystyle keeps fractions full-size inside sentences, which reads better on small phones
  if (window.katex) { try { return window.katex.renderToString('\\displaystyle ' + t, { throwOnError: false, displayMode: display }); } catch { } }
  return `<code>${esc(t)}</code>`;
}
function inlineRich(s) {
  const parts = String(s ?? '').split(/(\$[^$]+\$)/g);
  return parts.map(p => {
    if (p.length > 2 && p.startsWith('$') && p.endsWith('$')) return tex(p.slice(1, -1));
    return esc(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  }).join('');
}
function renderBlocks(blocks) {
  return (blocks || []).map(b => {
    if (b.t === 'p') return `<p>${inlineRich(b.x)}</p>`;
    if (b.t === 'ans') return `<div class="ansbox">${inlineRich(b.x)}</div>`;
    if (b.t === 'img') return `<img class="qimg qimgph" data-img="${esc(b.id)}" alt="Figure">`;
    if (b.t === 'table') return `<table class="dtable">${(b.rows || []).map(r => `<tr>${(r.c || []).map(c => `<td>${inlineRich(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    return '';
  }).join('');
}
// text format used in the admin editor  <->  blocks
function blocksToText(blocks) {
  return (blocks || []).map(b => {
    if (b.t === 'p') return b.x;
    if (b.t === 'ans') return '>> ' + b.x;
    if (b.t === 'img') return `[img:${b.id}]`;
    if (b.t === 'table') return (b.rows || []).map(r => '| ' + (r.c || []).join(' | ') + ' |').join('\n');
    return '';
  }).join('\n');
}
function textToBlocks(text) {
  const out = []; let table = null;
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    if (line.startsWith('|')) {
      const cells = line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      if (!table) { table = { t: 'table', rows: [] }; out.push(table); }
      table.rows.push({ c: cells }); continue;
    }
    table = null;
    if (!line) continue;
    const m = line.match(/^\[img:([A-Za-z0-9_-]+)\]$/);
    if (m) out.push({ t: 'img', id: m[1] });
    else if (line.startsWith('>>')) out.push({ t: 'ans', x: line.replace(/^>>\s*/, '') });
    else out.push({ t: 'p', x: line });
  }
  return out;
}
function plainText(blocks, n = 140) {
  const s = (blocks || []).filter(b => b.t === 'p').map(b => b.x).join(' ').replace(/\$([^$]+)\$/g, '$1').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '($1)/($2)').replace(/\\[a-zA-Z]+/g, '').replace(/[{}*]/g, '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

async function routeUser(u) {
  S.user = u; S.role = null; S.sid = null; S.profile = null;
  if (!u) { bootedOnce = true; return showLogin(); }
  $('#app').innerHTML = spinner();
  try {
    S.adminDoc = await getD('config/admin');
    if (S.adminDoc && S.adminDoc.uid === u.uid) {
      S.role = 'admin';
      S.settings = (await getD('config/settings').catch(() => null)) || {};
      return adminStart();
    }
    const ud = await getD('users/' + u.uid);
    if (ud && ud.role === 'student') {
      S.role = 'student'; S.sid = ud.sid;
      S.profile = await getD('students/' + ud.sid);
      if (!S.profile) throw new Error('profile');
      S.settings = (await getD('config/settings').catch(() => null)) || {};
      return studentStart();
    }
    await signOut(auth);
    showLogin('This login is not active. Please ask your teacher.');
  } catch (e) {
    console.error(e);
    if (e.message === 'profile' || e.code === 'permission-denied') { await signOut(auth); return showLogin('This login is not active. Please ask your teacher.'); }
    $('#app').innerHTML = `<div class="page"><div class="card"><h3>Could not load</h3><p class="muted">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">Try again</button></div></div>`;
  }
}

// ================= SCORING (shared by student + admin) =================
// test items snapshot lives in the attempt; key = testKeys/{tid}.items
function scoreAttempt(att, key) {
  const r = { mcq: 0, mcqMax: 0, wr: 0, wrMax: 0, pending: 0, writtenCount: 0, perCh: {}, correct: 0, wrong: 0, blank: 0 };
  for (const it of att.items || []) {
    const ch = it.chapter; r.perCh[ch] = r.perCh[ch] || { got: 0, max: 0 };
    if (it.type === 'MCQ') {
      r.mcqMax += it.marks;
      const resp = att.responses && att.responses[it.qid];
      const ans = key && key[it.qid] ? key[it.qid].answer : null;
      if (!resp || resp.o == null) r.blank++;
      else if (resp.o === ans) { r.mcq += it.marks; r.correct++; } else r.wrong++;
      if (ans != null) { r.perCh[ch].max += it.marks; if (resp && resp.o === ans) r.perCh[ch].got += it.marks; }
    } else {
      r.wrMax += it.marks; r.writtenCount++;
      const g = att.grades ? att.grades[it.qid] : undefined;
      if (g == null) r.pending++; else { r.wr += Number(g); r.perCh[ch].got += Number(g); r.perCh[ch].max += it.marks; }
    }
  }
  r.total = r.mcq + r.wr; r.max = r.mcqMax + r.wrMax;
  return r;
}
function optionOrder(sid, tid, qid, n) { return shuffled([...Array(n).keys()], hashStr(`${sid}|${tid}|${qid}`)); }
function remapOptionLetters(text, order) {    // "Option (c)" in solution text -> the letter this student saw
  return String(text).replace(/([Oo]ption )\(([a-d])\)/g, (m, w, L) => { const orig = 'abcd'.indexOf(L); const pos = order.indexOf(orig); return pos >= 0 ? `${w}(${'abcd'[pos]})` : m; });
}

function questionHtml(item, opts = {}) {
  const { order, chosen, reveal, answer, showParts = true } = opts;
  let h = `<div class="qtext">${renderBlocks(item.stem)}</div>`;
  if (item.parts && item.parts.length && showParts) {
    h += `<ul class="parts qtext">${item.parts.map(p => `<li>(${esc(p.label)}) ${inlineRich(p.x)} <span class="pm">[${esc(p.marks)}]</span></li>`).join('')}</ul>`;
  }
  if (item.type === 'MCQ' && item.options) {
    const ord = order || item.options.map((_, i) => i);
    h += ord.map((orig, pos) => {
      let cls = 'opt';
      if (reveal) { if (orig === answer) cls += ' right'; else if (orig === chosen) cls += ' wrong'; }
      else if (orig === chosen) cls += ' sel';
      return `<button class="${cls}" data-opt="${orig}" ${reveal ? 'disabled' : ''}><span class="L">${'abcd'[pos]}</span><span class="ot qtext">${inlineRich(item.options[orig])}</span></button>`;
    }).join('');
  }
  return h;
}

// ================= EXAM GUIDE: renderer =================
function gText(s) { return inlineRich(s || ''); }

function clockMin(t) {
  const [h, m] = String(t).split(':').map(Number);
  const hh = h < 8 ? h + 12 : h;
  return hh * 60 + (m || 0);
}

function renderGuideBlock(b) {
  switch (b.type) {
    case 'stats':
      return `<div class="gstats">${(b.items || []).map(i => `<div class="s"><b>${esc(i.big)}</b><span>${esc(i.small)}</span></div>`).join('')}</div>`;
    case 'notes':
      return `<div class="gnotes">${(b.items || []).map(i => `<div class="gnote tone-${esc(i.tone || 'gray')}"><b>${esc(i.title)}</b>${gText(i.text)}</div>`).join('')}</div>`;
    case 'bars': {
      const max = Number(b.max) || Math.max(...(b.items || []).map(i => Number(i.value) || 0), 1);
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>${(b.items || []).map(i => `
        <div class="hbar"><div class="lb">${esc(i.label)}<small>${esc(i.sub || '')}</small></div>
        <div class="tr"><div class="b1" style="width:${Math.min(100, (Number(i.value) || 0) / max * 85)}%"></div><span class="v">${esc(i.value)}</span></div></div>`).join('')}
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    case 'rangebars': {
      const max = Number(b.max) || 10;
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>${(b.items || []).map(i => {
        const lo = Number(i.low) || 0, hi = Math.max(Number(i.high) || 0, lo);
        const tagKey = String(i.tag || '').split(' ')[0];
        return `<div class="hbar"><div class="lb">${esc(i.label)}</div>
        <div class="tr"><div style="display:flex;width:${hi / max * 70}%"><div class="b1" style="width:${hi ? lo / hi * 100 : 0}%;border-radius:${hi > lo ? '0' : '0 6px 6px 0'}"></div>${hi > lo ? `<div class="b2" style="width:${(hi - lo) / hi * 100}%"></div>` : ''}</div>
        <span class="v">${esc(i.text || (lo === hi ? lo : lo + '–' + hi))}</span>${i.tag ? `<span class="tag tag-${esc(tagKey)}">${esc(i.tag)}</span>` : ''}</div></div>`;
      }).join('')}
        <div class="glegend"><span><i style="background:var(--blue)"></i>${esc(b.legendUsual || 'usual marks')}</span><span><i style="background:#a9c8f2"></i>${esc(b.legendUpto || 'can go up to')}</span></div>
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    case 'callout':
      return `<div class="callout tone-${esc(b.tone || 'blue')}">${gText(b.text)}</div>`;
    case 'text':
      return `<p class="foot" style="font-size:.92rem">${gText(b.text)}</p>`;
    case 'sections':
      return `<div class="secgrid">${(b.items || []).map(i => `<div class="secc c-${esc(i.color || 'blue')}">
        <div class="nm">${esc(i.name)}</div><div class="qq">${esc(i.qs)}</div><div class="fx">${esc(i.formula)}</div>
        <div class="small">${gText(i.desc)}</div><span class="tm">${esc(i.time)}</span></div>`).join('')}</div>`;
    case 'stackbar': {
      const items = b.items || [];
      const tot = items.reduce((s, i) => s + (Number(i.value) || 0), 0) || 1;
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="sbar">${items.map(i => `<div class="sg c-${esc(i.color || 'blue')}" style="flex:${Number(i.value) || 0}">${esc(i.label)}</div>`).join('')}</div>
        <div class="scap">${items.map(i => `<div style="flex:${Number(i.value) || 0}">${esc(i.caption || i.value)}</div>`).join('')}</div></div>`;
    }
    case 'clock': {
      const items = b.items || [];
      const segs = items.map(i => ({ ...i, d: Math.max(1, clockMin(i.end) - clockMin(i.start)) }));
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="clockt">${segs.map(s => `<div style="flex:${s.d}">${esc(s.start)}</div>`).join('')}<div style="flex:0 0 auto">${esc(segs.length ? segs[segs.length - 1].end : '')}</div></div>
        <div class="sbar">${segs.map(s => `<div class="sg c-${esc(s.color || 'blue')}" style="flex:${s.d}">${esc(s.label)}</div>`).join('')}</div>
        <div class="tiny muted">${segs.map(s => `${esc(s.label)} ${esc(s.start)}–${esc(s.end)}`).join(' · ')}</div></div>`;
    }
    case 'cards': {
      const cols = Number(b.columns) || 1;
      return `<div class="gcards ${cols === 3 ? 'three' : cols === 2 ? 'two' : ''}">${(b.items || []).map(i => `
        <div class="card gcard tone-${esc(i.tone || 'white')}"><h3>${esc(i.icon || '')} ${esc(i.title)}</h3>
        <ul>${(i.bullets || []).map(x => `<li>${gText(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    }
    case 'phases':
      return `<div class="phases">${(b.items || []).map(i => `<div class="phase c-${esc(i.color || 'blue')}">
        <div class="ph"><b>${esc(i.head)}</b> · ${esc(i.sub)}</div><div class="pb">${gText(i.text)}</div></div>`).join('')}</div>`;
    case 'columns': {
      const items = b.items || [];
      const max = Number(b.max) || Math.max(1, ...items.map(i => Number(i.value) || 0));
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="cols">${items.map(i => `<div class="cl">${Number(i.value) ? `<div class="cv">${esc(i.value)}</div>` : ''}<div class="cb" style="height:${(Number(i.value) || 0) / max * 82}%"></div></div>`).join('')}</div>
        <div class="colx">${items.map(i => `<div>${esc(i.label)}</div>`).join('')}</div>
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    default:
      return '';
  }
}

// ---------- TESTS LIST ----------
function testStatus(t, atts) {
  const mine = atts.filter(a => a.tid === t.id).sort((a, b) => a.n - b.n);
  const prog = lsGet(progKey(t.id, (mine.length ? mine[mine.length - 1].n : 0) + 1));
  if (prog) return '<span class="chip a">In progress</span>';
  if (!mine.length) return '<span class="chip n">Not attempted</span>';
  const f = mine[0];
  const pending = (f.items || []).some(i => i.type !== 'MCQ' && !(f.grades && f.grades[i.qid] != null));
  return `<span class="chip g">Done${mine.length > 1 ? ` ×${mine.length}` : ''}</span>${pending ? '<span class="chip p">Marking pending</span>' : ''}`;
}
async function sTestsView(force) {
  const pg = sShell('tests', 'Tests', spinner());
  try {

      <li>Your answers are saved on this phone as you go.</li>
      ${written ? `<li><b>${written} written question${written > 1 ? 's' : ''}:</b> solve on paper, type only your <b>final answer</b> (a number or one line). After submitting, send a photo of your working to your teacher on WhatsApp.</li>` : ''}
      <li>Solutions appear after you submit.</li>${mine.length ? '<li>Your <b>first attempt</b> is your official score. Later attempts are practice.</li>' : ''}</ul></div>
    ${mine.length ? `<div class="card"><h3>Your attempts</h3>${mine.map(a => `<div class="li" data-att="${esc(a.id)}"><div class="grow"><b>Attempt ${a.n}</b> ${a.n === 1 ? '<span class="chip g">Official</span>' : '<span class="chip n">Practice</span>'}<div class="small muted">${fmtDate(a.submittedAt)}</div></div><span class="btn sec sm">View</span></div>`).join('')}</div>` : ''}

// ---------- TEST RUNNER ----------
let runTimer = null;
function runTest(t, n) {
  const key = progKey(t.id, n);
  let st = lsGet(key);
  if (!st) {
    st = { tid: t.id, title: t.title, n, startedAt: now(), deadline: t.timer ? now() + t.timer * 60000 : null, responses: {}, review: [], visited: [], cur: 0 };
    lsSet(key, st);
  }
  const items = t.items || [];
  const save = () => lsSet(key, st);
  S.view = 'runner';
  let submitting = false;

  function status(i) {
    const q = items[i].qid, r = st.responses[q];
    const answered = r && (r.o != null || (r.t && r.t.trim()));
    const rev = st.review.includes(q);
    if (rev) return answered ? 'revans' : 'rev';
    if (answered) return 'ans';
    if (st.visited.includes(q)) return 'skip';
    return '';
  }
  function counts() { const c = { ans: 0, skip: 0, rev: 0, nv: 0 }; items.forEach((_, i) => { const s = status(i); if (s === 'ans' || s === 'revans') c.ans++; if (s === 'rev' || s === 'revans') c.rev++; if (!s) c.nv++; if (s === 'skip' || s === 'rev') c.skip++; }); return c; }

  function render() {
    const i = st.cur, it = items[i];
    if (!st.visited.includes(it.qid)) { st.visited.push(it.qid); save(); }
    const r = st.responses[it.qid] || {};
    const order = it.type === 'MCQ' ? optionOrder(S.sid, t.id, it.qid, (it.options || []).length) : null;
    $('#app').innerHTML = `<div class="runner"><div class="runhead">
      <button class="iconbtn" id="rx">${ICON.back}</button>
      <div class="grow" style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</div><div style="font-size:.75rem;opacity:.85">Question ${i + 1} of ${items.length}</div></div>
      ${st.deadline ? `<div class="timer" id="tm">--:--</div>` : ''}
      <button class="iconbtn" id="pal">${ICON.grid}</button></div>
      <div class="runbody">
        <div class="chips" style="margin-bottom:10px"><span class="chip">Section ${TYPE_SECTION[it.type] || ''}</span><span class="chip n">${TYPE_NAME[it.type]}</span><span class="chip n">${it.marks} mark${it.marks > 1 ? 's' : ''}</span>${st.review.includes(it.qid) ? '<span class="chip p">Marked for review</span>' : ''}</div>
        <div class="card">${questionHtml(it, { order, chosen: r.o })}
        ${it.type !== 'MCQ' ? `<label class="field" style="margin-top:12px"><span>Your final answer (a number or one line)</span>
          <input class="input" id="wa" maxlength="200" value="${esc(r.t || '')}" placeholder="e.g. 2520 cm, or x = 2, y = 3"></label>
          <p class="tiny muted" style="margin:0">Write the full working on paper. You'll send a photo of it to your teacher after submitting.</p>` : ''}
        </div>
        ${it.type === 'MCQ' && r.o != null ? '<div class="center"><button class="btn ghost sm" id="clr">Clear my answer</button></div>' : ''}
      </div>
      <div class="runfoot"><div class="in">
        <div class="row"><button class="btn sec" id="prev" ${i === 0 ? 'disabled' : ''}>‹ Prev</button>
        <button class="btn sec" id="rev">${st.review.includes(it.qid) ? 'Unmark' : 'Mark for review'}</button>
        ${i < items.length - 1 ? `<button class="btn" id="next">Next ›</button>` : `<button class="btn green" id="sub">Submit</button>`}</div>
      </div></div></div>`;
    fillImages($('#app'));
    $$('[data-opt]').forEach(b => b.onclick = () => { st.responses[it.qid] = { o: Number(b.dataset.opt) }; save(); render(); });
    const wa = $('#wa'); if (wa) wa.oninput = () => { st.responses[it.qid] = { t: wa.value.slice(0, 200) }; save(); };
    if ($('#clr')) $('#clr').onclick = () => { delete st.responses[it.qid]; save(); render(); };
    $('#prev').onclick = () => { st.cur = Math.max(0, i - 1); save(); render(); };
    if ($('#next')) $('#next').onclick = () => { st.cur = i + 1; save(); render(); };
    if ($('#sub')) $('#sub').onclick = () => askSubmit();
    $('#rev').onclick = () => { const k = st.review.indexOf(it.qid); if (k >= 0) st.review.splice(k, 1); else st.review.push(it.qid); save(); render(); };
    $('#pal').onclick = openPalette;
    $('#rx').onclick = async () => { if (await confirmBox('Leave the test?', 'Your answers stay saved on this phone and you can resume from the Tests page.' + (st.deadline ? ' The timer keeps running.' : ''), 'Leave')) { stopTimer(); S.view = 'tests'; sTestsView(); } };
    tick();
  }
  function openPalette() {
    const c = counts();
    modal(`<h3>All questions</h3>
      <div class="legend"><span><i style="background:var(--green)"></i>Answered ${c.ans}</span><span><i style="background:#fde3d6"></i>Not answered ${c.skip}</span><span><i style="background:var(--purple)"></i>For review ${c.rev}</span><span><i style="background:#eceef4"></i>Not seen ${c.nv}</span></div>
      <div class="palette">${items.map((it, k) => `<button class="pal ${status(k)} ${k === st.cur ? 'cur' : ''}" data-j="${k}">${k + 1}</button>`).join('')}</div>
      <div class="sp"></div><button class="btn green block" id="psub">Submit test</button>`,
      (m, close) => {
        $$('[data-j]', m).forEach(b => b.onclick = () => { st.cur = Number(b.dataset.j); save(); close(); render(); });
        $('#psub', m).onclick = () => { close(); askSubmit(); };
      });
  }
  async function askSubmit() {
    const c = counts();
    const ok = await confirmBox('Submit test?', `Answered: <b>${c.ans}</b> of ${items.length}${c.rev ? ` · Marked for review: <b>${c.rev}</b>` : ''}${items.length - c.ans ? `<br>Unanswered questions get 0.` : ''}<br>You can't change answers after submitting.`, 'Submit');
    if (ok) submit(false);
  }
  async function submit(auto) {
    if (submitting) return; submitting = true; stopTimer();
    $('#app').innerHTML = `<div class="runner"><div class="runbody center">${spinner()}<p>${auto ? "Time's up! " : ''}Submitting your answers…</p></div></div>`;
    const att = clean({
      sid: S.sid, uid: S.user.uid, tid: t.id, n, title: t.title, kind: t.kind || 'custom',
      startedAt: st.startedAt, submittedAt: now(), timeTaken: Math.round((now() - st.startedAt) / 1000), autoSubmitted: !!auto,
      items: items.map(it => ({ qid: it.qid, type: it.type, marks: it.marks, chapter: it.chapter })),
      responses: Object.fromEntries(Object.entries(st.responses).filter(([, v]) => v.o != null || (v.t && v.t.trim())).map(([k, v]) => [k, v.o != null ? { o: v.o } : { t: v.t.trim() }])),
      review: st.review
    });
    try {
      await setDoc(D(`attempts/${S.sid}_${t.id}_${n}`), att);
      lsDel(key); SC.attempts = undefined;
      toast('Submitted!');
      showResult({ id: `${S.sid}_${t.id}_${n}`, ...att }, t);
    } catch (e) {
      submitting = false; console.error(e);
      $('#app').innerHTML = `<div class="runner"><div class="runbody"><div class="card"><h3>Could not submit</h3><p class="muted">${esc(errMsg(e))}</p>
        <p class="small">Your answers are still saved on this phone. Check your internet and try again.</p><button class="btn block" id="retry">Try again</button></div></div></div>`;
      $('#retry').onclick = () => submit(auto);
    }
  }
  function tick() {
    stopTimer();
    if (!st.deadline) return;
    const upd = () => {
      const left = Math.round((st.deadline - now()) / 1000);
      const el = $('#tm'); if (el) { el.textContent = fmtDur(left); el.classList.toggle('low', left <= 300); }
      if (left <= 0) submit(true);
    };
    upd(); runTimer = setInterval(upd, 1000);
  }
  if (st.deadline && st.deadline <= now()) return submit(true);
  render();
}
function stopTimer() { if (runTimer) { clearInterval(runTimer); runTimer = null; } }

// ---------- RESULT ----------
async function showResult(att, test) {
  stopTimer();
  const pg = sShell('tests', test ? test.title : att.title, spinner(), { back: () => openTestIntro(att.tid), sub: `Attempt ${att.n}${att.n === 1 ? ' · official' : ' · practice'}` });
  let keyDoc = null;
  try { keyDoc = await getD('testKeys/' + att.tid); } catch (e) { console.warn(e); }
  const key = keyDoc ? keyDoc.items : {};
  const t = test || await getD('tests/' + att.tid).catch(() => null);
  const itemById = {}; ((t && t.items) || []).forEach(i => itemById[i.qid] = i);
  const sc = scoreAttempt(att, key);
  const wa = (S.settings.whatsapp || '').replace(/\D/g, '');
  const waText = encodeURIComponent(`Hello, this is ${S.profile.name || S.sid} (ID: ${S.sid}). My working for "${att.title}" (attempt ${att.n}) is attached.`);
  pg.innerHTML = `<div class="scorehero">
      <div><div class="sv">${fmtNum(sc.mcq)}/${sc.mcqMax}</div><div class="sl">MCQ score (${sc.correct} right, ${sc.wrong} wrong, ${sc.blank} blank)</div></div>
      ${sc.writtenCount ? `<div><div class="sv">${sc.pending ? '⏳' : fmtNum(sc.wr) + '/' + sc.wrMax}</div><div class="sl">${sc.pending ? `Written: ${sc.pending} awaiting teacher's marks` : 'Written questions'}</div></div>` : ''}
      ${!sc.pending ? `<div><div class="sv">${fmtNum(sc.total)}/${sc.max}</div><div class="sl">Total · ${pct(sc.total, sc.max)}%</div></div>` : ''}
      <div><div class="sv" style="font-size:1.2rem">${fmtDur(att.timeTaken || 0)}</div><div class="sl">Time taken${att.autoSubmitted ? ' (auto-submitted)' : ''}</div></div></div>
    ${sc.writtenCount && sc.pending ? `<div class="card" style="margin-top:12px"><h3>Send your working</h3><p class="small muted" style="margin:0 0 10px">Take clear photos of your written answers and send them to your teacher on WhatsApp. Your teacher will add the marks here.</p>
      ${wa ? `<a class="btn wa block" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${waText}">${ICON.wa} Send on WhatsApp</a>` : '<p class="small">Ask your teacher for their WhatsApp number.</p>'}</div>` : ''}
    ${!keyDoc ? '<div class="card" style="margin-top:12px">Solutions are not available for this test.</div>' : ''}
    <div class="chips" style="margin:16px 0 4px" id="flt"><button class="toggle on" data-f="all">All</button><button class="toggle" data-f="wrong">Wrong</button><button class="toggle" data-f="blank">Unanswered</button>${sc.writtenCount ? '<button class="toggle" data-f="written">Written</button>' : ''}</div>
    <div id="rqs"></div>`;
  const rows = (att.items || []).map((ai, idx) => {
    const it = itemById[ai.qid]; const k = key[ai.qid] || {}; const resp = (att.responses || {})[ai.qid];
    let cls = 'all', badge = '';
    if (ai.type === 'MCQ') {
      if (!resp || resp.o == null) { cls += ' blank'; badge = '<span class="chip n">Not answered · 0</span>'; }
      else if (resp.o === k.answer) badge = `<span class="chip g">Correct · +${ai.marks}</span>`;
      else { cls += ' wrong'; badge = '<span class="chip r">Wrong · 0</span>'; }
    } else {
      cls += ' written'; if (!resp) cls += ' blank';
      const g = att.grades ? att.grades[ai.qid] : undefined;
      badge = g == null ? `<span class="chip p">Teacher to mark · ${ai.marks}</span>` : `<span class="chip ${g >= ai.marks ? 'g' : g > 0 ? 'a' : 'r'}">${fmtNum(g)}/${ai.marks}</span>`;
    }
    const order = ai.type === 'MCQ' && it && it.options ? optionOrder(S.sid, att.tid, ai.qid, it.options.length) : null;
    const sol = (k.solution || []).map(b => (b.x && order) ? { ...b, x: remapOptionLetters(b.x, order) } : b);
    return `<div class="rq ${cls}"><div class="hd"><b>Q${idx + 1}</b><span class="chip n">${TYPE_NAME[ai.type]}</span>${badge}</div>
      ${it ? questionHtml(it, { order, chosen: resp && resp.o, reveal: true, answer: k.answer }) : '<p class="muted">Question text unavailable.</p>'}
      ${ai.type !== 'MCQ' ? `<div class="mine"><span class="muted small">Your final answer:</span><br>${resp && resp.t ? esc(resp.t) : '<i class="muted">(blank)</i>'}</div>
        ${k.finalAnswer ? `<div class="ansbox">${inlineRich(k.finalAnswer)}</div>` : ''}` : ''}
      ${sol.length ? `<details class="sol"><summary>Show full solution ▾</summary><div class="solbody qtext">${renderBlocks(sol)}</div></details>` : ''}</div>`;
  });
  const box = $('#rqs'); box.innerHTML = rows.join('');
  fillImages(box);
  $$('[data-f]', pg).forEach(b => b.onclick = () => {
    $$('[data-f]', pg).forEach(x => x.classList.toggle('on', x === b));
    $$('.rq', box).forEach(r => r.classList.toggle('hidden', !r.classList.contains(b.dataset.f)));
  });
  $$('details.sol', box).forEach(d => d.addEventListener('toggle', () => { if (d.open) fillImages(d); }));
}

const aQ = f => aLoad('q', async () => { const m = {}; (await listC('questions')).forEach(q => m[q.id] = q); return m; }, f);

// Admin saves are split into small batches so each stays inside Firestore's rules lookup limit.
async function commitOps(ops, size = 15) {
  for (let i = 0; i < ops.length; i += size) {
    const b = writeBatch(db);
    ops.slice(i, i + size).forEach(([k, p, d]) => k === 'delete' ? b.delete(D(p)) : k === 'update' ? b.update(D(p), d) : b.set(D(p), d));
    await b.commit();
  }
}
function qSort(a, b) { return TYPES.indexOf(a.type) - TYPES.indexOf(b.type) || a.chapter - b.chapter || (a.num || 0) - (b.num || 0) || String(a.id).localeCompare(b.id); }

async function guard(pg, fn) { try { await fn(); } catch (e) { console.error(e); pg.innerHTML = `<div class="card"><h3>Something went wrong</h3><p class="muted">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">Reload</button></div>`; } }

// ---------- official attempt helpers ----------
function officialAttempts(atts) { return atts.filter(a => a.n === 1); }
function pendingCount(a) { return (a.items || []).filter(i => i.type !== 'MCQ' && !(a.grades && a.grades[i.qid] != null)).length; }

// ---------- DASHBOARD ----------

        <button class="kpi" data-go="anns"><b>📣</b><span>Announcements</span></button>
        <button class="kpi" data-go="resources"><b>📄</b><span>Resources</span></button>
        <button class="kpi" data-go="guide"><b>📘</b><span>Exam Guide</span></button>

      <div class="field"><span>Avatar</span><div class="row">
        <label class="row" style="cursor:pointer"><input type="radio" name="g" value="m" ${s.gender !== 'f' ? 'checked' : ''}><div class="avatar">${avatarSvg('m')}</div> Male</label>
        <label class="row" style="cursor:pointer;margin-left:14px"><input type="radio" name="g" value="f" ${s.gender === 'f' ? 'checked' : ''}><div class="avatar">${avatarSvg('f')}</div> Female</label></div></div>
      <div class="grid2"><label class="field"><span>Mobile number</span><input class="input" id="fmob" inputmode="tel" value="${esc(s.mobile || '')}"></label>
      <label class="field"><span>Email</span><input class="input" id="fem" inputmode="email" value="${esc(s.email || '')}"></label></div>
      <label class="field"><span>School name</span><input class="input" id="fsch" value="${esc(s.school || '')}"></label>
      <label class="field"><span>Address</span><textarea class="input" id="fadd" style="min-height:70px">${esc(s.address || '')}</textarea></label>
      <div id="ferr"></div><button class="btn block" id="fsave">${isNew ? 'Create student' : 'Save changes'}</button></div>`,
    { back: () => isNew ? aStudentsView() : aStudentDetail(s.id) });
  $('#fsave').onclick = () => busy($('#fsave'), async () => {
    const err = m => $('#ferr').innerHTML = `<div class="err">${esc(m)}</div>`;
    const data = { name: $('#fname').value.trim(), gender: $('input[name=g]:checked').value, mobile: $('#fmob').value.trim(), email: $('#fem').value.trim(), school: $('#fsch').value.trim(), address: $('#fadd').value.trim(), updatedAt: now() };
    if (!data.name) return err('Enter the student’s name.');
    if (!isNew) { await updateDoc(D('students/' + s.id), data); AC.students = undefined; toast('Saved'); return aStudentDetail(s.id); }

    if (!/^[a-z0-9][a-z0-9._-]{1,29}$/.test(sid)) return err('ID: 2–30 letters or numbers (dots, dashes and _ allowed), no spaces.');
    if (pw.length < 6) return err('Password must be at least 6 characters.');
    if (S.adminDoc.loginId === sid) return err('That ID is your admin ID. Choose another.');

    catch (e) { if (e.code !== 'auth/email-already-in-use') throw e; email = `${sid}.${now().toString(36)}@${LOGIN_DOMAIN}`; uid = await createLogin(email, pw); }
    await commitOps([['set', 'students/' + sid, clean({ ...data, uid, createdAt: now() })], ['set', 'users/' + uid, { role: 'student', sid }], ['set', 'logins/' + sid, { email }]]);

async function aStudentDetail(sid) {
  const pg = aShell('students', 'Student', spinner(), { back: () => aStudentsView() });
  guard(pg, async () => {
    const [studs, atts, keys] = await Promise.all([aStudents(), aAtts(), aKeys()]);
    const s = studs.find(x => x.id === sid) || await getD('students/' + sid);
    if (!s) { pg.innerHTML = '<div class="card empty">Student not found.</div>'; return; }
    const mine = atts.filter(a => a.sid === sid).sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
    const perCh = {};
    officialAttempts(mine).forEach(a => { const r = scoreAttempt(a, keys[a.tid]); for (const [c, v] of Object.entries(r.perCh)) { perCh[c] = perCh[c] || { got: 0, max: 0 }; perCh[c].got += v.got; perCh[c].max += v.max; } });
    const row = (l, v) => `<div><div class="tiny muted">${l}</div><div>${esc(v || '–')}</div></div>`;
    pg.innerHTML = `<div class="card"><div class="row"><div class="avatar lg">${avatarSvg(s.gender)}</div><div class="grow"><h2 style="margin:0">${esc(s.name)}</h2><div class="muted">ID: ${esc(s.id)}</div></div></div>
      <div class="grid2" style="margin-top:12px">${row('School', s.school)}${row('Mobile', s.mobile)}${row('Email', s.email)}${row('Address', s.address)}</div>
      <div class="row wrap" style="margin-top:14px"><button class="btn sec sm" id="ed">Edit</button><button class="btn sec sm" id="rp">Reset password</button><button class="btn danger sm" id="del">Delete</button></div></div>
      <div class="sectiontitle">Chapter-wise performance (official attempts)</div>
      <div class="card">${Object.keys(perCh).length ? CHAPTERS.slice(1).map((n, i) => { const v = perCh[i + 1]; if (!v || !v.max) return ''; const p = pct(v.got, v.max);
        return `<div style="margin:8px 0"><div class="row small"><span class="grow">${i + 1}. ${esc(n)}</span><b>${p}%</b><span class="muted">${fmtNum(v.got)}/${v.max}</span></div><div class="bar"><div style="width:${p}%;background:${p >= 75 ? 'var(--green)' : p >= 50 ? 'var(--amber)' : 'var(--red)'}"></div></div></div>`; }).join('')
        : '<div class="empty">No marked attempts yet.</div>'}</div>
      <div class="sectiontitle">Attempts</div>
      <div class="card" style="padding:4px 14px">${mine.length ? mine.map(a => { const r = scoreAttempt(a, keys[a.tid]);
        return `<div class="li" data-att="${esc(a.id)}"><div class="grow"><div class="t">${esc(a.title)}</div><div class="small muted">Attempt ${a.n}${a.n === 1 ? ' (official)' : ' (practice)'} · ${fmtDate(a.submittedAt)}</div></div>
        <div class="right"><b>${fmtNum(r.total)}/${r.max}</b>${r.pending ? `<div class="tiny" style="color:var(--purple)">${r.pending} to mark</div>` : ''}</div></div>`; }).join('') : '<div class="empty">No attempts yet.</div>'}</div>`;
    $('#ed').onclick = () => aStudentForm(s);
    $('#rp').onclick = () => resetStudentPassword(s);
    $('#del').onclick = () => deleteStudent(s);
    $$('[data-att]', pg).forEach(el => el.onclick = () => aAttempt(el.dataset.att, () => aStudentDetail(sid)));
  });
}
function resetStudentPassword(s) {
  modal(`<h3>Reset password for ${esc(s.name)}</h3><p class="small muted">The student signs in with the same ID (<b>${esc(s.id)}</b>) and this new password. Their results are kept.</p>
    <label class="field"><span>New password (min 6)</span><input class="input" id="npw"></label><div id="rerr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn sec" data-c>Cancel</button><button class="btn" id="rgo">Reset</button></div>`, (m, close) => {
    m.querySelector('[data-c]').onclick = close;
    m.querySelector('#rgo').onclick = () => busy(m.querySelector('#rgo'), async () => {
      const pw = m.querySelector('#npw').value;
      if (pw.length < 6) { m.querySelector('#rerr').innerHTML = '<div class="err">At least 6 characters.</div>'; return; }
      // Firebase does not let one user change another user's password from a web page,
      // so we create a fresh login for the same student ID and retire the old one.
      const email = `${s.id}.${now().toString(36)}@${LOGIN_DOMAIN}`;
      const uid = await createLogin(email, pw);
      const ops = [];
      if (s.uid) ops.push(['delete', 'users/' + s.uid]);
      ops.push(['set', 'users/' + uid, { role: 'student', sid: s.id }], ['update', 'students/' + s.id, { uid, updatedAt: now() }], ['set', 'logins/' + s.id, { email }]);
      await commitOps(ops);
      AC.students = undefined; close();
      modal(`<h3>Password reset ✓</h3><div class="card flat" style="background:var(--sblue)">ID: <b>${esc(s.id)}</b><br>New password: <b>${esc(pw)}</b></div><button class="btn block" data-c>Done</button>`, (m2, c2) => m2.querySelector('[data-c]').onclick = c2);
    });
  });
}
async function deleteStudent(s) {
  if (!(await confirmBox(`Delete ${s.name}?`, 'They will no longer be able to sign in. Their past results stay in your exports and backups.', 'Delete', true))) return;
  await busy(null, async () => {
    const inbox = await listC(`students/${s.id}/inbox`).catch(() => []);
    const ops = [['delete', 'students/' + s.id], ['delete', 'logins/' + s.id], ['delete', `students/${s.id}/private/seen`]];
    if (s.uid) ops.push(['delete', 'users/' + s.uid]);
    inbox.forEach(x => ops.push(['delete', `students/${s.id}/inbox/${x.id}`]));
    await commitOps(ops); AC.students = undefined; toast('Student deleted'); aStudentsView();
  });
}

// ---------- ATTEMPT VIEW + MARKING ----------
async function aAttempt(aid, back) {
  const pg = aShell('marking', 'Attempt', spinner(), { back: back || (() => aMarking()) });
  guard(pg, async () => {
    const [atts, keys, tests, studs] = await Promise.all([aAtts(), aKeys(), aTests(), aStudents()]);
    const a = atts.find(x => x.id === aid) || await getD('attempts/' + aid);
    const key = keys[a.tid] || {}; const t = tests.find(x => x.id === a.tid); const s = studs.find(x => x.id === a.sid);
    const itemById = {}; ((t && t.items) || []).forEach(i => itemById[i.qid] = i);
    const grades = { ...(a.grades || {}) };
    const draw = () => {
      const r = scoreAttempt({ ...a, grades }, key);
      pg.innerHTML = `<div class="card"><div class="row"><div class="avatar">${avatarSvg(s && s.gender)}</div><div class="grow"><b>${esc(s ? s.name : a.sid)}</b> <span class="muted small">(${esc(a.sid)})</span>
        <div class="small muted">${esc(a.title)} · attempt ${a.n}${a.n === 1 ? ' (official)' : ' (practice)'} · ${fmtDate(a.submittedAt)} · ${fmtDur(a.timeTaken || 0)}${a.autoSubmitted ? ' · auto-submitted' : ''}</div></div></div>
        <div class="chips" style="margin-top:10px"><span class="chip">MCQ ${fmtNum(r.mcq)}/${r.mcqMax}</span>${r.writtenCount ? `<span class="chip ${r.pending ? 'p' : 'g'}">Written ${fmtNum(r.wr)}/${r.wrMax}${r.pending ? ` · ${r.pending} to mark` : ''}</span>` : ''}<span class="chip g">Total ${fmtNum(r.total)}/${r.max}${r.pending ? ' so far' : ''}</span></div></div>
        ${r.writtenCount ? `<div class="info small">Enter marks for each written question (from the photos the student sends you on WhatsApp), then tap <b>Save marks</b>.</div>` : ''}
        <div id="qs">${(a.items || []).map((ai, idx) => {
          const it = itemById[ai.qid]; const k = key[ai.qid] || {}; const resp = (a.responses || {})[ai.qid];
          if (ai.type === 'MCQ') {
            const ok = resp && resp.o === k.answer;
            return `<div class="rq"><div class="hd"><b>Q${idx + 1}</b><span class="chip n">MCQ · ${ai.marks}</span>${!resp ? '<span class="chip n">Not answered</span>' : ok ? '<span class="chip g">Correct</span>' : '<span class="chip r">Wrong</span>'}</div>
              <details class="sol"><summary>Show question ▾</summary>${it ? questionHtml(it, { chosen: resp && resp.o, reveal: true, answer: k.answer }) : ''}</details></div>`;
          }
          const g = grades[ai.qid];
          return `<div class="rq"><div class="hd"><b>Q${idx + 1}</b><span class="chip n">${TYPE_NAME[ai.type]} · ${ai.marks} marks</span>${g == null ? '<span class="chip p">To mark</span>' : `<span class="chip g">${fmtNum(g)}/${ai.marks}</span>`}</div>
            <details class="sol"><summary>Show question ▾</summary>${it ? questionHtml(it) : ''}</details>
            <div class="mine"><span class="muted small">Student's final answer:</span><br>${resp && resp.t ? esc(resp.t) : '<i class="muted">(blank)</i>'}</div>
            ${k.finalAnswer ? `<div class="ansbox">${inlineRich(k.finalAnswer)}</div>` : ''}
            <details class="sol"><summary>Model solution ▾</summary><div class="solbody qtext">${renderBlocks(k.solution)}</div></details>
            <div class="gradebox"><span class="small">Marks:</span><input class="input" type="number" min="0" max="${ai.marks}" step="0.5" data-g="${esc(ai.qid)}" value="${g == null ? '' : g}" placeholder="0–${ai.marks}">
              <span class="muted">/ ${ai.marks}</span><button class="btn sec sm" data-full="${esc(ai.qid)}" data-m="${ai.marks}">Full</button><button class="btn sec sm" data-zero="${esc(ai.qid)}">0</button></div></div>`;
        }).join('')}</div>
        ${r.writtenCount ? '<div class="sp"></div><button class="btn block" id="save">Save marks</button>' : ''}`;
      fillImages(pg);
      $$('details.sol', pg).forEach(d => d.addEventListener('toggle', () => { if (d.open) fillImages(d); }));
      $$('[data-g]', pg).forEach(inp => inp.oninput = () => { const v = inp.value === '' ? null : Math.max(0, Math.min(Number(inp.max), Number(inp.value))); if (v == null) delete grades[inp.dataset.g]; else grades[inp.dataset.g] = v; });
      $$('[data-full]', pg).forEach(b => b.onclick = () => { grades[b.dataset.full] = Number(b.dataset.m); draw(); });
      $$('[data-zero]', pg).forEach(b => b.onclick = () => { grades[b.dataset.zero] = 0; draw(); });
      if ($('#save')) $('#save').onclick = () => busy($('#save'), async () => {
        const done = (a.items || []).filter(i => i.type !== 'MCQ').every(i => grades[i.qid] != null);
        await updateDoc(D('attempts/' + a.id), { grades, gradedAt: now(), graded: done });
        a.grades = { ...grades }; a.graded = done; toast(done ? 'Marks saved ✓' : 'Saved (some questions still unmarked)'); draw();
      });
    };
    draw();
  });
}
async function aMarking() {
  const pg = aShell('marking', 'Marking', spinner());
  guard(pg, async () => {
    const [atts, studs] = await Promise.all([aAtts(true), aStudents()]);
    const list = officialAttempts(atts).filter(a => pendingCount(a) > 0).sort((a, b) => (a.submittedAt || 0) - (b.submittedAt || 0));
    pg.innerHTML = `<p class="muted small">First (official) attempts that still have written questions to mark. Practice attempts don't need marking.</p>

              return `<td class="num" style="background:${p >= 75 ? '#e3f6ec' : p >= 50 ? '#fdf3d8' : '#fde6e6'}">${p}%</td>`; }).join('')}<td class="num"><b>${M ? pct(G, M) + '%' : '–'}</b></td></tr>`; }).join('')}</table>`;
      }

        <span class="grow"></span><button class="btn sm" id="x1">⬇ Export results (CSV)</button><button class="btn sec sm" id="x2">⬇ Chapter-wise (CSV)</button></div>
        <p class="tiny muted">Official (first) attempts only. * = written questions not yet marked. Tap a score to open the attempt. CSV files open in Excel and Google Sheets.</p>
        <div class="tblwrap">${studs.length ? table : '<div class="empty">No students yet.</div>'}</div>`;
      $$('[data-m]', pg).forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
      $$('[data-att]', pg).forEach(c => c.onclick = () => aAttempt(c.dataset.att, () => aResults()));
      $('#x1').onclick = () => exportResults(atts, keys, studs);
      $('#x2').onclick = () => exportChapterwise(off, keys, studs);
    };
    draw();
  });
}
function chapterWise(atts, keys) {
  const out = {};
  atts.forEach(a => { const r = scoreAttempt(a, keys[a.tid]); for (const [c, v] of Object.entries(r.perCh)) { out[c] = out[c] || { got: 0, max: 0 }; out[c].got += v.got; out[c].max += v.max; } });
  return out;
}
function stamp() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function exportResults(atts, keys, studs) {
  const rows = [['Student ID', 'Name', 'School', 'Test', 'Attempt', 'Official', 'Submitted', 'Time (min)', 'MCQ score', 'MCQ max', 'Written score', 'Written max', 'Written status', 'Total', 'Max', 'Percent']];
  atts.slice().sort((a, b) => String(a.sid).localeCompare(b.sid) || (a.submittedAt || 0) - (b.submittedAt || 0)).forEach(a => {
    const s = studs.find(x => x.id === a.sid) || {}; const r = scoreAttempt(a, keys[a.tid]);
    rows.push([a.sid, s.name || '(deleted)', s.school || '', a.title, a.n, a.n === 1 ? 'Yes' : 'No', fmtDate(a.submittedAt), Math.round((a.timeTaken || 0) / 60),
      r.mcq, r.mcqMax, r.writtenCount ? r.wr : '', r.writtenCount ? r.wrMax : '', r.writtenCount ? (r.pending ? `${r.pending} to mark` : 'Marked') : '', r.total, r.max, pct(r.total, r.max)]);
  });
  download(`results-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Results exported');
}
function exportChapterwise(off, keys, studs) {
  const rows = [['Student ID', 'Name', ...CHAPTERS.slice(1).map((n, i) => `Ch ${i + 1} ${n} (%)`), 'Overall (%)']];
  studs.forEach(s => { const pc = chapterWise(off.filter(a => a.sid === s.id), keys); let G = 0, M = 0;
    rows.push([s.id, s.name, ...CHAPTERS.slice(1).map((_, i) => { const v = pc[i + 1]; if (!v || !v.max) return ''; G += v.got; M += v.max; return pct(v.got, v.max); }), M ? pct(G, M) : '']); });
  download(`chapterwise-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Chapter-wise exported');
}

// ---------- TESTS ----------
function buildTestDocs(t, qmap) {
  const tm = { ...TYPE_MARKS, ...(t.typeMarks || {}) };
  const qids = t.qids.filter(id => qmap[id]);
  const items = qids.map(id => { const q = qmap[id]; return { qid: id, chapter: q.chapter, type: q.type, marks: Number(tm[q.type] ?? q.marks), stem: q.stem || [], options: q.options || null, parts: q.parts || null }; });
  const key = {}; qids.forEach(id => { const q = qmap[id]; key[id] = { answer: q.answer ?? null, solution: q.solution || [], finalAnswer: q.finalAnswer || '' }; });
  return {
    test: clean({ title: t.title, kind: t.kind || 'custom', chapter: t.chapter ?? null, timer: Number(t.timer) || 0, order: t.order ?? 500, typeMarks: tm,
      qids, items, count: items.length, totalMarks: items.reduce((s, i) => s + i.marks, 0), published: t.published !== false, updatedAt: now() }),
    key: clean({ items: key, updatedAt: now() })
  };
}
async function saveTests(list) {     // list of test definitions with ids
  const qmap = await aQ();
  const ops = [];
  list.forEach(t => { const { test, key } = buildTestDocs(t, qmap); ops.push(['set', 'tests/' + t.id, test], ['set', 'testKeys/' + t.id, key]); });
  await commitOps(ops, 8);
  AC.tests = undefined; AC.keys = undefined;
}

async function importBank(file) {

  if (!data || data.format !== 'maths-by-ssk-question-bank') return toast('This is not a question bank file.');
  const existing = await aQ();
  const clash = data.questions.filter(q => existing[q.id]).length;
  if (!(await confirmBox('Import question bank?', `${data.questions.length} questions, ${Object.keys(data.images || {}).length} figures and ${(data.tests || []).length} tests.${clash ? `<br><b>${clash} questions with the same IDs will be replaced</b> by the file's version.` : ''}`, 'Import'))) return;
  const close = modal(`<h3>Importing…</h3><p class="muted" id="ipr">Starting</p>${spinner()}<p class="tiny muted">Keep this page open.</p>`);
  const say = t => { const el = $('#ipr'); if (el) el.textContent = t; };
  try {
    const imgs = Object.entries(data.images || {});
    for (let i = 0; i < imgs.length; i += 6) {
      await commitOps(imgs.slice(i, i + 6).map(([id, src]) => ['set', 'images/' + id, { data: src }]));
      say(`Figures ${Math.min(i + 6, imgs.length)}/${imgs.length}`);
    }
    for (let i = 0; i < data.questions.length; i += 15) {
      await commitOps(data.questions.slice(i, i + 15).map(q => { const { id, ...rest } = q; return ['set', 'questions/' + id, clean({ ...rest, updatedAt: now() })]; }));
      say(`Questions ${Math.min(i + 15, data.questions.length)}/${data.questions.length}`);
    }
    AC.q = undefined; await aQ(true);
    say('Tests…');
    await saveTests((data.tests || []).map(t => ({ ...t, published: true })));
    close();
    modal(`<h3>Import complete ✓</h3><p>${data.questions.length} questions and ${(data.tests || []).length} tests are ready. Students can see the tests now.</p><p class="small muted">Keep question-bank.json safe on your computer. Don't upload it to your website: it contains the answers.</p><button class="btn block" data-c>OK</button>`, (m, c) => m.querySelector('[data-c]').onclick = () => { c(); aQuestionsView(); });
  } catch (e) { close(); console.error(e); toast('Import stopped: ' + errMsg(e), 6000); }
}
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const scale = Math.min(1, 900 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  let out = c.toDataURL('image/png');
  if (out.length > 350000) out = c.toDataURL('image/jpeg', 0.82);
  if (out.length > 700000) out = c.toDataURL('image/jpeg', 0.6);
  return out;
}

// targeted announcements are copied into each chosen student's private inbox, so other students can't read them
async function saveAnnouncement(id, data, old) {
  const all = await aAnns(true);
  const ops = [];
  if (data.pinned) all.filter(x => x.pinned && x.id !== id).forEach(x => {
    ops.push(['update', 'announcements/' + x.id, { pinned: false }]);
    (x.audience === 'all' ? [] : x.targets || []).forEach(s => ops.push(['set', `students/${s}/inbox/${x.id}`, clean({ ...x, id: undefined, targets: [], pinned: false })]));
  });
  ops.push(['set', 'announcements/' + id, data]);
  const oldT = old && old.audience !== 'all' ? old.targets || [] : [];
  const newT = data.audience === 'all' ? [] : data.targets;
  oldT.filter(s => !newT.includes(s)).forEach(s => ops.push(['delete', `students/${s}/inbox/${id}`]));
  newT.forEach(s => ops.push(['set', `students/${s}/inbox/${id}`, { ...data, targets: [] }]));   // copy without other students' IDs
  await commitOps(ops); AC.anns = undefined;
}
async function removeAnnouncement(a) {
  await commitOps([['delete', 'announcements/' + a.id], ...(a.audience === 'all' ? [] : a.targets || []).map(s => ['delete', `students/${s}/inbox/${a.id}`])]);
  AC.anns = undefined;
}

const GLABEL = { badge: 'Badge text', footer: 'Footer', parts: 'Parts', tab: 'Tab name', title: 'Title', blocks: 'Blocks', items: 'Items', big: 'Big text', small: 'Small text', text: 'Text',
  label: 'Label', sub: 'Sub-label', value: 'Value', footnote: 'Footnote', max: 'Scale maximum', low: 'Usual marks', high: 'Can go up to', tag: 'Tag (High / Medium / Easy marks)',
  legendUsual: 'Legend: usual', legendUpto: 'Legend: up to', name: 'Name', qs: 'Question numbers', formula: 'Formula', desc: 'Description', time: 'Time per question', caption: 'Caption',
  start: 'Start time', end: 'End time', icon: 'Emoji', bullets: 'Bullet points', tone: 'Colour', color: 'Colour', head: 'Heading', columns: 'Columns (1–3)' };
const COLORS = ['blue', 'orange', 'green', 'amber', 'pink', 'gray', 'purple'], TONES = ['white', 'gray', 'green', 'blue', 'orange', 'lavender', 'yellow'];
const BLOCKNAME = { stats: 'Number cards', notes: 'Notes', bars: 'Bar chart', rangebars: 'Range bar chart', callout: 'Highlighted box', text: 'Small text', sections: 'Section cards', stackbar: 'Split bar', clock: 'Exam-day clock', cards: 'Bullet cards', phases: 'Week cards', columns: 'Column chart' };
function getPath(o, p) { return p.reduce((a, k) => a[k], o); }
function setPath(o, p, v) { const last = p[p.length - 1]; getPath(o, p.slice(0, -1))[last] = v; }
function blankLike(x) { if (Array.isArray(x)) return x.length && typeof x[0] === 'string' ? [''] : []; if (x && typeof x === 'object') { const r = {}; for (const [k, v] of Object.entries(x)) r[k] = k === 'type' || k === 'color' || k === 'tone' ? v : blankLike(v); return r; } return typeof x === 'number' ? 0 : ''; }
function jf(v, path, key) {
  const P = esc(JSON.stringify(path));
  if (Array.isArray(v)) {
    return `<fieldset><legend>${esc(GLABEL[key] || key)}</legend>${v.map((x, i) => `<div class="arritem">${jf(x, [...path, i], key === 'bullets' ? 'Bullet' : '')}
      <div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-up='${esc(JSON.stringify([...path, i]))}'>↑</button><button class="btn ghost sm" data-del='${esc(JSON.stringify([...path, i]))}'>Remove</button></div></div>`).join('')}
      ${v.length ? `<button class="btn sec sm" data-add='${P}'>+ Add</button>` : ''}</fieldset>`;
  }
  if (v && typeof v === 'object') {
    return `${v.type ? `<div class="chip" style="margin:4px 0 8px">${esc(BLOCKNAME[v.type] || v.type)}</div>` : ''}${Object.entries(v).filter(([k]) => k !== 'type').map(([k, x]) => jf(x, [...path, k], k)).join('')}`;
  }
  const label = GLABEL[key] || key;
  if (key === 'color' || key === 'tone') return `<label class="field"><span>${esc(label)}</span><select class="input" data-p='${P}'>${(key === 'color' ? COLORS : TONES).map(c => `<option ${c === v ? 'selected' : ''}>${c}</option>`).join('')}</select></label>`;
  if (typeof v === 'number') return `<label class="field"><span>${esc(label)}</span><input class="input" type="number" step="any" data-p='${P}' data-num="1" value="${v}"></label>`;
  return `<label class="field">${label ? `<span>${esc(label)}</span>` : ''}${String(v).length > 60 ? `<textarea class="input" data-p='${P}' style="min-height:80px">${esc(v)}</textarea>` : `<input class="input" data-p='${P}' value="${esc(v)}">`}</label>`;
}

        <span class="grow"></span><button class="btn ghost sm" id="greset">Reset to original</button><button class="btn sm" id="gsave">Save</button></div>
        ${mode === 'view' ? renderGuidePart(G, part) : `<div class="card jf">${jf(G.badge, ['badge'], 'badge')}${jf(G.footer, ['footer'], 'footer')}</div>
        <div class="card jf">${jf(G.parts[part].tab, ['parts', part, 'tab'], 'tab')}${jf(G.parts[part].title, ['parts', part, 'title'], 'title')}
        ${G.parts[part].blocks.map((b, bi) => `<fieldset><legend>Block ${bi + 1}</legend>${jf(b, ['parts', part, 'blocks', bi], '')}</fieldset>`).join('')}</div>`}`;
      $$('[data-g]', pg).forEach(b => b.onclick = () => { part = Number(b.dataset.g); draw(); });
      $$('[data-md]', pg).forEach(b => b.onclick = () => { mode = b.dataset.md; draw(); });
      $$('[data-p]', pg).forEach(i => i.addEventListener(i.tagName === 'SELECT' ? 'change' : 'input', () => setPath(G, JSON.parse(i.dataset.p), i.dataset.num ? Number(i.value) : i.value)));
      $$('[data-del]', pg).forEach(b => b.onclick = () => { const p = JSON.parse(b.dataset.del); getPath(G, p.slice(0, -1)).splice(p[p.length - 1], 1); draw(); });
      $$('[data-up]', pg).forEach(b => b.onclick = () => { const p = JSON.parse(b.dataset.up); const arr = getPath(G, p.slice(0, -1)), i = p[p.length - 1]; if (i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; draw(); });
      $$('[data-add]', pg).forEach(b => b.onclick = () => { const arr = getPath(G, JSON.parse(b.dataset.add)); arr.push(blankLike(arr[arr.length - 1])); draw(); });
      $('#gsave').onclick = () => busy($('#gsave'), async () => { await setDoc(D('content/examGuide'), { json: JSON.stringify(G), updatedAt: now() }); toast('Exam Guide saved ✓'); });
      $('#greset').onclick = async () => { if (await confirmBox('Reset to original?', 'This replaces your edits with the content from your 4 infographics. Tap Save afterwards to keep it.', 'Reset')) { Object.assign(G, JSON.parse(JSON.stringify(GUIDE_DEFAULT))); draw(); } };
    };
    draw();
  });
}

// ---------- SETTINGS ----------
async function aSettings() {
  const pg = aShell('settings', 'Settings & backup', '');
  pg.innerHTML = `<div class="card"><h3>WhatsApp number</h3><p class="small muted">Students see a “Send on WhatsApp” button after a test with written questions. Use country code + number, e.g. 919876543210.</p>
      <div class="row"><input class="input grow" id="wa" inputmode="tel" value="${esc(S.settings.whatsapp || '')}" placeholder="91XXXXXXXXXX"><button class="btn" id="wasave">Save</button></div></div>
    <div class="card"><h3>Exports (open in Excel)</h3><p class="small muted">Backups are not available on the free Firebase plan, so download these regularly.</p>
      <div class="row wrap"><button class="btn" id="ex1">⬇ Results (CSV)</button><button class="btn sec" id="ex2">⬇ Chapter-wise (CSV)</button><button class="btn sec" id="ex3">⬇ Full backup (JSON)</button></div></div>
    <div class="card"><h3>Your admin login</h3><p class="small">Admin ID: <b>${esc(S.adminDoc.loginId || '')}</b></p><button class="btn sec" id="cpw">Change password</button></div>
    <button class="btn danger block" id="so">${ICON.out} Sign out</button>`;
  $('#wasave').onclick = () => busy($('#wasave'), async () => { const v = $('#wa').value.replace(/\D/g, ''); await setDoc(D('config/settings'), { ...S.settings, whatsapp: v, updatedAt: now() }); S.settings.whatsapp = v; toast('Saved'); });
  $('#ex1').onclick = () => busy($('#ex1'), async () => { const [atts, keys, studs] = await Promise.all([aAtts(true), aKeys(), aStudents()]); exportResults(atts, keys, studs); });
  $('#ex2').onclick = () => busy($('#ex2'), async () => { const [atts, keys, studs] = await Promise.all([aAtts(true), aKeys(), aStudents()]); exportChapterwise(officialAttempts(atts), keys, studs); });
  $('#ex3').onclick = () => busy($('#ex3'), async () => {
    const names = ['questions', 'tests', 'testKeys', 'students', 'attempts', 'resources', 'announcements', 'images', 'content', 'config'];
    const out = { app: APP_NAME, exportedAt: new Date().toISOString() };
    for (const n of names) out[n] = await listC(n);
    download(`maths-by-ssk-backup-${stamp()}.json`, JSON.stringify(out), 'application/json'); toast('Backup downloaded');
  });
  $('#cpw').onclick = changeOwnPassword;
  $('#so').onclick = doSignOut;
}

</script>
