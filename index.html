<style>
:root{
  --ink:#1b1f3b; --ink2:#3b4160; --muted:#6b7183; --bg:#f4f5fb; --card:#fff; --line:#e4e7f0;
  --brand1:#1e3a8a; --brand2:#4338ca; --accent:#fbbf24;
  --blue:#2b7bd6; --orange:#e8693a; --green:#1cb07a; --amber:#eba200; --pink:#e87aa4; --gray:#c9c7c1; --purple:#7c3aed;
  --sblue:#eef2fd; --sgreen:#e5f5ec; --sgray:#f2f2ef; --sorange:#fdf3ea; --slav:#f1effd; --syellow:#fdf8e4; --sred:#fdeaea;
  --red:#d93a3a; --ok:#14935f;
  --r:16px; --shadow:0 1px 2px rgba(20,24,60,.06),0 4px 14px rgba(20,24,60,.06);
  --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
h1,h2,h3,h4{font-family:var(--head);margin:0 0 .4em;line-height:1.25}
h2{font-size:1.25rem} h3{font-size:1.05rem}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.center{text-align:center} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.sp{height:12px}

/* ---------- app shell ---------- */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--brand1),var(--brand2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(30,40,120,.25)}
.topbar h1{font-size:1.08rem;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:.75rem;opacity:.85}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.page{max-width:860px;margin:0 auto;padding:16px 14px 110px}
.page.wide{max-width:1180px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 0;cursor:pointer}
.bottomnav button svg{width:23px;height:23px}
.bottomnav button.on{color:var(--brand2);font-weight:600}

/* ---------- cards & controls ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid #edf0f6}
.card+.card{margin-top:12px}
.card.flat{box-shadow:none}
.card h3{margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--brand2);color:#fff;font-size:.95rem;min-height:44px;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.btn.sec{background:#eef0fb;color:var(--brand2)}
.btn.ghost{background:transparent;color:var(--brand2);padding:8px 10px}
.btn.danger{background:#fde8e8;color:var(--red)}
.btn.green{background:var(--green)}
.btn.wa{background:#25d366;color:#08331a}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;color:var(--ink2)}
.input,select.input,textarea.input{width:100%;border:1.5px solid #d9dceb;border-radius:12px;padding:11px 12px;background:#fff;font-size:1rem;outline:none}
.input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(67,56,202,.12)}
textarea.input{min-height:110px;resize:vertical;line-height:1.45}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#eef0fb;color:var(--brand2);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.g{background:var(--sgreen);color:var(--ok)} .chip.r{background:var(--sred);color:var(--red)} .chip.a{background:var(--syellow);color:#8a5a00} .chip.p{background:var(--slav);color:var(--purple)} .chip.n{background:#f0f1f5;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toggle{border:1.5px solid #d9dceb;background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.toggle.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.sectiontitle{font-family:var(--head);font-weight:600;font-size:1rem;margin:22px 4px 10px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;border:1px solid #edf0f6;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi b{display:block;font-family:var(--head);font-size:1.5rem;color:var(--brand2)}
.kpi span{font-size:.85rem;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden}
.avatar svg{width:100%;height:100%}
.avatar.lg{width:72px;height:72px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:600;background:#fafbfe;position:sticky;top:0}
.tblwrap{overflow:auto;max-width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}

/* ---------- toast / modal / loading ---------- */

.modal{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}

.spinner{width:34px;height:34px;border:4px solid #dfe2f2;border-top-color:var(--brand2);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
.loginwrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;background:linear-gradient(160deg,var(--brand1),var(--brand2) 60%,#5b4de0)}
.logincard{background:#fff;border-radius:22px;padding:24px 20px;max-width:420px;width:100%;margin:0 auto;box-shadow:0 18px 50px rgba(10,10,60,.35)}
.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brandmark .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--brand1),var(--brand2));display:grid;place-items:center;color:var(--accent);font-family:var(--head);font-weight:700;font-size:1.35rem}
.pill{display:inline-block;background:var(--accent);color:#1d2140;border-radius:999px;padding:3px 12px;font-family:var(--head);font-weight:700;font-size:.72rem;letter-spacing:.02em}
.err{background:var(--sred);color:#9b1c1c;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
.info{background:var(--sblue);color:#1e3a8a;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}

/* ---------- maths content ---------- */
.qtext{font-size:1.02rem;line-height:1.6;overflow-wrap:anywhere}
.qtext p{margin:0 0 .55em}
.qtext .katex{font-size:1.04em}
.qtext .katex .mfrac{margin:0 .08em}
.qtext .katex-display{margin:.3em 0}
.qimg{display:block;max-width:min(100%,360px);height:auto;margin:8px auto;border-radius:8px;background:#fff}
.qimgph{display:block;width:240px;height:140px;margin:8px auto;border-radius:8px;background:#f0f1f6}
.dtable{border-collapse:collapse;margin:8px 0;font-size:.9rem;display:block;overflow-x:auto;max-width:100%}
.dtable td{border:1px solid #cfd3e3;padding:5px 9px;text-align:center;white-space:nowrap}
.dtable tr:first-child td{background:#eef1fb;font-weight:600}
.ansbox{background:var(--sgreen);border-left:4px solid var(--green);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600;color:#0d5c3d}
.parts{margin:6px 0 0;padding:0;list-style:none}
.parts li{margin:4px 0}
.parts .pm{color:var(--muted);font-size:.85rem;white-space:nowrap}

/* ---------- test runner ---------- */
.runner{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.runhead{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--brand1),var(--brand2));color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.timer{font-family:var(--head);font-weight:700;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.timer.low{background:#fde2e2;color:var(--red)}
.runbody{flex:1;padding:14px 12px 150px;max-width:760px;margin:0 auto;width:100%}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid #e1e4ef;border-radius:14px;padding:12px 12px;margin:9px 0;cursor:pointer;font-size:1rem}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #c8cce0;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--ink2)}
.opt.sel{border-color:var(--brand2);background:#f3f2ff}
.opt.sel .L{background:var(--brand2);border-color:var(--brand2);color:#fff}
.opt.right{border-color:var(--green);background:var(--sgreen)} .opt.right .L{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--sred)} .opt.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.opt .ot{flex:1;padding-top:3px;overflow-wrap:anywhere}
.runfoot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.runfoot .in{max-width:760px;margin:0 auto}
.runfoot .row{gap:8px}
.runfoot .btn{flex:1;padding:10px 8px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pal{height:46px;border-radius:12px;border:2px solid transparent;font-weight:700;cursor:pointer;background:#eceef4;color:var(--ink2);position:relative}
.pal.ans{background:var(--green);color:#fff}
.pal.skip{background:#fde3d6;color:#b4471d}
.pal.rev{background:var(--purple);color:#fff}
.pal.revans{background:var(--purple);color:#fff}
.pal.revans::after{content:'';position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#6ee7b7}
.pal.cur{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:5px;vertical-align:-2px}

/* ---------- results ---------- */
.scorehero{background:linear-gradient(120deg,var(--brand1),var(--brand2));color:#fff;border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.scorehero .sv{font-family:var(--head);font-size:1.6rem;font-weight:700}
.scorehero .sl{font-size:.8rem;opacity:.85}
.rq{background:#fff;border-radius:16px;padding:14px;border:1px solid #edf0f6;margin:10px 0}
.rq .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
details.sol summary{cursor:pointer;color:var(--brand2);font-weight:600;padding:6px 0;list-style:none}

details.sol[open] summary{margin-bottom:6px}
.solbody{border-top:1px dashed var(--line);padding-top:8px}
.solbody p{margin:0 0 .45em}
.mine{background:#f7f7fb;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.95rem}

/* ---------- announcements ---------- */
.ann{background:#fff;border-radius:14px;border:1px solid #edf0f6;padding:12px 14px;margin:8px 0;cursor:pointer}
.ann.pin{border:2px solid var(--accent);background:#fffcf0}
.ann .at{font-weight:700;display:flex;gap:8px;align-items:center}
.ann .ab{white-space:pre-wrap;margin-top:6px;color:var(--ink2)}
.newdot{background:var(--red);color:#fff;border-radius:999px;font-size:.68rem;padding:2px 8px;font-weight:700}

/* ---------- hero (student home) ---------- */
.hero{background:linear-gradient(120deg,var(--brand1),var(--brand2));color:#fff;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}

/* ---------- exam guide ---------- */
.gtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.gtabs button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:#fff;border:1.5px solid #dfe2f0;font-weight:600;font-size:.85rem;cursor:pointer}
.gtabs button.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.gbanner{background:linear-gradient(110deg,#25388f,#4338ca);color:#fff;border-radius:20px;padding:16px 16px 18px;position:relative;margin-bottom:12px}
.gbanner .pg{position:absolute;right:16px;top:14px;font-family:var(--head);font-weight:700;font-size:1.4rem}
.gbanner h2{color:#fff;font-size:1.45rem;margin:10px 0 0}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gstats .s{background:var(--sblue);border-radius:16px;padding:12px;text-align:center}
.gstats .s:last-child:nth-child(odd){grid-column:1/-1}
.gstats b{display:block;font-family:var(--head);color:#2c35a0;font-size:1.45rem}
.gstats span{color:var(--ink2);font-size:.88rem}
.gnotes{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){.gnotes{grid-template-columns:1fr 2fr}.gstats{grid-template-columns:repeat(5,1fr)}.gstats .s:last-child:nth-child(odd){grid-column:auto}}
.gnote{border-radius:16px;padding:12px 14px}
.gnote b{font-family:var(--head);display:block;margin-bottom:2px}
.tone-gray{background:var(--sgray)} .tone-green{background:var(--sgreen)} .tone-blue{background:var(--sblue);border:1.5px solid #c8d6f6}
.tone-orange{background:var(--sorange);border:1.5px solid #f6cfa8} .tone-lavender{background:var(--slav);border:1.5px solid #d6cff6} .tone-yellow{background:var(--syellow);border:1.5px solid #f3e3a1} .tone-white{background:#fff;border:1.5px solid #e6e8f0}
.gcard{border-radius:18px;padding:14px;margin-top:12px}

.hbar{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px;align-items:center;margin:9px 0}
.hbar .lb{font-weight:600;font-size:.92rem;line-height:1.2}
.hbar .lb small{display:block;color:var(--muted);font-weight:400;font-size:.76rem}
.hbar .tr{position:relative;height:24px;display:flex;align-items:center;gap:6px}
.hbar .b1{height:22px;background:var(--blue);border-radius:0 6px 6px 0}
.hbar .b2{height:22px;background:#a9c8f2;border-radius:0 6px 6px 0}
.hbar .v{font-weight:700;font-size:.88rem;white-space:nowrap}
.tag{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag-High{background:#fde3e3;color:#b42323} .tag-Medium{background:#dff3e7;color:#18794e} .tag-Easy{background:#fdf1d3;color:#8a5a00}
.glegend{display:flex;gap:14px;font-size:.85rem;margin-top:8px;flex-wrap:wrap}
.glegend i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.foot{color:var(--muted);font-size:.84rem;margin-top:6px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.secc{background:#fff;border:1.5px solid #e6e8f0;border-radius:16px;padding:12px;border-top-width:6px}
.secc .nm{font-family:var(--head);font-weight:700}
.secc .qq{color:var(--muted);font-size:.85rem}
.secc .fx{font-family:var(--head);font-weight:700;font-size:1.6rem;margin:2px 0}
.secc .tm{display:inline-block;background:#f2f2f5;border-radius:8px;padding:2px 8px;font-weight:700;font-size:.85rem;margin-top:6px}
.c-blue{--c:var(--blue)} .c-orange{--c:var(--orange)} .c-green{--c:var(--green)} .c-amber{--c:var(--amber)} .c-pink{--c:var(--pink)} .c-gray{--c:var(--gray)} .c-purple{--c:var(--purple)}
.secc{border-top-color:var(--c)}
.sbar{display:flex;gap:3px;margin:8px 0 2px}
.sbar .sg{background:var(--c);color:#1d2140;border-radius:8px;height:40px;display:grid;place-items:center;font-weight:700;font-size:.85rem;min-width:22px}

.scap{display:flex;gap:3px}

.clockt{display:flex;gap:3px;font-size:.66rem;color:var(--muted);margin-top:8px}
.phase{border-radius:16px;overflow:hidden;border:1.5px solid #e6e8f0;background:#fff}
.phase .ph{background:var(--c);color:#14183a;padding:8px 12px;font-weight:600}
.phase .ph b{font-family:var(--head)}

.phases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.phases{grid-template-columns:repeat(4,1fr)}}
.gcards{display:grid;gap:10px;margin-top:12px}

.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 4px 0;border-bottom:1.5px solid #d7dbe8}

/* ---------- admin ---------- */

.iconbtn{position:relative}
.iconbtn.dot::after{top:4px;left:auto;right:4px;border-color:var(--brand2)}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:#e5484d;color:#fff;font-size:.72rem;font-weight:700;text-align:center;margin-left:auto}

.chat{display:flex;flex-direction:column;gap:6px}

.daysep{align-self:center;font-size:.72rem;color:var(--muted);background:#eceef4;border-radius:999px;padding:2px 10px;margin:8px 0 4px}
.chatbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:8px 10px}
.chatbar.admin{padding-bottom:calc(8px + env(safe-area-inset-bottom))}

.fgrid{display:flex;flex-direction:column;gap:8px}

.fcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand2);border-radius:12px;padding:10px 12px;overflow-x:auto;line-height:1.6}
.fcard .dtable{margin:0}
.rsum{margin:0;padding-left:20px;line-height:1.6}

// ================= RICH TEXT + MATHS =================
function tex(t, display = false) {
  // \displaystyle keeps fractions full-size inside sentences, which reads better on small phones
  if (window.katex) { try { return window.katex.renderToString('\\displaystyle ' + t, { throwOnError: false, displayMode: display }); } catch { } }
  return `<code>${esc(t)}</code>`;
}
function inlineRich(s) {
  const parts = String(s ?? '').split(/(\$[^$]+\$)/g);
  return parts.map(p => {
    if (p.length > 2 && p.startsWith('$') && p.endsWith('$')) return tex(p.slice(1, -1));
    return esc(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  }).join('');
}
function renderBlocks(blocks) {
  return (blocks || []).map(b => {
    if (b.t === 'p') return `<p>${inlineRich(b.x)}</p>`;
    if (b.t === 'h') return `<h4 class="bh">${inlineRich(b.x)}</h4>`;
    if (b.t === 'ans') return `<div class="ansbox">${inlineRich(b.x)}</div>`;
    if (b.t === 'img') return `<img class="qimg qimgph" data-img="${esc(b.id)}" alt="Figure">`;
    if (b.t === 'table') return `<table class="dtable">${(b.rows || []).map(r => `<tr>${(r.c || []).map(c => `<td>${inlineRich(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    return '';
  }).join('');
}
// text format used in the admin editor  <->  blocks
function blocksToText(blocks) {
  return (blocks || []).map(b => {
    if (b.t === 'p') return b.x;
    if (b.t === 'h') return '# ' + b.x;
    if (b.t === 'ans') return '>> ' + b.x;
    if (b.t === 'img') return `[img:${b.id}]`;
    if (b.t === 'table') return (b.rows || []).map(r => '| ' + (r.c || []).join(' | ') + ' |').join('\n');
    return '';
  }).join('\n');
}
function textToBlocks(text) {
  const out = []; let table = null;
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    if (line.startsWith('|')) {
      const cells = line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      if (!table) { table = { t: 'table', rows: [] }; out.push(table); }
      table.rows.push({ c: cells }); continue;
    }
    table = null;
    if (!line) continue;
    const m = line.match(/^\[img:([A-Za-z0-9_-]+)\]$/);
    if (m) out.push({ t: 'img', id: m[1] });
    else if (line.startsWith('>>')) out.push({ t: 'ans', x: line.replace(/^>>\s*/, '') });
    else if (/^#\s+\S/.test(line)) out.push({ t: 'h', x: line.replace(/^#\s+/, '') });
    else out.push({ t: 'p', x: line });
  }
  return out;
}
function plainText(blocks, n = 140) {
  const s = (blocks || []).filter(b => b.t === 'p').map(b => b.x).join(' ').replace(/\$([^$]+)\$/g, '$1').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '($1)/($2)').replace(/\\[a-zA-Z]+/g, '').replace(/[{}*]/g, '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

}

// test items snapshot lives in the attempt; key = testKeys/{tid}.items (MCQ answers only)
function scoreAttempt(att, key) {
  const r = { mcq: 0, mcqMax: 0, wr: 0, wrMax: 0, pending: 0, writtenCount: 0, perCh: {}, correct: 0, wrong: 0, blank: 0 };
  for (const it of att.items || []) {
    const ch = it.chapter; r.perCh[ch] = r.perCh[ch] || { got: 0, max: 0 };
    if (it.type === 'MCQ') {
      r.mcqMax += it.marks;
      const resp = att.responses && att.responses[it.qid];
      const ans = key && key[it.qid] ? key[it.qid].answer : null;
      if (!resp || resp.o == null) r.blank++;
      else if (resp.o === ans) { r.mcq += it.marks; r.correct++; } else r.wrong++;
      if (ans != null) { r.perCh[ch].max += it.marks; if (resp && resp.o === ans) r.perCh[ch].got += it.marks; }
    } else {
      r.wrMax += it.marks; r.writtenCount++;
      const g = att.grades ? att.grades[it.qid] : undefined;
      if (g == null) r.pending++; else { r.wr += Number(g); r.perCh[ch].got += Number(g); r.perCh[ch].max += it.marks; }
    }
  }
  r.total = r.mcq + r.wr; r.max = r.mcqMax + r.wrMax;
  return r;
}
function optionOrder(sid, tid, qid, n) { return shuffled([...Array(n).keys()], hashStr(`${sid}|${tid}|${qid}`)); }
// options of Assertion–Reason questions (and ones whose solution names options by letter) keep their order
function optOrder(it, sid, tid) { const n = (it && it.options || []).length; return it && it.fixed ? [...Array(n).keys()] : optionOrder(sid, tid, it.qid, n); }
const FIXED_HINT = /assertion\s*\(a\)|reason\s*\(r\)|both\s*\(?[a-d]\)?\s*and\s*\(?[a-d]\)?|none of (these|the above)|all of (these|the above)|neither\s*\(?[a-d]\)?\s*nor/i;
function looksFixed(q) { return [blocksToText(q.stem || []), ...(q.options || [])].some(t => FIXED_HINT.test(String(t || ''))); }

// ---------- YouTube links -> video id (watch?v=, youtu.be/, shorts/, live/, embed/), or a playlist ----------
function ytParse(url) {
  let u; try { u = new URL(String(url || '').trim()); } catch { return null; }
  const host = u.hostname.replace(/^(www\.|m\.|music\.)/, '');
  if (!['youtube.com', 'youtu.be', 'youtube-nocookie.com'].includes(host)) return null;
  const okId = s => /^[A-Za-z0-9_-]{11}$/.test(s || '') ? s : null;
  let id = null;
  if (host === 'youtu.be') id = okId(u.pathname.split('/')[1]);
  else if (u.searchParams.get('v')) id = okId(u.searchParams.get('v'));
  else { const m = u.pathname.match(/^\/(shorts|live|embed|v)\/([^/?#]+)/); if (m) id = okId(m[2]); }
  const t = u.searchParams.get('t') || u.searchParams.get('start') || '';
  const tm = String(t).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
  const start = tm ? (Number(tm[1] || 0) * 3600 + Number(tm[2] || 0) * 60 + Number(tm[3] || 0)) : 0;
  const list = u.searchParams.get('list');
  if (id) return { id, start };
  if (list && /^[A-Za-z0-9_-]{10,64}$/.test(list)) return { list };
  return null;
}
function ytEmbedUrl(p) {
  if (!p) return '';
  if (p.list && !p.id) return `https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(p.list)}`;
  return `https://www.youtube-nocookie.com/embed/${p.id}?rel=0&modestbranding=1${p.start ? '&start=' + p.start : ''}`;
}
const isVideoRes = r => String(r.type || '').toLowerCase() === 'video' || !!ytParse(r.link);
function videoPlayerHtml(v) {
  const p = ytParse(v.link);
  if (!p) return `<a class="btn sec block" target="_blank" rel="noopener" href="${esc(v.link)}">${ICON.play} ${esc(v.title || 'Watch the video')}</a>`;

function remapOptionLetters(text, order) {    // "Option (c)" in solution text -> the letter this student saw
  return String(text).replace(/([Oo]ption )\(([a-d])\)/g, (m, w, L) => { const orig = 'abcd'.indexOf(L); const pos = order.indexOf(orig); return pos >= 0 ? `${w}(${'abcd'[pos]})` : m; });

// ================= QUESTION VIEW (used by runner, results, admin preview) =================
function questionHtml(item, opts = {}) {
  const { order, chosen, reveal, answer, showParts = true, locked } = opts;
  let h = `<div class="qtext">${renderBlocks(item.stem)}</div>`;
  if (item.parts && item.parts.length && showParts) {
    h += `<ul class="parts qtext">${item.parts.map(p => `<li>(${esc(p.label)}) ${inlineRich(p.x)} <span class="pm">[${esc(p.marks)}]</span></li>`).join('')}</ul>`;
  }
  if (item.type === 'MCQ' && item.options) {
    const ord = order || item.options.map((_, i) => i);
    h += ord.map((orig, pos) => {
      let cls = 'opt';
      if (reveal) { if (orig === answer) cls += ' right'; else if (orig === chosen) cls += ' wrong'; }
      else if (orig === chosen) cls += ' sel';
      return `<button class="${cls}" data-opt="${orig}" ${reveal || locked ? 'disabled' : ''}><span class="L">${'abcd'[pos]}</span><span class="ot qtext">${inlineRich(item.options[orig])}</span></button>`;
    }).join('');
  }
  return h;
}

// ================= EXAM GUIDE: renderer =================
function gText(s) { return inlineRich(s || ''); }

function clockMin(t) {
  const [h, m] = String(t).split(':').map(Number);
  const hh = h < 8 ? h + 12 : h;
  return hh * 60 + (m || 0);
}

function renderGuideBlock(b) {
  switch (b.type) {
    case 'stats':
      return `<div class="gstats">${(b.items || []).map(i => `<div class="s"><b>${esc(i.big)}</b><span>${esc(i.small)}</span></div>`).join('')}</div>`;
    case 'notes':
      return `<div class="gnotes">${(b.items || []).map(i => `<div class="gnote tone-${esc(i.tone || 'gray')}"><b>${esc(i.title)}</b>${gText(i.text)}</div>`).join('')}</div>`;
    case 'bars': {
      const max = Number(b.max) || Math.max(...(b.items || []).map(i => Number(i.value) || 0), 1);
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>${(b.items || []).map(i => `
        <div class="hbar"><div class="lb">${esc(i.label)}<small>${esc(i.sub || '')}</small></div>
        <div class="tr"><div class="b1" style="width:${Math.min(100, (Number(i.value) || 0) / max * 85)}%"></div><span class="v">${esc(i.value)}</span></div></div>`).join('')}
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    case 'rangebars': {
      const max = Number(b.max) || 10;
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>${(b.items || []).map(i => {
        const lo = Number(i.low) || 0, hi = Math.max(Number(i.high) || 0, lo);
        const tagKey = String(i.tag || '').split(' ')[0];
        return `<div class="hbar"><div class="lb">${esc(i.label)}</div>
        <div class="tr"><div style="display:flex;width:${hi / max * 70}%"><div class="b1" style="width:${hi ? lo / hi * 100 : 0}%;border-radius:${hi > lo ? '0' : '0 6px 6px 0'}"></div>${hi > lo ? `<div class="b2" style="width:${(hi - lo) / hi * 100}%"></div>` : ''}</div>
        <span class="v">${esc(i.text || (lo === hi ? lo : lo + '–' + hi))}</span>${i.tag ? `<span class="tag tag-${esc(tagKey)}">${esc(i.tag)}</span>` : ''}</div></div>`;
      }).join('')}
        <div class="glegend"><span><i style="background:var(--blue)"></i>${esc(b.legendUsual || 'usual marks')}</span><span><i style="background:#a9c8f2"></i>${esc(b.legendUpto || 'can go up to')}</span></div>
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    case 'callout':
      return `<div class="callout tone-${esc(b.tone || 'blue')}">${gText(b.text)}</div>`;
    case 'text':
      return `<p class="foot" style="font-size:.92rem">${gText(b.text)}</p>`;
    case 'sections':
      return `<div class="secgrid">${(b.items || []).map(i => `<div class="secc c-${esc(i.color || 'blue')}">
        <div class="nm">${esc(i.name)}</div><div class="qq">${esc(i.qs)}</div><div class="fx">${esc(i.formula)}</div>
        <div class="small">${gText(i.desc)}</div><span class="tm">${esc(i.time)}</span></div>`).join('')}</div>`;
    case 'stackbar': {
      const items = b.items || [];
      const tot = items.reduce((s, i) => s + (Number(i.value) || 0), 0) || 1;
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="sbar">${items.map(i => `<div class="sg c-${esc(i.color || 'blue')}" style="flex:${Number(i.value) || 0}">${esc(i.label)}</div>`).join('')}</div>
        <div class="scap">${items.map(i => `<div style="flex:${Number(i.value) || 0}">${esc(i.caption || i.value)}</div>`).join('')}</div></div>`;
    }
    case 'clock': {
      const items = b.items || [];
      const segs = items.map(i => ({ ...i, d: Math.max(1, clockMin(i.end) - clockMin(i.start)) }));
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="clockt">${segs.map(s => `<div style="flex:${s.d}">${esc(s.start)}</div>`).join('')}<div style="flex:0 0 auto">${esc(segs.length ? segs[segs.length - 1].end : '')}</div></div>
        <div class="sbar">${segs.map(s => `<div class="sg c-${esc(s.color || 'blue')}" style="flex:${s.d}">${esc(s.label)}</div>`).join('')}</div>
        <div class="tiny muted">${segs.map(s => `${esc(s.label)} ${esc(s.start)}–${esc(s.end)}`).join(' · ')}</div></div>`;
    }
    case 'cards': {
      const cols = Number(b.columns) || 1;
      return `<div class="gcards ${cols === 3 ? 'three' : cols === 2 ? 'two' : ''}">${(b.items || []).map(i => `
        <div class="card gcard tone-${esc(i.tone || 'white')}"><h3>${esc(i.icon || '')} ${esc(i.title)}</h3>
        <ul>${(i.bullets || []).map(x => `<li>${gText(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    }
    case 'phases':
      return `<div class="phases">${(b.items || []).map(i => `<div class="phase c-${esc(i.color || 'blue')}">
        <div class="ph"><b>${esc(i.head)}</b> · ${esc(i.sub)}</div><div class="pb">${gText(i.text)}</div></div>`).join('')}</div>`;
    case 'columns': {
      const items = b.items || [];
      const max = Number(b.max) || Math.max(1, ...items.map(i => Number(i.value) || 0));
      return `<div class="card gcard tone-white"><h3>${esc(b.title)}</h3>
        <div class="cols">${items.map(i => `<div class="cl">${Number(i.value) ? `<div class="cv">${esc(i.value)}</div>` : ''}<div class="cb" style="height:${(Number(i.value) || 0) / max * 82}%"></div></div>`).join('')}</div>
        <div class="colx">${items.map(i => `<div>${esc(i.label)}</div>`).join('')}</div>
        ${b.footnote ? `<div class="foot">${gText(b.footnote)}</div>` : ''}</div>`;
    }
    default:
      return '';
  }
}

function renderGuidePart(g, idx) {
  const p = g.parts[idx];
  const n = g.parts.length;
  return `<div class="gbanner"><span class="pill">${esc(g.badge)}</span><span class="pg">${idx + 1}/${n}</span><h2>${esc(p.title)}</h2></div>
    ${(p.blocks || []).map(renderGuideBlock).join('')}
    <p class="center tiny muted" style="margin-top:18px">${esc(g.footer)} · Part ${idx + 1} of ${n}</p>`;
}

const SC = {};   // student cache
async function sLoad(key, fn, force = false) { if (!force && SC[key] !== undefined) return SC[key]; SC[key] = await fn(); return SC[key]; }
const myGrade = () => gradeOf(S.profile);
const sortTests = list => list.sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || String(a.title).localeCompare(b.title));
const sTests = (f) => sLoad('tests', async () => {
  let list = await listC('tests', where('grade', '==', myGrade()));
  if (!list.length && myGrade() === 10) list = (await listC('tests', where('published', '==', true))).filter(t => t.grade == null);   // data from before classes existed
  return sortTests(list.filter(t => t.published !== false));
}, f);
const sAttempts = (f) => sLoad('attempts', () => listC('attempts', where('sid', '==', S.sid)), f);
const sSeen = (f) => sLoad('seen', async () => ((await getD(`students/${S.sid}/private/seen`)) || {}).ids || [], f);
async function sAnnouncements(force) {
  return sLoad('ann', async () => {
    const [pub, cls, mine] = await Promise.all([
      listC('announcements', where('audience', '==', 'all')),
      listC('announcements', where('audience', '==', 'g' + myGrade())).catch(() => []),
      listC(`students/${S.sid}/inbox`).catch(() => [])]);
    const all = [...pub, ...cls, ...mine];
    return all.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0));
  }, force);
}
// Exam Guide per class: content/guide_g{N}; Class 10 falls back to the original guide.
async function getGuide(g) {
  try { const d = await getD('content/guide_g' + g); if (d && d.json) return JSON.parse(d.json); } catch (e) { console.warn(e); }
  if (Number(g) === 10) {
    try { const d = await getD('content/examGuide'); if (d && d.json) return JSON.parse(d.json); } catch (e) { console.warn(e); }
    return GUIDE_DEFAULT;
  }
  return null;
}

}
const sRev = f => sLoad('rev', () => loadRevision(myGrade()), f);
const sRes = f => sLoad('res', async () => (await listC('resources')).filter(r => gradeOf(r) === myGrade()), f);
const sFiles = res => res.filter(r => !isVideoRes(r));

const sPractice = f => sLoad('practice', async () => { try { return (await listC('practice', where('sid', '==', S.sid))).sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0)); } catch (e) { console.warn('practice', e && e.code); return []; } }, f);

const practiceOn = () => S.settings && S.settings.practiceOn === true;
// reminders still to do: a test not yet taken, or a profile not saved since the reminder
function activeReminders(rems, tests, atts) {
  const out = {};
  for (const r of rems) {
    if (r.kind === 'test') {
      const t = tests.find(x => x.id === r.tid);
      if (!t || atts.some(a => a.tid === r.tid)) continue;
      const k = 't_' + r.tid; if (!out[k] || (out[k].createdAt || 0) < (r.createdAt || 0)) out[k] = { ...r, test: t };
    } else if (r.kind === 'profile') {
      if ((S.profile.selfUpdatedAt || 0) >= (r.createdAt || 0)) continue;
      if (!out.p || (out.p.createdAt || 0) < (r.createdAt || 0)) out.p = r;
    }
  }
  return Object.values(out).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}
function dueHtml(due) {
  if (!due) return '';
  const d = new Date(due + 'T23:59:59'); if (isNaN(d)) return '';
  const late = d.getTime() < now();
  return `<span class="chip ${late ? 'r' : 'a'}">${late ? 'Was due' : 'Finish by'} ${esc(fmtDob(due))}</span>`;
}
function reminderHtml(r) {
  if (r.kind === 'test') return `<div class="card remind" data-rem-test="${esc(r.tid)}"><div class="row"><div class="ricon">${ICON.clock}</div><div class="grow">
      <div class="tiny muted">Reminder from your teacher · ${fmtDay(r.createdAt)}</div><b>Take the test: ${esc(r.test.title)}</b>
      ${r.note ? `<div class="small" style="margin-top:2px">${esc(r.note)}</div>` : ''}<div class="chips" style="margin-top:6px">${dueHtml(r.due)}<span class="chip n">${r.test.count} questions${r.test.timer ? ` · ${r.test.timer} min` : ''}</span></div></div></div>

      <div class="small muted" style="margin-top:2px">${miss.length ? `Still missing: ${esc(andList(miss))}.` : 'Check your details are correct, then tap Save.'}</div></div></div>
      <button class="btn block" style="margin-top:10px" data-go-profile="1">Update my profile</button></div>`;
}
const sConf = f => sLoad('conf', async () => { try { return ((await getD('confidence/' + S.sid)) || {}).ratings || {}; } catch { return {}; } }, f);
function chatUnread() { const t = S.thread; return !!t && (t.aAt || 0) > (t.sRead || 0); }

    <div class="page" id="pg">${body}</div>

  if (!mine.length) return '<span class="chip n">Not attempted</span>';
  const f = mine[0];
  const pending = (f.items || []).some(i => i.type !== 'MCQ' && !(f.grades && f.grades[i.qid] != null));
  return `<span class="chip g">Done${mine.length > 1 ? ` ×${mine.length}` : ''}</span>${pending ? '<span class="chip p">Marking pending</span>' : ''}${solutionsOpenFor(t, atts) ? '<span class="chip">Solutions open</span>' : ''}`;
}
async function sTestsView(force) {
  const pg = sShell('tests', 'Tests', spinner(), { sub: `Class ${myGrade()}` });
  try {
    if (force) { try { S.settings = (await getD('config/settings')) || {}; } catch { } }
    const [tests, atts, rems, prac] = await Promise.all([sTests(force), sAttempts(force), sReminders(force), practiceOn() ? sPractice(force) : []]);
    const reminded = new Set(activeReminders(rems, tests, atts).filter(r => r.kind === 'test').map(r => r.tid));
    const groups = [['chapter', 'Chapter tests'], ['mock', 'Mock tests'], ['custom', 'More tests']];
    const practiceCard = practiceOn() ? `<div class="card pcard" id="mkmock"><div class="row"><div class="ricon">${ICON.target}</div><div class="grow"><b>Make your own practice mock</b>
        <div class="small muted">One chapter or mixed chapters. See your score and the detailed solutions as soon as you submit.</div></div><span class="btn sm">Start</span></div></div>` : '';
    pg.innerHTML = practiceCard + (groups.map(([k, label]) => {
      const list = tests.filter(t => (t.kind || 'custom') === k);
      if (!list.length) return '';
      return `<div class="sectiontitle">${label}</div><div class="card" style="padding:4px 14px">${list.map(t => `
        <div class="li" data-t="${esc(t.id)}"><div class="grow"><div class="t">${esc(t.title)}</div>
        <div class="small muted">${t.count} questions · ${t.totalMarks} marks${t.timer ? ` · ${t.timer} min` : ''}</div>
        <div class="chips" style="margin-top:4px">${reminded.has(t.id) ? '<span class="chip r">⏰ Teacher reminder</span>' : ''}${testStatus(t, atts)}</div></div><span class="muted">›</span></div>`).join('')}</div>`;
    }).join('') || `<div class="card empty">No tests for Class ${myGrade()} yet. Your teacher will add them soon.</div>`)
      + (prac.length ? `<div class="sectiontitle">My practice mocks</div><div class="card" style="padding:4px 14px">${prac.slice(0, 30).map(p => `<div class="li" data-pm="${esc(p.id)}"><div class="grow"><div class="t">${esc(p.title)}</div>
          <div class="small muted">${fmtDate(p.submittedAt)} · ${(p.qids || []).length} questions</div></div><div class="right"><b>${p.score == null ? '–' : fmtNum(p.score) + '/' + p.max}</b>${p.max ? `<div class="tiny muted">${pct(p.score || 0, p.max)}%</div>` : ''}</div></div>`).join('')}</div>` : '');
    pg.insertAdjacentHTML('beforeend', '<div class="center" style="margin-top:14px"><button class="btn ghost sm" id="rf">Refresh</button></div>');
    $('#rf').onclick = () => sTestsView(true);
    if ($('#mkmock')) $('#mkmock').onclick = () => sPracticeBuilder();
    $$('[data-t]', pg).forEach(el => el.onclick = () => openTestIntro(el.dataset.t));
    $$('[data-pm]', pg).forEach(el => el.onclick = () => showPracticeResult(prac.find(p => p.id === el.dataset.pm)));
  } catch (e) { pg.innerHTML = `<div class="card">${esc(errMsg(e))}</div>`; }
}

async function openTestIntro(tid) {
  const pg = sShell('tests', 'Test', spinner(), { back: () => sTestsView() });
  const [tests, atts] = await Promise.all([sTests(), sAttempts()]);
  const t = tests.find(x => x.id === tid) || await getD('tests/' + tid).catch(() => null);
  if (!t) { pg.innerHTML = '<div class="card empty">This test is no longer available.</div>'; return; }
  const mine = atts.filter(a => a.tid === tid).sort((a, b) => a.n - b.n);
  const nextN = (mine.length ? mine[mine.length - 1].n : 0) + 1;
  const prog = lsGet(progKey(tid, nextN));
  const written = (t.items || []).filter(i => i.type !== 'MCQ').length;
  const tc = {}; (t.items || []).forEach(i => tc[i.type] = (tc[i.type] || 0) + 1);
  $('.topbar h1').textContent = t.title;
  const rem = activeReminders(SC.rems || [], [t], mine).find(r => r.kind === 'test');
  pg.innerHTML = `${rem ? `<div class="info small">⏰ Your teacher reminded you to take this test${rem.due ? ` by <b>${esc(fmtDob(rem.due))}</b>` : ''}.${rem.note ? ' ' + esc(rem.note) : ''}</div>` : ''}<div class="card"><h2>${esc(t.title)}</h2>
    <div class="chips"><span class="chip">${t.count} questions</span><span class="chip">${t.totalMarks} marks</span><span class="chip">${t.timer ? `⏱ ${t.timer} min` : 'No time limit'}</span></div>
    <p class="small muted" style="margin:10px 0 0">${TYPES.filter(k => tc[k]).map(k => `${TYPE_NAME[k]}: ${tc[k]}`).join(' · ')}</p></div>
    ${t.kind === 'chapter' && t.chapter ? `<button class="btn sec block wrapbtn" id="revch">${ICON.rev} Revise Chapter ${esc(t.chapter)} formulas first</button><div class="sp"></div>` : ''}
    <div class="card"><h3>Before you start</h3><ul class="small" style="margin:0;padding-left:18px;color:var(--ink2)">
      <li>One question at a time. Use <b>Mark for review</b> and the <b>question grid</b> to jump around.</li>
      ${t.timer ? `<li>The timer keeps running even if you close the app. At zero the test submits by itself.</li>` : ''}
      <li>Your answers are saved on this phone as you go.</li>
      ${written ? `<li><b>${written} written question${written > 1 ? 's' : ''}:</b> solve on paper, type only your <b>final answer</b> (a number or one line). After submitting, send a photo of your working to your teacher on WhatsApp.</li>` : ''}
      <li>You see your MCQ score straight after submitting. Detailed solutions appear when your teacher opens them.</li>${mine.length ? '<li>Your <b>first attempt</b> is your official score. Later attempts are practice.</li>' : ''}</ul></div>
    ${mine.length ? `<div class="card"><h3>Your attempts</h3>${mine.map(a => `<div class="li" data-att="${esc(a.id)}"><div class="grow"><b>Attempt ${a.n}</b> ${a.n === 1 ? '<span class="chip g">Official</span>' : '<span class="chip n">Practice</span>'}<div class="small muted">${fmtDate(a.submittedAt)}</div></div><span class="btn sec sm">View</span></div>`).join('')}</div>` : ''}
    <div class="sp"></div>
    ${prog ? `<button class="btn block" id="go">Resume test</button>` : `<button class="btn block" id="go">${mine.length ? 'Practise again' : 'Start test'}</button>`}`;
  $('#go').onclick = async () => {
    if (!prog && mine.length && !(await confirmBox('Practise again?', 'This attempt is for practice. Your first attempt stays your official score.', 'Start'))) return;
    runTest(t, nextN);
  };
  $$('[data-att]', pg).forEach(el => el.onclick = () => showResult(mine.find(a => a.id === el.dataset.att), t));
  if ($('#revch')) $('#revch').onclick = () => sChapter(Number(t.chapter), 'f', () => openTestIntro(tid));
}

// ---------- TEST RUNNER ----------
let runTimer = null;
// mode.practice: a student's own practice mock (saved in practice/, scored at once, solutions shown straight away)
function runTest(t, n, mode = {}) {
  const practice = !!mode.practice;
  const key = progKey(t.id, n);
  let st = lsGet(key);
  if (!st) {
    st = { tid: t.id, title: t.title, n, startedAt: now(), deadline: t.timer ? now() + t.timer * 60000 : null, responses: {}, review: [], visited: [], cur: 0 };
    if (practice) { st.practice = true; st.mock = { title: t.title, timer: t.timer || 0, chapters: mode.chapters || [], items: t.items }; }
    lsSet(key, st);
  }
  const items = t.items || [];
  const save = () => lsSet(key, st);
  S.view = 'runner';
  let submitting = false;

  function status(i) {
    const q = items[i].qid, r = st.responses[q];
    const answered = r && (r.o != null || (r.t && r.t.trim()));
    const rev = st.review.includes(q);
    if (rev) return answered ? 'revans' : 'rev';
    if (answered) return 'ans';
    if (st.visited.includes(q)) return 'skip';
    return '';
  }
  function counts() { const c = { ans: 0, skip: 0, rev: 0, nv: 0 }; items.forEach((_, i) => { const s = status(i); if (s === 'ans' || s === 'revans') c.ans++; if (s === 'rev' || s === 'revans') c.rev++; if (!s) c.nv++; if (s === 'skip' || s === 'rev') c.skip++; }); return c; }

  function render() {
    const i = st.cur, it = items[i];
    if (!st.visited.includes(it.qid)) { st.visited.push(it.qid); save(); }
    const r = st.responses[it.qid] || {};
    const order = it.type === 'MCQ' ? optOrder(it, S.sid, t.id) : null;
    $('#app').innerHTML = `<div class="runner"><div class="runhead">
      <button class="iconbtn" id="rx">${ICON.back}</button>
      <div class="grow" style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</div><div style="font-size:.75rem;opacity:.85">Question ${i + 1} of ${items.length}</div></div>
      ${st.deadline ? `<div class="timer" id="tm">--:--</div>` : ''}
      <button class="iconbtn" id="pal">${ICON.grid}</button></div>
      <div class="runbody">
        <div class="chips" style="margin-bottom:10px"><span class="chip">Section ${TYPE_SECTION[it.type] || ''}</span><span class="chip n">${TYPE_NAME[it.type]}</span><span class="chip n">${it.marks} mark${it.marks > 1 ? 's' : ''}</span>${st.review.includes(it.qid) ? '<span class="chip p">Marked for review</span>' : ''}</div>
        <div class="card">${questionHtml(it, { order, chosen: r.o })}
        ${it.type !== 'MCQ' ? `<label class="field" style="margin-top:12px"><span>Your final answer (a number or one line)</span>
          <input class="input" id="wa" maxlength="200" value="${esc(r.t || '')}" placeholder="e.g. 2520 cm, or x = 2, y = 3"></label>
          <p class="tiny muted" style="margin:0">Write the full working on paper. You'll send a photo of it to your teacher after submitting.</p>` : ''}
        </div>
        ${it.type === 'MCQ' && r.o != null ? '<div class="center"><button class="btn ghost sm" id="clr">Clear my answer</button></div>' : ''}
      </div>
      <div class="runfoot"><div class="in">
        <div class="row"><button class="btn sec" id="prev" ${i === 0 ? 'disabled' : ''}>‹ Prev</button>
        <button class="btn sec" id="rev">${st.review.includes(it.qid) ? 'Unmark' : 'Mark for review'}</button>
        ${i < items.length - 1 ? `<button class="btn" id="next">Next ›</button>` : `<button class="btn green" id="sub">Submit</button>`}</div>
      </div></div></div>`;
    fillImages($('#app'));
    $$('[data-opt]').forEach(b => b.onclick = () => { st.responses[it.qid] = { o: Number(b.dataset.opt) }; save(); render(); });
    const wa = $('#wa'); if (wa) wa.oninput = () => { st.responses[it.qid] = { t: wa.value.slice(0, 200) }; save(); };
    if ($('#clr')) $('#clr').onclick = () => { delete st.responses[it.qid]; save(); render(); };
    $('#prev').onclick = () => { st.cur = Math.max(0, i - 1); save(); render(); };
    if ($('#next')) $('#next').onclick = () => { st.cur = i + 1; save(); render(); };
    if ($('#sub')) $('#sub').onclick = () => askSubmit();
    $('#rev').onclick = () => { const k = st.review.indexOf(it.qid); if (k >= 0) st.review.splice(k, 1); else st.review.push(it.qid); save(); render(); };
    $('#pal').onclick = openPalette;
    $('#rx').onclick = async () => { if (await confirmBox('Leave the test?', `Your answers stay saved on this phone and you can resume from the ${practice ? 'Home' : 'Tests'} page.` + (st.deadline ? ' The timer keeps running.' : ''), 'Leave')) { stopTimer(); S.view = 'tests'; sTestsView(); } };
    tick();
  }
  function openPalette() {
    const c = counts();
    modal(`<h3>All questions</h3>
      <div class="legend"><span><i style="background:var(--green)"></i>Answered ${c.ans}</span><span><i style="background:#fde3d6"></i>Not answered ${c.skip}</span><span><i style="background:var(--purple)"></i>For review ${c.rev}</span><span><i style="background:#eceef4"></i>Not seen ${c.nv}</span></div>
      <div class="palette">${items.map((it, k) => `<button class="pal ${status(k)} ${k === st.cur ? 'cur' : ''}" data-j="${k}">${k + 1}</button>`).join('')}</div>
      <div class="sp"></div><button class="btn green block" id="psub">Submit test</button>`,
      (m, close) => {
        $$('[data-j]', m).forEach(b => b.onclick = () => { st.cur = Number(b.dataset.j); save(); close(); render(); });
        $('#psub', m).onclick = () => { close(); askSubmit(); };
      });
  }
  async function askSubmit() {
    const c = counts();
    const ok = await confirmBox('Submit test?', `Answered: <b>${c.ans}</b> of ${items.length}${c.rev ? ` · Marked for review: <b>${c.rev}</b>` : ''}${items.length - c.ans ? `<br>Unanswered questions get 0.` : ''}<br>You can't change answers after submitting.`, 'Submit');
    if (ok) submit(false);
  }
  async function submit(auto) {
    if (submitting) return; submitting = true; stopTimer();
    $('#app').innerHTML = `<div class="runner"><div class="runbody center">${spinner()}<p>${auto ? "Time's up! " : ''}Submitting your answers…</p></div></div>`;
    if (practice) return submitPractice(auto);
    const aid = `${S.sid}_${t.id}_${n}`;
    const att = clean({
      sid: S.sid, uid: S.user.uid, tid: t.id, n, title: t.title, kind: t.kind || 'custom', grade: myGrade(),
      startedAt: st.startedAt, submittedAt: now(), timeTaken: Math.round((now() - st.startedAt) / 1000), autoSubmitted: !!auto,
      items: items.map(it => ({ qid: it.qid, type: it.type, marks: it.marks, chapter: it.chapter })),
      responses: Object.fromEntries(Object.entries(st.responses).filter(([, v]) => v.o != null || (v.t && v.t.trim())).map(([k, v]) => [k, v.o != null ? { o: v.o } : { t: v.t.trim() }])),
      review: st.review
    });
    try {
      await setDoc(D('attempts/' + aid), att);
      lsDel(key); SC.attempts = undefined;
      toast('Submitted!');
      showResult({ id: aid, ...att }, t);
    } catch (e) {
      // already submitted from another device or an earlier tap? then just show it
      const existing = await getD('attempts/' + aid).catch(() => null);
      if (existing) { lsDel(key); SC.attempts = undefined; return showResult(existing, t); }
      submitting = false; console.error(e);
      $('#app').innerHTML = `<div class="runner"><div class="runbody"><div class="card"><h3>Could not submit</h3><p class="muted">${esc(errMsg(e))}</p>
        <p class="small">Your answers are still saved on this phone. Check your internet and try again.</p><button class="btn block" id="retry">Try again</button></div></div></div>`;
      $('#retry').onclick = () => submit(auto);
    }
  }
  async function submitPractice(auto) {
    const pid = `${S.sid}_${t.id}`;
    const g = myGrade();
    const chs = [...new Set(items.map(i => Number(i.chapter)))].sort((a, b) => a - b);
    try {
      const keyDocs = await Promise.all(chs.map(c => getD('poolKeys/' + poolId(g, c)).catch(() => null)));
      const keyItems = {}; keyDocs.forEach(d => d && Object.assign(keyItems, d.items || {}));
      const responses = Object.fromEntries(Object.entries(st.responses).filter(([, v]) => v.o != null).map(([k, v]) => [k, { o: v.o }]));
      const sc = practiceScore(items, responses, keyItems);
      const rec = clean({ sid: S.sid, uid: S.user.uid, mid: t.id, grade: g, title: t.title, chapters: chs, qids: items.map(i => i.qid), responses,
        score: sc.score, max: sc.max, correct: sc.correct, wrong: sc.wrong, blank: sc.blank, timer: t.timer || 0,
        startedAt: st.startedAt, submittedAt: now(), timeTaken: Math.round((now() - st.startedAt) / 1000), autoSubmitted: !!auto });
      await setDoc(D('practice/' + pid), rec);
      lsDel(key); SC.practice = undefined;
      toast('Submitted!');
      showPracticeResult({ id: pid, ...rec }, items, keyItems);
    } catch (e) {
      const existing = await getD('practice/' + pid).catch(() => null);
      if (existing) { lsDel(key); SC.practice = undefined; return showPracticeResult(existing); }
      submitting = false; console.error(e);
      const off = e && e.code === 'permission-denied';
      $('#app').innerHTML = `<div class="runner"><div class="runbody"><div class="card"><h3>Could not submit</h3>
        <p class="muted">${off ? 'Practice mocks may have been switched off by your teacher.' : esc(errMsg(e))}</p>
        <p class="small">Your answers are still saved on this phone. Check your internet and try again.</p><button class="btn block" id="retry">Try again</button>
        <div class="sp"></div><button class="btn ghost block" id="discard">Discard this practice mock</button></div></div></div>`;
      $('#retry').onclick = () => submit(auto);
      $('#discard').onclick = async () => { if (await confirmBox('Discard this practice mock?', 'Your answers on this phone will be deleted.', 'Discard', true)) { lsDel(key); S.view = 'tests'; sTestsView(); } };
    }
  }
  function tick() {
    stopTimer();
    if (!st.deadline) return;
    const upd = () => {
      const left = Math.round((st.deadline - now()) / 1000);
      const el = $('#tm'); if (el) { el.textContent = fmtDur(left); el.classList.toggle('low', left <= 300); }
      if (left <= 0) submit(true);
    };
    upd(); runTimer = setInterval(upd, 1000);
  }
  if (st.deadline && st.deadline <= now()) return submit(true);
  render();
}
function stopTimer() { if (runTimer) { clearInterval(runTimer); runTimer = null; } }

// ---------- RESULT ----------
// The MCQ answer key (testKeys) opens after the first attempt, so the score shows at once.
// Correct options and detailed solutions (testSolutions) stay locked until the teacher opens them.
async function showResult(att, test) {
  stopTimer();
  const pg = sShell('tests', test ? test.title : att.title, spinner(), { back: () => openTestIntro(att.tid), sub: `Attempt ${att.n}${att.n === 1 ? ' · official' : ' · practice'}` });
  let keyDoc = null, solDoc = null;
  try { keyDoc = await getD('testKeys/' + att.tid); } catch (e) { console.warn(e); }
  try { solDoc = await getD('testSolutions/' + att.tid); } catch { solDoc = null; }   // locked = permission denied
  const open = !!solDoc;
  const key = keyDoc ? keyDoc.items : {};
  const sols = open ? (solDoc.items || {}) : {};
  const t = test || await getD('tests/' + att.tid).catch(() => null);
  const itemById = {}; ((t && t.items) || []).forEach(i => itemById[i.qid] = i);
  const sc = scoreAttempt(att, key);
  const wa = (S.settings.whatsapp || '').replace(/\D/g, '');
  const waText = encodeURIComponent(`Hello, this is ${S.profile.name || S.sid} (ID: ${S.sid}, Class ${myGrade()}). My working for "${att.title}" (attempt ${att.n}) is attached.`);
  pg.innerHTML = `<div class="scorehero">
      <div><div class="sv">${fmtNum(sc.mcq)}/${sc.mcqMax}</div><div class="sl">MCQ score (${sc.correct} right, ${sc.wrong} wrong, ${sc.blank} blank)</div></div>
      ${sc.writtenCount ? `<div><div class="sv">${sc.pending ? '⏳' : fmtNum(sc.wr) + '/' + sc.wrMax}</div><div class="sl">${sc.pending ? `Written: ${sc.pending} awaiting teacher's marks` : 'Written questions'}</div></div>` : ''}
      ${!sc.pending ? `<div><div class="sv">${fmtNum(sc.total)}/${sc.max}</div><div class="sl">Total · ${pct(sc.total, sc.max)}%</div></div>` : ''}
      <div><div class="sv" style="font-size:1.2rem">${fmtDur(att.timeTaken || 0)}</div><div class="sl">Time taken${att.autoSubmitted ? ' (auto-submitted)' : ''}</div></div></div>
    ${sc.writtenCount && sc.pending ? `<div class="card" style="margin-top:12px"><h3>Send your working</h3><p class="small muted" style="margin:0 0 10px">Take clear photos of your written answers and send them to your teacher on WhatsApp. Your teacher will add the marks here.</p>
      ${wa ? `<a class="btn wa block" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${waText}">${ICON.wa} Send on WhatsApp</a>` : '<p class="small">Ask your teacher for their WhatsApp number.</p>'}</div>` : ''}
    ${open ? '' : `<div class="card" style="margin-top:12px;background:var(--syellow);border-color:#f3e3a1"><h3>🔒 Solutions are locked</h3><p class="small" style="margin:0">Your teacher will open the correct answers and detailed solutions after checking your work. Come back to this page later.</p><div id="askbox">${askSolHtml(att.tid)}</div></div>`}
    <div class="chips" style="margin:16px 0 4px" id="flt"><button class="toggle on" data-f="all">All</button>${open ? '<button class="toggle" data-f="wrong">Wrong</button>' : ''}<button class="toggle" data-f="blank">Unanswered</button>${sc.writtenCount ? '<button class="toggle" data-f="written">Written</button>' : ''}</div>
    <div id="rqs"></div>`;
  const rows = (att.items || []).map((ai, idx) => {
    const it = itemById[ai.qid]; const k = key[ai.qid] || {}; const s = sols[ai.qid] || {}; const resp = (att.responses || {})[ai.qid];
    let cls = 'all', badge = '';
    if (ai.type === 'MCQ') {
      if (!resp || resp.o == null) { cls += ' blank'; badge = '<span class="chip n">Not answered</span>'; }
      else if (!open) badge = '<span class="chip n">Answered</span>';
      else if (resp.o === k.answer) badge = `<span class="chip g">Correct · +${ai.marks}</span>`;
      else { cls += ' wrong'; badge = '<span class="chip r">Wrong · 0</span>'; }
    } else {
      cls += ' written'; if (!resp) cls += ' blank';
      const g = att.grades ? att.grades[ai.qid] : undefined;
      badge = g == null ? `<span class="chip p">Teacher to mark · ${ai.marks}</span>` : `<span class="chip ${g >= ai.marks ? 'g' : g > 0 ? 'a' : 'r'}">${fmtNum(g)}/${ai.marks}</span>`;
    }
    const order = ai.type === 'MCQ' && it && it.options ? optOrder(it, S.sid, att.tid) : null;
    const sol = (s.solution || []).map(b => (b.x && order) ? { ...b, x: remapOptionLetters(b.x, order) } : b);
    const qview = it ? (open ? questionHtml(it, { order, chosen: resp && resp.o, reveal: true, answer: k.answer })
      : questionHtml(it, { order, chosen: resp && resp.o, locked: true })) : '<p class="muted">Question text unavailable.</p>';
    return `<div class="rq ${cls}"><div class="hd"><b>Q${idx + 1}</b><span class="chip n">${TYPE_NAME[ai.type]}</span>${badge}</div>
      ${qview}
      ${ai.type !== 'MCQ' ? `<div class="mine"><span class="muted small">Your final answer:</span><br>${resp && resp.t ? esc(resp.t) : '<i class="muted">(blank)</i>'}</div>
        ${open && s.finalAnswer ? `<div class="ansbox">${inlineRich(s.finalAnswer)}</div>` : ''}` : ''}
      ${open && sol.length ? `<details class="sol"><summary>Show full solution ▾</summary><div class="solbody qtext">${renderBlocks(sol)}</div></details>` : ''}</div>`;
  });
  const box = $('#rqs'); box.innerHTML = rows.join('');
  fillImages(box);
  $$('[data-f]', pg).forEach(b => b.onclick = () => {
    $$('[data-f]', pg).forEach(x => x.classList.toggle('on', x === b));
    $$('.rq', box).forEach(r => r.classList.toggle('hidden', !r.classList.contains(b.dataset.f)));
  });
  $$('details.sol', box).forEach(d => d.addEventListener('toggle', () => { if (d.open) fillImages(d); }));
  bindAskSol(att.tid, att.title);
}

// ---------- PRACTICE MOCKS (made by the student; MCQs from the practice pool the teacher publishes) ----------
// pool/{gGGcCC}: questions without answers · poolKeys/{gGGcCC}: answers + solutions · practice/{sid}_{mid}: the student's result
function practiceScore(items, responses, keyItems) {
  const r = { score: 0, max: 0, correct: 0, wrong: 0, blank: 0 };
  items.forEach(it => {
    const m = Number(it.marks) || 1; r.max += m;
    const resp = responses[it.qid]; const k = keyItems[it.qid];
    if (!resp || resp.o == null) r.blank++;
    else if (k && resp.o === k.answer) { r.correct++; r.score += m; } else r.wrong++;
  });
  return r;
}
function resumeSaved(tid, n) {
  const v = lsGet(progKey(tid, n));
  if (v && v.practice && v.mock) return runTest({ id: tid, title: v.mock.title, kind: 'practice', timer: v.mock.timer, items: v.mock.items }, 1, { practice: true, chapters: v.mock.chapters });
  return openTestIntro(tid);
}
const PACES = [[0, 'No timer'], [1, '1 min per question'], [2, '2 min per question']];
async function sPracticeBuilder(preCh) {
  const g = myGrade();
  const pg = sShell('tests', 'Practice mock', spinner(), { back: () => sTestsView(), sub: `Class ${g} · make your own` });
  if (!practiceOn()) { pg.innerHTML = '<div class="card empty">Practice mocks are switched off at the moment.</div>'; return; }
  let pool;
  try { pool = await sPool(true); } catch (e) { pg.innerHTML = `<div class="card">${esc(errMsg(e))}</div>`; return; }
  pool = pool.filter(p => (p.items || []).length);
  if (!pool.length) { pg.innerHTML = `<div class="card empty">Your teacher hasn't added practice questions for Class ${g} yet.</div>`; return; }
  const past = await sPractice();
  const seenQ = new Set(past.flatMap(p => p.qids || []));
  const going = inProgressList().filter(v => v.practice);
  const sel = new Set(preCh && pool.some(p => p.chapter === preCh) ? [preCh] : []);
  let count = 10, pace = 1;
  const draw = () => {
    const avail = pool.filter(p => sel.has(p.chapter)).reduce((s, p) => s + p.items.length, 0);
    const n = Math.min(count, avail);
    const fresh = pool.filter(p => sel.has(p.chapter)).reduce((s, p) => s + p.items.filter(i => !seenQ.has(i.qid)).length, 0);
    pg.innerHTML = `${going.length ? going.map(v => `<div class="card row" style="cursor:pointer" data-resume="${esc(v.tid)}"><div class="grow"><b>${esc(v.title)}</b><div class="small muted">Practice mock in progress</div></div><span class="btn sm">Resume</span></div>`).join('') : ''}
      <div class="info small">🎯 Practice mocks are for you. They don't count in your results, and you see the answers and full solutions as soon as you submit.</div>
      <div class="card"><div class="row"><h3 class="grow">1. Choose chapters</h3><button class="btn ghost sm" id="pall">${sel.size === pool.length ? 'Clear' : 'All chapters'}</button></div>
        <p class="tiny muted" style="margin:0 0 6px">Pick one chapter, or several for a mixed mock.</p>
        ${pool.map(p => `<label class="li pchk" style="cursor:pointer"><input type="checkbox" data-pc="${p.chapter}" ${sel.has(p.chapter) ? 'checked' : ''}>
          <div class="grow"><div class="t">${p.chapter}. ${esc(chName(g, p.chapter))}</div><div class="tiny muted">${p.items.length} question${p.items.length === 1 ? '' : 's'}</div></div></label>`).join('')}</div>
      <div class="card"><h3>2. How many questions?</h3><div class="chips">${[5, 10, 15, 20, 30, 50].map(k => `<button class="toggle ${count === k ? 'on' : ''}" data-cnt="${k}" ${avail && k > avail && k !== 5 ? 'disabled' : ''}>${k}</button>`).join('')}</div>
        <p class="tiny muted" style="margin:8px 0 0">${sel.size ? `${avail} question${avail === 1 ? '' : 's'} in the chosen chapter${sel.size > 1 ? 's' : ''}${fresh < avail ? ` · ${fresh} you haven't practised yet (these come first)` : ''}.` : 'Choose at least one chapter.'}</p></div>
      <div class="card"><h3>3. Timer</h3><div class="chips">${PACES.map(([k, l]) => `<button class="toggle ${pace === k ? 'on' : ''}" data-pace="${k}">${l}</button>`).join('')}</div></div>
      <button class="btn block" id="pgo" ${n ? '' : 'disabled'}>${n ? `Start: ${n} questions${pace ? ` · ${n * pace} min` : ''}` : 'Choose a chapter'}</button>`;
    $$('[data-resume]', pg).forEach(b => b.onclick = () => resumeSaved(b.dataset.resume, 1));
    $$('[data-pc]', pg).forEach(cb => cb.onchange = () => { const c = Number(cb.dataset.pc); cb.checked ? sel.add(c) : sel.delete(c); draw(); });
    $('#pall').onclick = () => { if (sel.size === pool.length) sel.clear(); else pool.forEach(p => sel.add(p.chapter)); draw(); };
    $$('[data-cnt]', pg).forEach(b => b.onclick = () => { count = Number(b.dataset.cnt); draw(); });
    $$('[data-pace]', pg).forEach(b => b.onclick = () => { pace = Number(b.dataset.pace); draw(); });
    $('#pgo').onclick = () => {
      const chosen = pool.filter(p => sel.has(p.chapter));
      const seed = Math.floor(Math.random() * 1e9);
      // questions you haven't practised come first; spread evenly over the chosen chapters
      const lists = chosen.map((p, i) => [...shuffled(p.items.filter(x => !seenQ.has(x.qid)), seed + i), ...shuffled(p.items.filter(x => seenQ.has(x.qid)), seed + 99 + i)]);
      const picked = [];
      while (picked.length < n && lists.some(l => l.length)) for (const l of lists) { if (l.length && picked.length < n) picked.push(l.shift()); }
      picked.sort((a, b) => a.chapter - b.chapter);
      const chs = chosen.map(p => p.chapter);
      const title = chs.length === 1 ? `Practice · Ch ${chs[0]} ${chName(g, chs[0])}` : chs.length === pool.length && pool.length > 2 ? 'Practice · All chapters' : `Practice · Mixed (Ch ${chs.join(', ')})`;
      const mid = 'pm' + now().toString(36);
      runTest({ id: mid, title, kind: 'practice', timer: pace * picked.length, items: picked.map(x => ({ ...x, marks: Number(x.marks) || 1 })) }, 1, { practice: true, chapters: chs });
    };
  };
  draw();
}
async function loadPracticeQuestions(grade, chapters) {
  const itemById = {}, keyItems = {};
  await Promise.all((chapters || []).map(async c => {
    const [p, k] = await Promise.all([getD('pool/' + poolId(grade, c)).catch(() => null), getD('poolKeys/' + poolId(grade, c)).catch(() => null)]);
    ((p && p.items) || []).forEach(i => itemById[i.qid] = i);
    Object.assign(keyItems, (k && k.items) || {});
  }));
  return { itemById, keyItems };
}
// review of a practice mock: shared by the student (Tests tab) and the teacher (Practice mocks page)
function practiceReviewHtml(rec, itemById, keyItems, sid) {
  const resp = rec.responses || {};
  return (rec.qids || []).map((qid, idx) => {
    const it = itemById[qid]; const k = keyItems[qid]; const r = resp[qid];
    if (!it) return `<div class="rq all"><div class="hd"><b>Q${idx + 1}</b></div><p class="muted small">This question is no longer in the practice questions.</p></div>`;
    let cls = 'all', badge;
    if (!r || r.o == null) { cls += ' blank'; badge = '<span class="chip n">Not answered</span>'; }
    else if (k && r.o === k.answer) badge = `<span class="chip g">Correct · +${Number(it.marks) || 1}</span>`;
    else { cls += ' wrong'; badge = '<span class="chip r">Wrong · 0</span>'; }
    const order = optOrder(it, sid, rec.mid);
    const sol = ((k && k.solution) || []).map(b => b.x ? { ...b, x: remapOptionLetters(b.x, order) } : b);
    return `<div class="rq ${cls}"><div class="hd"><b>Q${idx + 1}</b><span class="chip n">Ch ${esc(it.chapter)}</span>${badge}</div>
      ${questionHtml(it, { order, chosen: r && r.o, reveal: !!k, answer: k && k.answer, locked: !k })}
      ${sol.length ? `<details class="sol" ${cls.includes('wrong') ? 'open' : ''}><summary>Show full solution ▾</summary><div class="solbody qtext">${renderBlocks(sol)}</div></details>` : ''}</div>`;
  }).join('');
}

  try {
    const [rev, res, conf] = await Promise.all([sRev(), sRes(), sConf()]);

    const nums = chaptersOf(g).length ? chapterNums(g, used) : [...new Set(used)].sort((a, b) => a - b);
    if (!nums.length) { pg.innerHTML = `<div class="card empty">Your teacher hasn't added revision notes for Class ${g} yet.</div>`; return; }
    const rated = nums.map(n => conf[confKey(g, n)]).filter(Boolean);

    const files = sFiles(res), vids = sVideos(res);
    pg.innerHTML = `<div class="card row"><div class="grow"><b>Your confidence</b><div class="small muted">${rated.length ? `${rated.length} of ${nums.length} chapters rated · average ${avg.toFixed(1)} ★` : 'Open a chapter and tap the stars to show how confident you feel.'}</div></div>${rated.length ? starsHtml(avg) : ''}</div>
      <div class="card" style="padding:4px 14px">${nums.map(n => {

  return nums.map(ch => {
    const mine = list.filter(r => Number(r.chapter) === ch);
    const types = [...new Set([...RES_TYPES, ...mine.map(r => r.type)])].sort((a, b) => resTypeOrder(a) - resTypeOrder(b) || a.localeCompare(b));

// Admin saves are split into small batches so each stays inside Firestore's rules lookup limit.
async function commitOps(ops, size = 15) {
  for (let i = 0; i < ops.length; i += size) {
    const b = writeBatch(db);
    ops.slice(i, i + size).forEach(([k, p, d]) => k === 'delete' ? b.delete(D(p)) : k === 'update' ? b.update(D(p), d) : b.set(D(p), d));
    await b.commit();
  }
}

// One-time update: classes on every record, and answers split from solutions so solutions can stay locked.
async function migrateV2() {
  const close = modal(`<h3>Updating your app…</h3><p class="muted" id="mpr">One-time update for Classes 6–12 and locked solutions.</p>${spinner()}<p class="tiny muted">Keep this page open. It takes about a minute.</p>`);
  const say = t => { const el = $('#mpr'); if (el) el.textContent = t; };
  try {
    const ops = [];
    if (!(await getD('config/grades'))) ops.push(['set', 'config/grades', { chapters: { 10: CH10 }, updatedAt: now() }]);
    (await listC('questions')).filter(q => q.grade == null).forEach(q => ops.push(['update', 'questions/' + q.id, { grade: 10 }]));
    (await listC('students')).forEach(s => {
      const g = gradeOf(s);
      if (s.grade == null) ops.push(['update', 'students/' + s.id, { grade: g }]);
      if (s.uid) ops.push(['set', 'users/' + s.uid, { role: 'student', sid: s.id, grade: g }]);
    });
    (await listC('resources')).filter(r => r.grade == null).forEach(r => ops.push(['update', 'resources/' + r.id, { grade: 10 }]));
    say('Adding classes to questions, students and resources…');
    await commitOps(ops);
    AC.q = undefined; await aQ(true);
    say('Locking solutions in every test…');
    const tests = await listC('tests');
    await saveTests(tests.map(t => ({ ...t, grade: t.grade ?? 10, solutionsOpen: t.solutionsOpen === true })));
    await setDoc(D('config/settings'), { ...S.settings, schema: 2, updatedAt: now() });
    S.settings.schema = 2; await loadGrades();
    close(); toast('Update complete ✓');
  } catch (e) { close(); throw e; }
}

function resetStudentPassword(s) {
  modal(`<h3>Reset password for ${esc(s.name)}</h3><p class="small muted">The student signs in with the same ID (<b>${esc(s.id)}</b>) and this new password. Their results are kept.</p>
    <label class="field"><span>New password (min 6)</span><input class="input" id="npw"></label><div id="rerr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn sec" data-c>Cancel</button><button class="btn" id="rgo">Reset</button></div>`, (m, close) => {
    m.querySelector('[data-c]').onclick = close;
    m.querySelector('#rgo').onclick = () => busy(m.querySelector('#rgo'), async () => {
      const pw = m.querySelector('#npw').value;
      if (pw.length < 6) { m.querySelector('#rerr').innerHTML = '<div class="err">At least 6 characters.</div>'; return; }
      // Firebase does not let one user change another user's password from a web page,
      // so we create a fresh login for the same student ID and retire the old one.
      const email = `${s.id}.${now().toString(36)}@${LOGIN_DOMAIN}`;
      const uid = await createLogin(email, pw);
      const ops = [];
      if (s.uid) ops.push(['delete', 'users/' + s.uid]);
      ops.push(['set', 'users/' + uid, { role: 'student', sid: s.id, grade: studentGrade(s) }], ['update', 'students/' + s.id, { uid, updatedAt: now() }], ['set', 'logins/' + s.id, { email }]);
      await commitOps(ops);
      AC.students = undefined; close();
      modal(`<h3>Password reset ✓</h3><div class="card flat" style="background:var(--sblue)">ID: <b>${esc(s.id)}</b><br>New password: <b>${esc(pw)}</b></div><button class="btn block" data-c>Done</button>`, (m2, c2) => m2.querySelector('[data-c]').onclick = c2);
    });
  });
}
async function deleteStudent(s) {
  if (!(await confirmBox(`Delete ${s.name}?`, 'They will no longer be able to sign in. Their past results stay in your exports and backups.', 'Delete', true))) return;
  await busy(null, async () => {
    const inbox = await listC(`students/${s.id}/inbox`).catch(() => []);
    const msgs = await listC(`chats/${s.id}/messages`).catch(() => []);
    const rems = await listC(`students/${s.id}/reminders`).catch(() => []);
    const ops = [['delete', 'students/' + s.id], ['delete', 'logins/' + s.id], ['delete', `students/${s.id}/private/seen`], ['delete', 'chats/' + s.id], ['delete', 'confidence/' + s.id]];
    msgs.forEach(m => ops.push(['delete', `chats/${s.id}/messages/${m.id}`]));
    rems.forEach(r => ops.push(['delete', `students/${s.id}/reminders/${r.id}`]));
    if (s.uid) ops.push(['delete', 'users/' + s.uid]);
    inbox.forEach(x => ops.push(['delete', `students/${s.id}/inbox/${x.id}`]));
    await commitOps(ops); AC.students = undefined; toast('Student deleted'); aStudentsView();
  });
}

// ---------- RESULTS + EXPORT ----------
async function aResults() {
  const pg = aShell('results', 'Results & export', spinner(), { wide: true });
  guard(pg, async () => {
    const [atts, keys, tests, studs, confAll] = await Promise.all([aAtts(true), aKeys(), aTests(), aStudents(), aConf(true)]);
    const off = officialAttempts(atts);
    let mode = AC.rmode || 'tests', g = AC.g || 10;
    const draw = () => {
      const cs = studs.filter(s => studentGrade(s) === g);
      const offG = off.filter(a => cs.some(s => s.id === a.sid));
      let table;
      if (mode === 'tests') {
        const used = tests.filter(t => gradeOf(t) === g && offG.some(a => a.tid === t.id));
        table = `<table class="tbl"><tr><th>Student</th>${used.map(t => `<th class="num">${esc(t.kind === 'chapter' ? 'Ch ' + t.chapter : t.title)}</th>`).join('')}</tr>

            const a = offG.find(x => x.sid === s.id && x.tid === t.id); if (!a) return '<td class="num muted">–</td>';

            return `<td class="num" style="cursor:pointer" data-att="${esc(a.id)}"><b>${fmtNum(r.total)}</b>/${r.max}${r.pending ? '<span style="color:var(--purple)">*</span>' : ''}</td>`; }).join('')}</tr>`).join('')}</table>`;
      } else if (mode === 'conf') {

        const avgOf = c => { const v = cs.map(s => (confAll[s.id] || {})[confKey(g, c)]).filter(Boolean).map(x => x.s); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
        table = chs.length ? `<table class="tbl"><tr><th>Student</th>${chs.map(c => `<th class="num" title="${esc(chName(g, c))}">Ch ${c}</th>`).join('')}</tr>
          ${cs.map(s => `<tr><td><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.id)}</div></td>${chs.map(c => { const r = (confAll[s.id] || {})[confKey(g, c)];
            return r ? `<td class="num" style="background:${CONF_BG[r.s]}">${r.s}★</td>` : '<td class="num muted">–</td>'; }).join('')}</tr>`).join('')}
          <tr><td><b>Class average</b></td>${chs.map(c => { const a = avgOf(c); return `<td class="num"><b>${a == null ? '–' : a.toFixed(1) + '★'}</b></td>`; }).join('')}</tr></table>`
          : '<div class="empty">No student has rated a chapter yet. Students rate chapters in Revise → a chapter → the stars.</div>';
      } else {
        const chs = chapterNums(g, offG.flatMap(a => (a.items || []).map(i => i.chapter))).filter(c => offG.some(a => (a.items || []).some(i => Number(i.chapter) === c)) || c <= chaptersOf(g).length);
        table = `<table class="tbl"><tr><th>Student</th>${chs.map(c => `<th class="num" title="${esc(chName(g, c))}">Ch ${c}</th>`).join('')}<th class="num">Overall</th></tr>
          ${cs.map(s => { const pc = chapterWise(offG.filter(a => a.sid === s.id), keys); let G = 0, M = 0;
            return `<tr><td><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.id)}</div></td>${chs.map(c => { const v = pc[c]; if (!v || !v.max) return '<td class="num muted">–</td>'; G += v.got; M += v.max; const p = pct(v.got, v.max);
              return `<td class="num" style="background:${p >= 75 ? '#e3f6ec' : p >= 50 ? '#fdf3d8' : '#fde6e6'}">${p}%</td>`; }).join('')}<td class="num"><b>${M ? pct(G, M) + '%' : '–'}</b></td></tr>`; }).join('')}</table>`;
      }
      pg.innerHTML = `${gradeChips(g)}<div class="row wrap"><button class="toggle ${mode === 'tests' ? 'on' : ''}" data-m="tests">Scores by test</button><button class="toggle ${mode === 'ch' ? 'on' : ''}" data-m="ch">Chapter-wise %</button><button class="toggle ${mode === 'conf' ? 'on' : ''}" data-m="conf">Confidence ★</button>
        <span class="grow"></span><button class="btn sm" id="x1">⬇ All results (CSV)</button><button class="btn sec sm" id="x2">⬇ Class ${g} chapter-wise (CSV)</button><button class="btn sec sm" id="x3">⬇ Class ${g} confidence (CSV)</button></div>
        <p class="tiny muted">${mode === 'conf' ? `Class ${g}: how confident each student says they are, 1–5 stars, rated in Revise. Compare with Chapter-wise % to spot over- or under-confidence.` : `Class ${g}, official (first) attempts only. * = written questions not yet marked. Tap a score to open the attempt.`} CSV files open in Excel and Google Sheets.</p>
        <div class="tblwrap">${cs.length ? table : `<div class="empty">No students in Class ${g} yet.</div>`}</div>`;
      bindGradeChips(pg, v => { g = AC.g = v; draw(); });
      $$('[data-m]', pg).forEach(b => b.onclick = () => { mode = AC.rmode = b.dataset.m; draw(); });
