      $('#x1').onclick = () => exportResults(atts, keys, studs);
      $('#x2').onclick = () => exportChapterwise(off, keys, studs, g);
    };
    draw();
  });
}
const CONF_BG = ['', '#fde6e6', '#fdeedd', '#fdf3d8', '#e9f6e2', '#d8f1e4'];
function confChapters(g, cs, confAll) {
  const used = new Set(); cs.forEach(s => Object.keys(confAll[s.id] || {}).forEach(k => { const [gg, c] = k.split('_'); if (Number(gg) === g) used.add(Number(c)); }));
  return chapterNums(g, [...used]).filter(c => used.has(c) || c <= chaptersOf(g).length);
}
function exportConfidence(studs, confAll, g) {
  const cs = studs.filter(s => studentGrade(s) === g);
  const chs = confChapters(g, cs, confAll);
  const rows = [['Student ID', 'Name', ...chs.map(c => `Ch ${c} ${chName(g, c)} (stars)`), 'Average']];
  cs.forEach(s => { const r = confAll[s.id] || {}; const v = chs.map(c => (r[confKey(g, c)] || {}).s || '');
    const got = v.filter(x => x !== ''); rows.push([s.id, s.name, ...v, got.length ? (got.reduce((a, b) => a + b, 0) / got.length).toFixed(1) : '']); });
  download(`confidence-class${g}-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Confidence exported');
}
function chapterWise(atts, keys) {
  const out = {};
  atts.forEach(a => { const r = scoreAttempt(a, keys[a.tid]); for (const [c, v] of Object.entries(r.perCh)) { out[c] = out[c] || { got: 0, max: 0 }; out[c].got += v.got; out[c].max += v.max; } });
  return out;
}
function stamp() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function exportResults(atts, keys, studs) {
  const rows = [['Student ID', 'Name', 'Class', 'School', 'Test', 'Attempt', 'Official', 'Submitted', 'Time (min)', 'MCQ score', 'MCQ max', 'Written score', 'Written max', 'Written status', 'Total', 'Max', 'Percent']];
  atts.slice().sort((a, b) => String(a.sid).localeCompare(b.sid) || (a.submittedAt || 0) - (b.submittedAt || 0)).forEach(a => {
    const s = studs.find(x => x.id === a.sid) || {}; const r = scoreAttempt(a, keys[a.tid]);
    rows.push([a.sid, s.name || '(deleted)', a.grade ?? (s.id ? studentGrade(s) : ''), s.school || '', a.title, a.n, a.n === 1 ? 'Yes' : 'No', fmtDate(a.submittedAt), Math.round((a.timeTaken || 0) / 60),
      r.mcq, r.mcqMax, r.writtenCount ? r.wr : '', r.writtenCount ? r.wrMax : '', r.writtenCount ? (r.pending ? `${r.pending} to mark` : 'Marked') : '', r.total, r.max, pct(r.total, r.max)]);
  });
  download(`results-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Results exported');
}
function exportChapterwise(off, keys, studs, g) {
  const cs = studs.filter(s => studentGrade(s) === g);
  const chs = chapterNums(g, off.flatMap(a => (a.items || []).map(i => i.chapter)));
  const rows = [['Student ID', 'Name', ...chs.map(c => `Ch ${c} ${chName(g, c)} (%)`), 'Overall (%)']];
  cs.forEach(s => { const pc = chapterWise(off.filter(a => a.sid === s.id), keys); let G = 0, M = 0;
    rows.push([s.id, s.name, ...chs.map(c => { const v = pc[c]; if (!v || !v.max) return ''; G += v.got; M += v.max; return pct(v.got, v.max); }), M ? pct(G, M) : '']); });
  download(`chapterwise-class${g}-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Chapter-wise exported');
}
function exportStudents(studs) {
  const rows = [['Student ID', 'Name', 'Class', 'Date of birth', 'Gender', 'Mobile', 'Email', 'School', 'Address', 'Added on']];
  studs.forEach(s => rows.push([s.id, s.name, studentGrade(s), s.dob || '', s.gender === 'f' ? 'Female' : 'Male', s.mobile || '', s.email || '', s.school || '', s.address || '', fmtDate(s.createdAt)]));
  download(`students-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Student list exported');
}

// ---------- TESTS ----------
// tests/{id}: questions without answers · testKeys/{id}: MCQ answers only (opens after submitting) · testSolutions/{id}: locked until the teacher opens it
function buildTestDocs(t, qmap) {
  const tm = { ...TYPE_MARKS, ...(t.typeMarks || {}) };
  const qids = t.qids.filter(id => qmap[id]);
  const items = qids.map(id => { const q = qmap[id]; return { qid: id, chapter: q.chapter, type: q.type, marks: Number(tm[q.type] ?? q.marks), stem: q.stem || [], options: q.options || null, parts: q.parts || null, fixed: q.fixed === true ? true : undefined }; });
  const key = {}, sol = {};
  qids.forEach(id => { const q = qmap[id]; key[id] = { answer: q.type === 'MCQ' ? (q.answer ?? null) : null }; sol[id] = { solution: q.solution || [], finalAnswer: q.finalAnswer || '' }; });
  return {
    test: clean({ title: t.title, kind: t.kind || 'custom', chapter: t.chapter ?? null, grade: Number(t.grade) || 10, timer: Number(t.timer) || 0, order: t.order ?? 500, typeMarks: tm,
      qids, items, count: items.length, totalMarks: items.reduce((s, i) => s + i.marks, 0), published: t.published !== false, solutionsOpen: t.solutionsOpen === true, updatedAt: now() }),
    key: clean({ items: key, updatedAt: now() }),
    sol: clean({ items: sol, updatedAt: now() })
  };
}
async function saveTests(list) {     // list of test definitions with ids
  const qmap = await aQ();
  const ops = [];
  list.forEach(t => { const { test, key, sol } = buildTestDocs(t, qmap); ops.push(['set', 'tests/' + t.id, test], ['set', 'testKeys/' + t.id, key], ['set', 'testSolutions/' + t.id, sol]); });
  await commitOps(ops, 9);
  AC.tests = undefined; AC.keys = undefined;
}

async function aBuilder(existing) {

        <div class="card"><div class="row"><h3 class="grow">2. Pattern</h3><button class="btn sec sm" id="cbse">Use CBSE board pattern</button></div>
        <div class="counts"><span class="h">Type</span><span class="h">How many</span><span class="h">Marks each</span><span class="h">Picked</span>
        ${TYPES.map(k => `<span>${TYPE_NAME[k]}</span><input class="input" type="number" min="0" data-c="${k}" value="${counts[k]}"><input class="input" type="number" min="0" step="0.5" data-m="${k}" value="${T.typeMarks[k]}">
          <span class="chip ${have[k] === counts[k] ? 'g' : 'a'}">${have[k]}/${counts[k]}</span>`).join('')}</div>
        <p class="tiny muted">The CBSE pattern needs 2 Assertion–Reason questions. Your bank has none yet, so it uses 20 MCQs.</p></div>
        <div class="card"><h3>3. Pick questions (Class ${T.grade}: ${P.length} in the bank)</h3>

        <div class="chips">${chs.length ? chs.map(c => `<button class="toggle ${F.ch.has(c) ? 'on' : ''}" data-fc="${c}" title="${esc(chName(T.grade, c))}">${c}</button>`).join('') : '<span class="tiny muted">No questions for this class yet. Add them in Question bank (one by one or in bulk from Excel).</span>'}</div>

          const pick = shuffled(cand, Math.floor(Math.random() * 1e9)).slice(0, need); T.qids.push(...pick.map(q => q.id));

function pickByHand(all, T, counts, redraw) {
  const f = { type: '', ch: '', diff: '', s: '' };
  const chs = [...new Set(all.map(q => q.chapter))].sort((a, b) => a - b);
  modal(`<h3>Pick questions · Class ${T.grade}</h3><div class="grid2"><select class="input" id="pt"><option value="">All types</option>${TYPES.map(k => `<option value="${k}">${TYPE_NAME[k]}</option>`).join('')}</select>
    <select class="input" id="pc"><option value="">All chapters</option>${chs.map(c => `<option value="${c}">${c}. ${esc(chName(T.grade, c))}</option>`).join('')}</select>
    <select class="input" id="pd"><option value="">Any difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select><input class="input" id="ps" placeholder="Search text"></div>
    <div id="pcnt" class="chips" style="margin:10px 0"></div><div id="plist" style="max-height:48vh;overflow:auto"></div><div class="sp"></div><button class="btn block" data-c>Done</button>`, (m, close) => {
    const draw = () => {
      $('#pcnt', m).innerHTML = TYPES.map(k => { const n = T.qids.filter(id => all.find(q => q.id === id && q.type === k)).length; return `<span class="chip ${n === counts[k] ? 'g' : 'n'}">${k} ${n}/${counts[k]}</span>`; }).join('');
      const list = all.filter(q => (!f.type || q.type === f.type) && (!f.ch || q.chapter === Number(f.ch)) && (!f.diff || q.difficulty === f.diff) && (!f.s || plainText(q.stem, 999).toLowerCase().includes(f.s))).sort(qSort);
      $('#plist', m).innerHTML = list.map(q => `<label class="qrow" style="cursor:pointer"><input type="checkbox" data-q="${esc(q.id)}" ${T.qids.includes(q.id) ? 'checked' : ''}>
        <div class="qx"><div class="tiny muted">${q.type} · Ch ${q.chapter} · ${esc(q.difficulty || '')} · ${esc(q.id)}</div><div class="clip">${esc(plainText(q.stem, 160))}</div></div></label>`).join('') || '<div class="empty">No questions match.</div>';
      $$('[data-q]', m).forEach(cb => cb.onchange = () => { if (cb.checked) T.qids.push(cb.dataset.q); else T.qids = T.qids.filter(x => x !== cb.dataset.q); draw(); });
    };
    $('#pt', m).onchange = e => { f.type = e.target.value; draw(); }; $('#pc', m).onchange = e => { f.ch = e.target.value; draw(); };
    $('#pd', m).onchange = e => { f.diff = e.target.value; draw(); }; $('#ps', m).oninput = e => { f.s = e.target.value.trim().toLowerCase(); draw(); };
    m.querySelector('[data-c]').onclick = () => { close(); redraw(); };
    draw();
  });
}

          <div class="tiny muted">Class ${gradeOf(q)} · Ch ${q.chapter} · Q${q.num || '–'} · ${q.marks} mark${q.marks > 1 ? 's' : ''} · ${esc(q.difficulty || '')}</div><div class="clip">${esc(plainText(q.stem, 160))}</div></div></div>`).join('')
          + (list.length > 400 ? `<div class="empty">Showing 400 of ${list.length}. Use the filters to narrow down.</div>` : '')
          : `<div class="empty">${all.length ? 'No questions match.' : 'The bank is empty. Tap “Import bank file” and choose question-bank.json, or “Bulk add from Excel”.'}</div>`;
        $$('[data-q]', pg).forEach(el => el.onclick = () => aQEditor(qmap[el.dataset.q]));
      };
      bindGradeChips(pg, v => { f.g = v; f.ch = ''; if (v !== 'all') AC.g = v; shell(); });
      $('#ft').onchange = e => { f.type = e.target.value; draw(); }; $('#fc').onchange = e => { f.ch = e.target.value; draw(); };
      $('#fd').onchange = e => { f.diff = e.target.value; draw(); }; $('#fs').oninput = e => { f.s = e.target.value.trim().toLowerCase(); draw(); };
      $('#imp').onchange = e => { const file = e.target.files[0]; if (file) importBank(file); };
      $('#bulk').onclick = () => bulkImport();

}
async function importBank(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('That file could not be read.'); }
  if (!data || data.format !== 'maths-by-ssk-question-bank') return toast('This is not a question bank file.');
  const existing = await aQ();
  const clash = data.questions.filter(q => existing[q.id]).length;
  if (!(await confirmBox('Import question bank?', `${data.questions.length} questions, ${Object.keys(data.images || {}).length} figures and ${(data.tests || []).length} tests.${clash ? `<br><b>${clash} questions with the same IDs will be replaced</b> by the file's version.` : ''}`, 'Import'))) return;
  const close = modal(`<h3>Importing…</h3><p class="muted" id="ipr">Starting</p>${spinner()}<p class="tiny muted">Keep this page open.</p>`);
  const say = t => { const el = $('#ipr'); if (el) el.textContent = t; };
  try {
    const imgs = Object.entries(data.images || {});
    for (let i = 0; i < imgs.length; i += 6) {
      await commitOps(imgs.slice(i, i + 6).map(([id, src]) => ['set', 'images/' + id, { data: src }]));
      say(`Figures ${Math.min(i + 6, imgs.length)}/${imgs.length}`);
    }
    for (let i = 0; i < data.questions.length; i += 15) {
      await commitOps(data.questions.slice(i, i + 15).map(q => { const { id, ...rest } = q; return ['set', 'questions/' + id, clean({ ...rest, grade: Number(rest.grade) || 10, updatedAt: now() })]; }));
      say(`Questions ${Math.min(i + 15, data.questions.length)}/${data.questions.length}`);
    }
    AC.q = undefined; await aQ(true);
    say('Tests…');
    await saveTests((data.tests || []).map(t => ({ ...t, grade: Number(t.grade) || 10, published: true, solutionsOpen: false })));
    if (S.settings.practiceOn) { say('Practice questions…'); await syncPool(data.questions.map(q => Number(q.grade) || 10)); }
    close();
    modal(`<h3>Import complete ✓</h3><p>${data.questions.length} questions and ${(data.tests || []).length} tests are ready. Students can see the tests now; solutions stay locked until you open them.</p><p class="small muted">Keep the file safe on your computer. Don't upload it to your website: it contains the answers.</p><button class="btn block" data-c>OK</button>`, (m, c) => m.querySelector('[data-c]').onclick = () => { c(); aQuestionsView(); });
  } catch (e) { close(); console.error(e); toast('Import stopped: ' + errMsg(e), 6000); }
}

const XLSX_URLS = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function getXLSX() {
  for (const u of XLSX_URLS) { if (window.XLSX) break; try { await loadScript(u); } catch { } }
  if (!window.XLSX) throw new Error('Could not load the Excel reader. Check your internet and try again.');
  return window.XLSX;
}
const BULK_COLS = ['Class', 'Chapter', 'Type', 'Marks', 'Difficulty', 'Question', 'Option A', 'Option B', 'Option C', 'Option D', 'Correct option', 'Part 1', 'Part 2', 'Part 3', 'Part 4', 'Part marks', 'Solution', 'Final answer'];

function normType(v) {
  const s = String(v || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (['mcq', 'objective', 'multiplechoice', '1', '1mark'].includes(s)) return 'MCQ';
  if (['vsa', 'veryshort', 'veryshortanswer', 'sa1', 'shortanswer1', '2', '2marks', '2mark'].includes(s)) return 'VSA';
  if (['sa', 'short', 'shortanswer', 'sa2', 'shortanswer2', '3', '3marks', '3mark'].includes(s)) return 'SA';
  if (['la', 'long', 'longanswer', '5', '5marks', '5mark'].includes(s)) return 'LA';
  if (['case', 'casebased', 'casestudy', 'cs', '4', '4marks', '4mark'].includes(s)) return 'CASE';
  return null;
}
function parseBulkRows(table, qmap, dateCells = {}) {
  const head = (table[0] || []).map(h => String(h).trim().toLowerCase().replace(/\s+/g, ' '));
  const col = name => { const n = name.toLowerCase(); const alias = { class: ['class', 'grade'], 'correct option': ['correct option', 'correct', 'answer', 'key'] }[n] || [n]; return head.findIndex(h => alias.includes(h)); };
  const idx = Object.fromEntries(BULK_COLS.map(c => [c, col(c)]));
  const missing = ['Class', 'Chapter', 'Type', 'Question'].filter(c => idx[c] < 0);
  if (missing.length) return { fatal: `The first row must be the header row. Missing column${missing.length > 1 ? 's' : ''}: ${missing.join(', ')}. Download the template and copy your questions into it.` };
  const get = (r, c) => idx[c] < 0 ? '' : String(r[idx[c]] ?? '').replace(/\r/g, '').trim();
  const ok = [], bad = [], dup = [];
  const nextNum = {};
  Object.values(qmap).forEach(q => { const k = gradeOf(q) + '_' + q.chapter; nextNum[k] = Math.max(nextNum[k] || 0, q.num || 0); });
  // same class + chapter + type + question text = already in the bank (so a corrected file can be uploaded again)
  const sig = (g, ch, type, blocks) => [g, ch, type, blocksToText(blocks).toLowerCase().replace(/\s+/g, ' ').trim()].join('|');
  const seen = new Set(Object.values(qmap).map(q => sig(gradeOf(q), Number(q.chapter), q.type, q.stem)));
  table.slice(1).forEach((r, i) => {
    const rowNo = i + 2;
    if (!r || r.every(c => String(c ?? '').trim() === '')) return;
    const probs = [];
    if (dateCells[i + 1]) probs.push(`Excel changed ${dateCells[i + 1].join(', ')} into a date. Type it again with an apostrophe first, e.g. '3/4`);
    const g = Number(get(r, 'Class').replace(/[^0-9]/g, ''));
    if (!GRADES.includes(g)) probs.push('Class must be 6 to 12');
    const ch = Number(get(r, 'Chapter').replace(/[^0-9]/g, ''));
    if (!(ch >= 1 && ch <= 40)) probs.push('Chapter must be a number');
    const type = normType(get(r, 'Type'));
    if (!type) probs.push('Type must be MCQ, VSA, SA, LA or CASE');
    const qtext = get(r, 'Question');
    if (!qtext) probs.push('Question is empty');
    const marks = get(r, 'Marks') ? Number(get(r, 'Marks')) : (type ? TYPE_MARKS[type] : 1);
    if (!(marks > 0)) probs.push('Marks must be a number');
    const dRaw = get(r, 'Difficulty').toLowerCase();
    const difficulty = dRaw.startsWith('e') ? 'Easy' : dRaw.startsWith('m') ? 'Medium' : dRaw.startsWith('h') ? 'Hard' : '';
    let options = null, answer = null, parts = null;
    if (type === 'MCQ') {
      options = ['Option A', 'Option B', 'Option C', 'Option D'].map(c => get(r, c));
      if (options.some(o => !o)) probs.push('MCQ needs all four options');
      const a = get(r, 'Correct option').toLowerCase().replace(/[()\s.]/g, '').replace(/^option/, '');
      answer = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[a];
      if (answer == null) { probs.push('Correct option must be a, b, c or d'); answer = null; }
    }
    if (type === 'CASE') {
      const ps = ['Part 1', 'Part 2', 'Part 3', 'Part 4'].map(c => get(r, c)).filter(Boolean);
      if (!ps.length) probs.push('Case-based question needs at least Part 1');
      const pm = get(r, 'Part marks').split(/[,;/ ]+/).filter(Boolean).map(Number);
      const defaults = ps.length === 3 ? [1, 1, 2] : ps.map(() => Math.max(1, Math.round(marks / Math.max(1, ps.length))));
      parts = ps.map((x, k) => ({ label: ['i', 'ii', 'iii', 'iv'][k], x, marks: pm[k] > 0 ? pm[k] : defaults[k] }));
    }
    const solution = textToBlocks(get(r, 'Solution'));
    const fin = get(r, 'Final answer');
    if (fin && !solution.some(b => b.t === 'ans')) solution.push({ t: 'ans', x: fin });
    if (probs.length) { bad.push({ rowNo, probs, preview: qtext.slice(0, 70) }); return; }
    const sg = sig(g, ch, type, textToBlocks(qtext));
    if (seen.has(sg)) { dup.push(rowNo); return; }
    seen.add(sg);
    const k = g + '_' + ch; nextNum[k] = (nextNum[k] || 0) + 1;
    const num = nextNum[k];
    const id = `g${pad(g)}c${pad(ch)}q${pad(num)}`;
    ok.push({ id, grade: g, chapter: ch, num, type, marks, difficulty, stem: textToBlocks(qtext), options, answer: type === 'MCQ' ? answer : null, parts,
      solution, finalAnswer: type === 'MCQ' ? '' : solution.filter(b => b.t === 'ans').map(b => b.x).join(' · '), source: 'excel',
      fixed: type === 'MCQ' && looksFixed({ stem: textToBlocks(qtext), options }) ? true : undefined });
  });
  return { ok, bad, dup };
}

      // cells Excel silently turned into dates (e.g. 3/4 -> 4-Mar), outside the Class/Chapter/Marks columns

      if (!isCsv && ws['!ref']) {
        const rg = X.utils.decode_range(ws['!ref']);
        for (let R = rg.s.r + 1; R <= rg.e.r; R++) for (let C = rg.s.c; C <= rg.e.c; C++) {
          const cell = ws[X.utils.encode_cell({ r: R, c: C })];
          if (cell && (cell.t === 'd' || (cell.t === 'n' && cell.z && X.SSF.is_date(cell.z)))) {

        ${ok.length ? `<div class="sp"></div><button class="btn green block" id="bgo">Add ${ok.length} question${ok.length === 1 ? '' : 's'}</button>` : ''}`;

        AC.q = undefined; await syncPool(ok.map(q => q.grade)); close();
        modal(`<h3>Added ${ok.length} questions ✓</h3><p class="small">To make a test from them: <b>Tests → + Create</b>, choose the class, then <b>Fill randomly</b> or <b>Pick by hand</b>.</p><button class="btn block" data-c>OK</button>`, (m2, c2) => m2.querySelector('[data-c]').onclick = () => { c2(); aQuestionsView(); });
      });

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const scale = Math.min(1, 900 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  let out = c.toDataURL('image/png');
  if (out.length > 350000) out = c.toDataURL('image/jpeg', 0.82);
  if (out.length > 700000) out = c.toDataURL('image/jpeg', 0.6);
  return out;
}

      <div class="card"><div class="row"><h3 class="grow">Preview</h3><button class="btn sec sm" id="prev">Update preview</button></div><div class="preview" id="pv"></div></div>
      <div id="qerr"></div><button class="btn block" id="qsave">Save question</button>
      ${isNew ? '' : '<div class="sp"></div><button class="btn danger block" id="qdel">Delete question</button>'}`;
    const read = () => {
      Q.grade = Number($('#qg').value); Q.chapter = Number($('#qc').value); Q.type = $('#qt').value; Q.marks = Number($('#qm').value) || 1; Q.difficulty = $('#qd').value;
      Q.stem = textToBlocks($('#qs').value); Q.solution = textToBlocks($('#qsol').value);
      if ($('[data-o]')) { Q.options = $$('[data-o]').map(i => i.value.trim()); const r = $('input[name=ans]:checked'); Q.answer = r ? Number(r.value) : null; }
      if ($('#qfix')) Q.fixed = $('#qfix').checked;
      $$('[data-pt]').forEach(i => Q.parts[i.dataset.pt].x = i.value.trim()); $$('[data-pm]').forEach(i => Q.parts[i.dataset.pm].marks = Number(i.value) || 0);
    };
    const preview = () => { read(); $('#pv').innerHTML = questionHtml({ ...Q, options: Q.type === 'MCQ' ? Q.options : null }, { reveal: Q.type === 'MCQ', answer: Q.answer }) + `<div class="solbody qtext" style="margin-top:10px">${renderBlocks(Q.solution)}</div>`; fillImages($('#pv')); };
    $('#qg').onchange = () => { read(); Q.chapter = 1; draw(); };
    $('#qt').onchange = () => { read(); Q.marks = TYPE_MARKS[Q.type]; if (Q.type === 'CASE' && !Q.parts.length) Q.parts = [{ label: 'i', x: '', marks: 1 }, { label: 'ii', x: '', marks: 1 }, { label: 'iii', x: '', marks: 2 }]; draw(); };
    $('#prev').onclick = preview;
    if ($('#qfix')) $('#qfix').onchange = () => { fixTouched = true; };
    if ($('#padd')) $('#padd').onclick = () => { read(); Q.parts.push({ label: ['i', 'ii', 'iii', 'iv', 'v', 'vi'][Q.parts.length] || String(Q.parts.length + 1), x: '', marks: 1 }); draw(); };
    $$('[data-prm]').forEach(b => b.onclick = () => { read(); Q.parts.splice(Number(b.dataset.prm), 1); Q.parts.forEach((p, i) => p.label = ['i', 'ii', 'iii', 'iv', 'v', 'vi'][i] || String(i + 1)); draw(); });
    $$('[data-addimg]').forEach(inp => inp.onchange = () => busy(null, async () => {
      const file = inp.files[0]; if (!file) return;
      const data = await compressImage(file); const id = 'img_' + now().toString(36);
      await setDoc(D('images/' + id), { data }); IMG[id] = data;
      const ta = $('#' + inp.dataset.addimg); ta.value = ta.value.replace(/\s*$/, '') + `\n[img:${id}]`; preview(); toast('Figure added');
    }));
    $('#qsave').onclick = () => busy($('#qsave'), async () => {
      read();
      const err = m => $('#qerr').innerHTML = `<div class="err">${esc(m)}</div>`;
      if (!Q.stem.length) return err('Type the question.');
      if (Q.type === 'MCQ' && (Q.options.some(o => !o) || Q.answer == null)) return err('Fill all four options and tick the correct one.');
      if (Q.type === 'MCQ' && !fixTouched && !Q.fixed && looksFixed(Q)) Q.fixed = true;
      const qmap = await aQ();
      let id = q.id;
      if (!id) {
        const nums = Object.values(qmap).filter(x => gradeOf(x) === Q.grade && x.chapter === Q.chapter).map(x => x.num || 0);
        Q.num = Math.max(0, ...nums) + 1; id = `g${pad(Q.grade)}c${pad(Q.chapter)}q${pad(Q.num)}`;
        while (qmap[id]) { Q.num++; id = `g${pad(Q.grade)}c${pad(Q.chapter)}q${pad(Q.num)}`; }
      }
      const data = clean({
        grade: Q.grade, chapter: Q.chapter, num: Q.num || null, type: Q.type, marks: Q.marks, difficulty: Q.difficulty || '', stem: Q.stem,
        options: Q.type === 'MCQ' ? Q.options : null, answer: Q.type === 'MCQ' ? Q.answer : null,
        parts: Q.type === 'CASE' ? Q.parts : null, solution: Q.solution, fixed: Q.type === 'MCQ' && Q.fixed ? true : undefined, source: q.source,
        finalAnswer: Q.type === 'MCQ' ? '' : Q.solution.filter(b => b.t === 'ans').map(b => b.x).join(' · '), updatedAt: now()
      });
      await setDoc(D('questions/' + id), data);
      qmap[id] = { id, ...data };
      const affected = (await aTests()).filter(t => (t.qids || []).includes(id));
      if (affected.length) await saveTests(affected.map(t => ({ ...t })));
      if (isNew || gradeOf(q) === Q.grade) await syncPool([Q.grade], [...new Set([Q.chapter, q.chapter].filter(Boolean))]);
      else await syncPool([Q.grade, gradeOf(q)]);
      toast(affected.length ? `Saved ✓ · updated ${affected.length} test${affected.length > 1 ? 's' : ''}` : 'Saved ✓');
      aQuestionsView();
    });
    if ($('#qdel')) $('#qdel').onclick = async () => {
      const affected = (await aTests()).filter(t => (t.qids || []).includes(q.id));
      if (!(await confirmBox('Delete this question?', affected.length ? `It will also be removed from: ${affected.map(t => esc(t.title)).join(', ')}.` : 'This cannot be undone.', 'Delete', true))) return;
      await busy($('#qdel'), async () => {
        await deleteDoc(D('questions/' + q.id));
        const qmap = await aQ(); delete qmap[q.id];
        if (affected.length) await saveTests(affected.map(t => ({ ...t, qids: t.qids.filter(x => x !== q.id) })));
        await syncPool([gradeOf(q)], [q.chapter]);
        toast('Deleted'); aQuestionsView();
      });
    };
    preview();
  };
  draw();
}

// "selected students" announcements are copied into each chosen student's private inbox, so other students can't read them
async function saveAnnouncement(id, data, old) {
  const all = await aAnns(true);
  const ops = [];
  if (data.pinned) all.filter(x => x.pinned && x.id !== id).forEach(x => {
    ops.push(['update', 'announcements/' + x.id, { pinned: false }]);
    (x.audience === 'some' ? x.targets || [] : []).forEach(s => ops.push(['set', `students/${s}/inbox/${x.id}`, clean({ ...x, id: undefined, targets: [], pinned: false })]));
  });
  ops.push(['set', 'announcements/' + id, data]);
  const oldT = old && old.audience === 'some' ? old.targets || [] : [];
  const newT = data.audience === 'some' ? data.targets : [];
  oldT.filter(s => !newT.includes(s)).forEach(s => ops.push(['delete', `students/${s}/inbox/${id}`]));
  newT.forEach(s => ops.push(['set', `students/${s}/inbox/${id}`, { ...data, targets: [] }]));   // copy without other students' IDs
  await commitOps(ops); AC.anns = undefined;
}
async function removeAnnouncement(a) {
  await commitOps([['delete', 'announcements/' + a.id], ...(a.audience === 'some' ? a.targets || [] : []).map(s => ['delete', `students/${s}/inbox/${a.id}`])]);
  AC.anns = undefined;
}

function getPath(o, p) { return p.reduce((a, k) => a[k], o); }
function setPath(o, p, v) { const last = p[p.length - 1]; getPath(o, p.slice(0, -1))[last] = v; }
function blankLike(x) { if (Array.isArray(x)) return x.length && typeof x[0] === 'string' ? [''] : []; if (x && typeof x === 'object') { const r = {}; for (const [k, v] of Object.entries(x)) r[k] = k === 'type' || k === 'color' || k === 'tone' ? v : blankLike(v); return r; } return typeof x === 'number' ? 0 : ''; }
function jf(v, path, key) {
  const P = esc(JSON.stringify(path));
  if (Array.isArray(v)) {
    return `<fieldset><legend>${esc(GLABEL[key] || key)}</legend>${v.map((x, i) => `<div class="arritem">${jf(x, [...path, i], key === 'bullets' ? 'Bullet' : '')}

      ${v.length ? `<button class="btn sec sm" data-add='${P}'>+ Add</button>` : ''}</fieldset>`;

  }
  const label = GLABEL[key] || key;
  if (key === 'color' || key === 'tone') return `<label class="field"><span>${esc(label)}</span><select class="input" data-p='${P}'>${(key === 'color' ? COLORS : TONES).map(c => `<option ${c === v ? 'selected' : ''}>${c}</option>`).join('')}</select></label>`;
  if (typeof v === 'number') return `<label class="field"><span>${esc(label)}</span><input class="input" type="number" step="any" data-p='${P}' data-num="1" value="${v}"></label>`;
  return `<label class="field">${label ? `<span>${esc(label)}</span>` : ''}${String(v).length > 60 ? `<textarea class="input" data-p='${P}' style="min-height:80px">${esc(v)}</textarea>` : `<input class="input" data-p='${P}' value="${esc(v)}">`}</label>`;

async function adminSend(sid, s, text, extra = {}) {
  const at = now();
  const b = writeBatch(db);
  b.set(D(`chats/${sid}/messages/${msgId()}`), clean({ from: 'a', text, at, kind: 'text', ...extra }));
  b.set(D('chats/' + sid), { sid, name: (s && s.name) || sid, grade: s ? studentGrade(s) : 10, lastAt: at, lastText: text.slice(0, 140), lastFrom: 'a', aAt: at, aRead: at }, { merge: true });
  await b.commit();
}
async function aThread(sid, back) {
  const studs = await aStudents();
  const s = studs.find(x => x.id === sid) || { id: sid, name: sid };
  const pg = aShell('messages', s.name || sid, `<div class="chat" id="msgs">${spinner()}</div>`, { back: back || (() => aMessages()) });
  $('.topbar .sub').textContent = `Class ${studentGrade(s)} · ID: ${sid}`;
  const bar = document.createElement('div'); bar.className = 'chatbar admin';
  bar.innerHTML = `<div class="in"><textarea class="input" id="ctext" rows="1" maxlength="1000" placeholder="Reply to ${esc((s.name || sid).split(' ')[0])}…"></textarea><button class="btn" id="csend" aria-label="Send">${ICON.send}</button></div>`;
  $('#app').appendChild(bar);
  const place = () => { pg.style.paddingBottom = (bar.offsetHeight + 16) + 'px'; };
  const ta = $('#ctext'), box = $('#msgs');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; place(); };
  place();
  const tests = await aTests();
  const reqState = {};      // tid -> 'open' | 'locked' | 'none'
  const reqCard = m => {
    const st = reqState[m.tid];
    const action = m.done || st === 'open' ? '<div class="tiny" style="margin-top:6px">✓ Solutions are open for this student</div>'
      : st === 'none' ? '<div class="tiny" style="margin-top:6px">No submitted attempt found for this test.</div>'
      : `<button class="btn green sm" style="margin-top:8px" data-opensol="${esc(m.tid)}" data-mid="${esc(m.id)}">🔓 Open solutions for ${esc((s.name || sid).split(' ')[0])}</button>`;
    return `🔓 <b>Asked to open solutions</b><br>${esc(m.title || m.tid)}${action}`;
  };
  let marked = 0, msgs = [];
  const paint = () => {
    box.innerHTML = msgs.length ? bubblesHtml(msgs, 'a', reqCard) : '<div class="card empty" style="margin-top:20px">No messages yet. Write the first one below.</div>';
    window.scrollTo(0, document.body.scrollHeight);
    $$('[data-opensol]', box).forEach(b => b.onclick = () => busy(b, async () => {
      const tid = b.dataset.opensol, t = tests.find(x => x.id === tid);
      await updateDoc(D(`attempts/${sid}_${tid}_1`), { solutionsOpen: true });
      await updateDoc(D(`chats/${sid}/messages/${b.dataset.mid}`), { done: true });
      reqState[tid] = 'open'; AC.atts = undefined;
      await adminSend(sid, s, `I've opened the solutions for “${t ? t.title : tid}”. Open the test to see them. ✓`);
      toast('Solutions opened and student told');
    }));
  };
  listen('view', query(C(`chats/${sid}/messages`), orderBy('at', 'desc'), limit(150)), async snap => {
    msgs = snapDocs(snap).reverse();
    const pending = [...new Set(msgs.filter(m => m.kind === 'solreq' && !m.done && !reqState[m.tid]).map(m => m.tid))];
    for (const tid of pending) {
      const a = await getD(`attempts/${sid}_${tid}_1`).catch(() => null); const t = tests.find(x => x.id === tid);
      reqState[tid] = !a ? 'none' : (a.solutionsOpen === true || (t && t.solutionsOpen === true)) ? 'open' : 'locked';
    }
    paint();
    const th = (AC.chats || []).find(x => x.id === sid);
    const last = msgs.filter(m => m.from === 's').pop();
    if (last && th && (th.aRead || 0) < last.at && marked !== last.at) { marked = last.at; updateDoc(D('chats/' + sid), { aRead: now() }).catch(e => console.warn(e)); }
  }, () => { box.innerHTML = '<div class="card">Messages need the new Firestore rules. Paste and publish firestore-rules.txt, then reload.</div>'; });
  const send = () => busy($('#csend'), async () => { const text = ta.value.trim(); if (!text) return; await adminSend(sid, s, text.slice(0, 1000)); ta.value = ''; ta.oninput(); });
  $('#csend').onclick = send;
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } };
}

// ---------- REMINDERS ----------
// reminders/{id}: what was sent and to whom (admin only) · students/{sid}/reminders/{id}: the copy that student sees on Home.
// A reminder disappears for the student by itself once they take the test, or save their profile.
const aRems = f => aLoad('rems', async () => (await listC('reminders')).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), f);
function remDone(r, s, tidAtts) { return r.kind === 'test' ? (tidAtts[r.tid] || new Set()).has(s.id) : (s.selfUpdatedAt || 0) >= (r.createdAt || 0); }
async function takersOf(tids) {               // tid -> Set of student IDs who have submitted it (any attempt)
  const out = {};
  await Promise.all([...new Set(tids)].map(async tid => { out[tid] = new Set((await listC('attempts', where('tid', '==', tid))).map(a => a.sid)); }));
  return out;
}
async function sendReminder(base, targets) {
  const id = 'r_' + now().toString(36) + Math.random().toString(36).slice(2, 5);
  const copy = clean({ kind: base.kind, tid: base.tid, title: base.title, note: base.note || '', due: base.due || '', createdAt: now() });
  const ops = [['set', 'reminders/' + id, clean({ ...copy, grade: base.grade, label: base.label, targets })]];
  targets.forEach(sid => ops.push(['set', `students/${sid}/reminders/${id}`, copy]));
  await commitOps(ops);
  AC.rems = undefined;
}
async function deleteReminder(r) {
  await commitOps([['delete', 'reminders/' + r.id], ...(r.targets || []).map(sid => ['delete', `students/${sid}/reminders/${r.id}`])]);
  AC.rems = undefined;
}

function pickerHtml(list, sel) {
  return list.map(s => `<label class="row" style="padding:5px 0;cursor:pointer"><input type="checkbox" data-ps="${esc(s.id)}" ${sel.has(s.id) ? 'checked' : ''}> ${esc(s.name || s.id)} <span class="tiny muted">Class ${studentGrade(s)} · ${esc(s.id)}</span></label>`).join('') || '<div class="tiny muted">No students.</div>';
}

// ---------- PRACTICE MOCKS ----------
// Only MCQs that are in none of the tests go into the pool, so practising never gives away test answers.
function poolEligible(qmap, tests, g) {
  const inTests = new Set(tests.flatMap(t => t.qids || []));
  return Object.values(qmap).filter(q => gradeOf(q) === g && q.type === 'MCQ' && Array.isArray(q.options) && q.options.length === 4 && q.options.every(o => String(o || '').trim())
    && q.answer != null && !inTests.has(q.id));
}
async function buildPools(grades, onlyCh) {
  const [qmap, tests] = await Promise.all([aQ(), aTests()]);
  const ops = [];
  for (const g of [...new Set(grades.map(Number))]) {
    const byCh = {}; poolEligible(qmap, tests, g).forEach(q => (byCh[q.chapter] = byCh[q.chapter] || []).push(q));
    const existing = await listC('pool', where('grade', '==', g));
    const chs = [...new Set([...Object.keys(byCh).map(Number), ...existing.map(d => Number(d.chapter))])].filter(c => !onlyCh || onlyCh.map(Number).includes(c));
    for (const c of chs) {
      const id = poolId(g, c);
      let list = (byCh[c] || []).sort(qSort);
      if (!list.length) { if (existing.some(d => Number(d.chapter) === c)) ops.push(['delete', 'pool/' + id], ['delete', 'poolKeys/' + id]); continue; }
      const mk = l => [clean({ grade: g, chapter: c, count: l.length, updatedAt: now(),
          items: l.map(q => ({ qid: q.id, chapter: c, type: 'MCQ', marks: Number(q.marks) || 1, stem: q.stem || [], options: q.options, fixed: q.fixed === true ? true : undefined })) }),
        clean({ grade: g, chapter: c, updatedAt: now(), items: Object.fromEntries(l.map(q => [q.id, { answer: q.answer, solution: q.solution || [] }])) })];
      let [p, k] = mk(list);
      while (list.length > 1 && (JSON.stringify(p).length > 900000 || JSON.stringify(k).length > 900000)) { list = list.slice(0, Math.floor(list.length * 0.8)); [p, k] = mk(list); }   // stay under Firestore's 1 MB per document
      ops.push(['set', 'pool/' + id, p], ['set', 'poolKeys/' + id, k]);
    }
  }
  await commitOps(ops, 8);
}
async function syncPool(grades, chs) {          // keeps the practice pool in step after questions or tests change
  if (!S.settings.practiceOn) return;
  try { await buildPools(grades, chs); }
  catch (e) { console.warn('pool', e); toast('Practice questions could not be updated: ' + errMsg(e), 5000); }
}

          <li>Turn it off any time: students stop seeing the option straight away.</li></ul></div>
      <div class="card"><div class="row"><h3 class="grow" style="margin:0">Questions students can practise</h3><button class="btn sec sm" id="pupd" ${pools === null ? 'disabled' : ''}>Update now</button></div>

          ${rows.map(r => `<tr><td><b>Class&nbsp;${r.g}</b>${r.at ? `<div class="tiny muted">updated ${fmtDay(r.at)}</div>` : ''}</td><td class="num">${r.mcq}</td><td class="num">${r.elig}</td><td class="num">${r.pooled}${r.chs ? ` <span class="tiny muted">(${r.chs} ch)</span>` : ''}</td></tr>`).join('')}</table></div>`
          : '<div class="empty">No MCQs in the question bank yet.</div>'}
        <p class="tiny muted" style="margin-bottom:0">Tip: once students have practised a question they know its answer, so pick other questions when you make an official test.</p></div>

      <div class="card" style="padding:4px 14px">${recent.length ? recent.map(p => { const s = studs.find(x => x.id === p.sid);

function exportPractice(list, studs) {
  const rows = [['Student ID', 'Name', 'Class', 'Practice mock', 'Chapters', 'Questions', 'Score', 'Max', 'Percent', 'Time (min)', 'Submitted']];
  list.slice().sort((a, b) => String(a.sid).localeCompare(b.sid) || (a.submittedAt || 0) - (b.submittedAt || 0)).forEach(p => {
    const s = studs.find(x => x.id === p.sid) || {};
    rows.push([p.sid, s.name || '(deleted)', p.grade ?? '', p.title, (p.chapters || []).join(' '), (p.qids || []).length, p.score ?? '', p.max ?? '', pct(p.score || 0, p.max || 1), Math.round((p.timeTaken || 0) / 60), fmtDate(p.submittedAt)]);
  });
  download(`practice-mocks-${stamp()}.csv`, csv(rows), 'text/csv;charset=utf-8'); toast('Practice mocks exported');
}

          return `<div class="vrow"><div class="row"><div class="grow"><div class="t">${n}. ${esc(chName(g, n))}</div>${vs.length ? '' : '<div class="tiny muted">No video yet</div>'}</div>
            <button class="btn ${vs.length ? 'ghost' : 'sec'} sm" data-addv="${n}">${vs.length ? '+ Another' : '+ Add video'}</button></div>
            ${vs.map(v => { const p = ytParse(v.link); return `<div class="vitem" data-editv="${esc(v.id)}">${p && p.id ? `<img src="https://i.ytimg.com/vi/${esc(p.id)}/mqdefault.jpg" alt="" loading="lazy">` : `<div class="vth">${ICON.play}</div>`}
              <div class="grow" style="min-width:0"><div class="small"><b>${esc(v.title || 'Video')}</b></div><div class="tiny muted clip">${esc(v.link)}</div></div><span class="btn ghost sm">Edit</span></div>`; }).join('')}</div>`; }).join('')}</div>`
          : `<div class="card empty">No chapters for Class ${g} yet. Add the chapter names first in <b>Classes & chapters</b>.<div class="sp"></div><button class="btn sec sm" id="goch">Open Classes & chapters</button></div>`}`;
      bindGradeChips(pg, v => { g = AC.g = v; draw(); });
      if ($('#goch')) $('#goch').onclick = () => aNav('classes');
      $$('[data-addv]', pg).forEach(b => b.onclick = () => videoForm(null, g, Number(b.dataset.addv)));
      $$('[data-editv]', pg).forEach(b => b.onclick = () => videoForm(all.find(r => r.id === b.dataset.editv), g));
    };
    draw();
  });
}
function videoForm(v, g, ch) {
  v = v || { grade: g, chapter: ch || 1, type: 'Video', title: 'One-shot video', link: '' };
  const vg = gradeOf(v);
  modal(`<h3>${v.id ? 'Edit video' : 'Add a chapter video'}</h3>
    <p class="small muted" style="margin-top:0">Class ${vg}</p>
    <label class="field"><span>Chapter</span><select class="input" id="vc">${chapterOptions(vg, v.chapter, [v.chapter])}</select></label>
    <label class="field"><span>YouTube link</span><input class="input" id="vl" inputmode="url" autocapitalize="none" value="${esc(v.link)}" placeholder="https://youtu.be/…"></label>
    <p class="tiny muted" style="margin:-6px 0 10px">On YouTube: open the video → <b>Share</b> → <b>Copy link</b>, then paste it here.</p>
    <label class="field"><span>Title students see</span><input class="input" id="vt" maxlength="80" value="${esc(v.title || '')}" placeholder="One-shot video"></label>
    <div id="vpv"></div><div id="verr"></div>
    <div class="row" style="justify-content:flex-end">${v.id ? '<button class="btn danger" id="vdel">Delete</button><span class="grow"></span>' : ''}<button class="btn sec" data-c>Cancel</button><button class="btn" id="vsave">Save</button></div>`, (m, close) => {
    const pv = () => {
      const raw = $('#vl', m).value.trim(); const p = ytParse(raw);
      $('#vpv', m).innerHTML = !raw ? '' : p ? `<div class="vitem" style="cursor:default;margin:0 0 10px">${p.id ? `<img src="https://i.ytimg.com/vi/${esc(p.id)}/mqdefault.jpg" alt="">` : `<div class="vth">${ICON.play}</div>`}<div class="small">✓ ${p.id ? 'YouTube video found' : 'YouTube playlist found'}${p.start ? ` (starts at ${fmtDur(p.start)})` : ''}</div></div>`
        : '<div class="err">This is not a YouTube video link. Copy it from YouTube → Share → Copy link.</div>';
    };
    pv(); $('#vl', m).oninput = pv;
    m.querySelector('[data-c]').onclick = close;
    $('#vsave', m).onclick = () => busy($('#vsave', m), async () => {
      const link = $('#vl', m).value.trim();
      if (!ytParse(link)) { $('#verr', m).innerHTML = '<div class="err">Paste a YouTube link, e.g. https://youtu.be/abc123XYZ_0</div>'; return; }
      const data = { grade: vg, chapter: Number($('#vc', m).value), type: 'Video', title: $('#vt', m).value.trim() || 'One-shot video', link, updatedAt: now(), createdAt: v.createdAt || now() };
      await setDoc(D('resources/' + (v.id || 'v_' + now().toString(36))), data);
      AC.res = undefined; close(); toast('Video saved ✓'); aVideos();
    });
    if (v.id) $('#vdel', m).onclick = async () => { close(); if (await confirmBox('Delete this video?', 'Students will no longer see it. (The video stays on YouTube.)', 'Delete', true)) await busy(null, async () => { await deleteDoc(D('resources/' + v.id)); AC.res = undefined; toast('Deleted'); aVideos(); }); };
  });
}

</script>
